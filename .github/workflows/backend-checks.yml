name: Kiểm tra backend

on:
  push:
    branches:
      - main
      - feat/cloudflare-ai-backend
      - feat/same-origin-access
      - fix/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Kiểm thử và build backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Thiết lập Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cài đúng phiên bản đã khóa
        run: npm ci
      - name: Chạy kiểm thử backend
        run: npm test
      - name: Kiểm tra build Wrangler không triển khai
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: npm run build

