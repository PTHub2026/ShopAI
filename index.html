const ICONS={create:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',video:'<rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 9 5-3v12l-5-3"/>',ai:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18"/>',library:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/>',posts:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',analytics:'<path d="M3 3v18h18M8 17v-5M13 17V7M18 17v-8"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>',response:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',bot:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8M9 14h.01M15 14h.01"/>',accounts:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/>',groups:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',hashtags:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82 2 2 0 1 1-2.83 2.83 1.65 1.65 0 0 0-2.82 1.17 2 2 0 1 1-4 0A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33 2 2 0 1 1-2.83-2.83A1.65 1.65 0 0 0 4.6 15a2 2 0 1 1 0-4"/>',members:'<path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6Z"/><path d="m9 12 2 2 4-4"/>',feedback:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',admin:'<circle cx="12" cy="12" r="10"/><path d="m16 8-6 2-2 6 6-2Z"/>'};
const GRP_COLOR={'NỘI DUNG':'c-purple','KHO':'c-amber','ĐĂNG BÀI':'c-blue','TƯƠNG TÁC':'c-green','THIẾT LẬP':'c-slate','KHÁC':'c-rose'};
const svgIcon=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p||''}</svg>`;
function toggleSidebar(){const a=document.querySelector('.app');if(!a)return;a.classList.toggle('sb-collapsed');try{LS.setItem('pdk_sb_collapsed',a.classList.contains('sb-collapsed')?'1':'0')}catch(e){}}
function managedApp(){return !!document.querySelector('meta[name="shopai-ai-endpoint"]')?.content}
function addLogoutButton(){
 const pf=document.querySelector('header .pf');if(!pf||document.getElementById('account_actions'))return;
 const menu=document.createElement('details');menu.id='account_actions';menu.className='account-menu';
 menu.innerHTML='<summary aria-label="Tài khoản ShopPost"><span>Tài khoản ShopPost</span></summary><div class="account-popover"><p class="small muted" id="account_state">Đã đăng nhập ShopPost</p><b id="account_identity">Tài khoản hiện tại</b><button type="button" id="switch_account_btn">Đổi tài khoản</button><button type="button" id="login_btn" hidden>Đăng nhập lại</button><button type="button" id="logout_btn" class="account-signout">Đăng xuất ShopPost</button></div>';
 pf.before(menu);menu.querySelector('summary').prepend(pf);
 document.getElementById('switch_account_btn').onclick=()=>{menu.open=false;logoutShopPost(true);};
 document.getElementById('logout_btn').onclick=()=>{menu.open=false;logoutShopPost();};
 document.getElementById('login_btn').onclick=()=>{saveDraft();location.assign('/');};
 menu.addEventListener('toggle',()=>{if(menu.open){closeActionMenus(menu);refreshAccountMenu();}});
 document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.open=false;document.querySelectorAll('details.action-menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){const open=document.querySelector('details.action-menu[open],#account_actions[open]');if(open){e.preventDefault();open.open=false;open.querySelector('summary')?.focus();}}});
}
function closeActionMenus(keep){document.querySelectorAll('details.action-menu[open],#account_actions[open]').forEach(d=>{if(d!==keep)d.open=false;});}
let accountMenuRequest=0;
async function refreshAccountMenu(){
 const sequence=++accountMenuRequest;let active=false,name='',message='Chưa xác nhận phiên đăng nhập';
 try{const session=await cloudRequest('/session');active=session.userScope===APP_SCOPE;name=session.account?.name||'Tài khoản ShopPost';message=active?'Đã đăng nhập ShopPost':'Tài khoản đã thay đổi';}
 catch(e){message=[401,403].includes(e.status)?'Phiên đăng nhập đã hết hạn':'Chưa kiểm tra được phiên đăng nhập';}
 if(sequence!==accountMenuRequest)return;
 const state=document.getElementById('account_state');if(!state)return;state.textContent=message;document.getElementById('account_identity').textContent=active?name:'';
 document.getElementById('login_btn').hidden=active;document.getElementById('logout_btn').hidden=!active;document.getElementById('switch_account_btn').hidden=!active;
}
let accountLogoutBusy=false;
async function logoutShopPost(switchAccount=false){
 if(accountLogoutBusy||!managedApp())return;
 if(!confirm((switchAccount?'Đổi tài khoản ShopPost? Bạn sẽ kết thúc phiên hiện tại và mở trang đăng nhập.':'Đăng xuất khỏi ShopPost?')+' Bản nháp và các kênh đã kết nối của shop được giữ lại.'))return;
 accountLogoutBusy=true;saveDraft();
 const buttons=['login_btn','logout_btn','switch_account_btn'].map(id=>document.getElementById(id)).filter(Boolean);buttons.forEach(b=>b.disabled=true);
 try{
  const r=await fetch('/auth/logout',{method:'POST',credentials:'same-origin',redirect:'error',headers:{'Content-Type':'application/json'},body:'{}'});
  const data=await r.json().catch(()=>null);if(!r.ok||data?.ok!==true)throw Error(data?.error||'Chưa đăng xuất được. Vui lòng thử lại.');
  stopJobWatch();location.assign(data.next==='/cdn-cgi/access/logout'?data.next:'/');
 }catch(e){toast(e.message||'Không thể đăng xuất. Phiên hiện tại được giữ.');}
 finally{accountLogoutBusy=false;buttons.forEach(b=>b.disabled=false);}
}
async function openShopPostLogin(){
 if(!managedApp())return;
 const viewAt=viewGeneration,modalAt=modalGeneration;
 try{
  const session=await cloudRequest('/session');
  if(viewAt!==viewGeneration||modalAt!==modalGeneration)return;
  if(session.userScope!==APP_SCOPE)return toast('Tài khoản đã thay đổi. Hãy tải lại trang.');
  modal(`<h3>Đăng nhập ShopPost</h3><p>Bạn đang đăng nhập${session.account?.name?' bằng tài khoản <b>'+esc(session.account.name)+'</b>':''}.</p><p class="small muted">Để dùng tài khoản ShopPost khác, hãy đăng xuất rồi đăng nhập lại. Để thêm Facebook, YouTube hoặc Zalo OA cho shop, chọn Thêm tài khoản.</p><div class="row"><button class="btn pri" onclick="logoutShopPost()">Đăng nhập tài khoản khác</button><button class="btn" onclick="openAddAccount()">Thêm tài khoản nền tảng</button><button class="btn" onclick="closeModal()">Đóng</button></div>`);
 }catch(e){if(viewAt!==viewGeneration||modalAt!==modalGeneration)return;if([401,403].includes(e.status)){saveDraft();location.assign('/');return;}toast(e.message||'Không tải được phiên đăng nhập.');}
}
const ZALO_REPLACEMENT_NOTICE='Chọn OA khác sẽ thay thế Zalo OA hiện tại của shop.';
async function openAddAccount(){
 if(!managedApp()||!SHOP.ready)return toast('Hãy chọn shop trước khi thêm tài khoản.');
 const shop=SHOP.id,viewAt=viewGeneration,modalAt=modalGeneration;
 try{
  const results=await Promise.allSettled([socialRequest('providers'),cloudRequest('/channels'),googleRequest('accounts')]);
  if(SHOP.id!==shop||viewAt!==viewGeneration||modalAt!==modalGeneration)return;
  const [meta,zalo,google]=results.map(r=>r.status==='fulfilled'?r.value:null),canConnect=shopCan('channels.configure_token');
  const enabled={facebook:canConnect&&meta?.facebook?.enabled,instagram:canConnect&&meta?.instagram?.enabled,zalo:canConnect&&zalo?.setup?.zalo?.configured,youtube:canConnect&&google?.configured,telegram:canConnect&&meta?.telegram?.enabled};
  const existingZalo=Array.isArray(zalo?.channels)
   ?zalo.channels.some(a=>a.provider==='zalo'&&connectionState(a.status,a.external_id||a.oa_id)!=='revoked')
   :CONNECTIONS?.shop===shop&&CONNECTIONS.accounts.some(a=>a.provider==='zalo'&&a.state!=='revoked');
  modal(`<h3>Kết nối kênh</h3><p>Chọn nền tảng để kết nối cho shop <b>${esc(SHOP.name)}</b>. Tài khoản đăng nhập ShopPost hiện tại được giữ.</p>${!canConnect?'<p role="status">Chỉ chủ shop hoặc quản lý có quyền kết nối tài khoản.</p>':''}<div class="grid">${['facebook','instagram','zalo','youtube','telegram'].map(provider=>{const count=CONNECTIONS?.shop===shop?CONNECTIONS.accounts.filter(a=>a.provider===provider&&a.state==='connected').length:0;const replace=provider==='zalo'&&existingZalo;return `<div class="ch">${pfIcon(provider)}<div style="flex:1"><b>${esc(PF[provider].n)}</b><div class="small muted">${replace?ZALO_REPLACEMENT_NOTICE:count?count+' tài khoản đã kết nối thật':'Thêm tài khoản mới hoặc cấp lại quyền'}</div></div><button class="btn pri sm" ${enabled[provider]?'':'disabled title="Chưa đủ quyền hoặc cấu hình kết nối"'} onclick="connectAdditionalAccount('${provider}','${escAttr(shop)}')">${replace?'Đổi Zalo OA':count?'Kết nối thêm':'Kết nối'}</button></div>`;}).join('')}</div><p class="small muted">Telegram dùng Bot Token và Chat ID. Các nền tảng còn lại mở trang cấp quyền chính thức.</p><button class="btn" onclick="closeModal()">Đóng</button>`);
 }catch(e){toast('Chưa mở được danh sách tài khoản. Vui lòng thử lại.');}
}
async function connectAdditionalAccount(provider,expectedShop=SHOP.id){
 if(SHOP.id!==expectedShop)return toast('Shop đã thay đổi. Hãy mở lại Thêm tài khoản.');
 if(!shopCan('channels.configure_token'))return toast('Bạn chưa có quyền kết nối tài khoản.');
 if(provider==='facebook'||provider==='instagram')return socialConnectMeta();
 if(provider==='zalo')return zaloConnect();
 if(provider==='youtube')return googleConnect();
 if(provider==='telegram'){closeModal();if(route==='accounts'){const tools=$('#connection_tools');if(tools)tools.open=true;$('#tg_token')?.focus();}else{window.pendingChannelTool='telegram';go('accounts');}}
}
const APP_SCOPE=(()=>{const v=document.querySelector('meta[name="shopai-user-scope"]')?.content||'';return /^[a-f0-9]{64}$/.test(v)?v:''})();
function demoAction(){if(window.QA_RUNNING||!managedApp())return true;toast('Chức năng kênh này chưa được kết nối. Chưa thực hiện thao tác trên nền tảng.');return false}
function localKey(key){return key+(managedApp()?':'+(APP_SCOPE||'unverified'):'')}
/* ===== DỰ ÁN (project): nhóm dữ liệu làm việc riêng trong trình duyệt này =====
   Dự án "Mặc định" (id='default') giữ nguyên các khóa lưu trữ cũ (không hậu tố) nên dữ liệu hiện có được bảo toàn.
   Mỗi dự án khác có hậu tố "::<id>" riêng cho KEY/IDB/DKEY/VKEY → dữ liệu tách biệt hoàn toàn. */
function _lsGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function _lsSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function _lsDel(k){try{window.localStorage.removeItem(k)}catch(e){}}
const PROJ_PFX=managedApp()?':'+(APP_SCOPE||'unverified'):'_local';
const PROJ_LKEY='pdk_projects'+PROJ_PFX, PROJ_CKEY='pdk_proj_cur'+PROJ_PFX;
function loadProjects(){let list=null;try{list=JSON.parse(_lsGet(PROJ_LKEY))}catch(e){}if(!Array.isArray(list))list=[];list=list.filter(p=>p&&typeof p.id==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(p.id)&&typeof p.name==='string'&&p.name);if(!list.some(p=>p.id==='default'))list.unshift({id:'default',name:'Mặc định'});return list}
let PROJECTS=loadProjects();
let CUR_PROJ=(function(){const c=_lsGet(PROJ_CKEY);return PROJECTS.some(p=>p.id===c)?c:'default'})();
function saveProjects(){_lsSet(PROJ_LKEY,JSON.stringify(PROJECTS));_lsSet(PROJ_CKEY,CUR_PROJ)}
const PROJ_SUFFIX=CUR_PROJ==='default'?'':'::'+CUR_PROJ;
const IDB_NAME=(APP_SCOPE?'pdk_pro_'+APP_SCOPE:(managedApp()?'pdk_unverified':'pdk_pro'))+PROJ_SUFFIX;
function renderProjects(){const sel=document.getElementById('proj_sel');if(!sel)return;let h=PROJECTS.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===CUR_PROJ?' selected':'')+'>Dự án: '+esc(p.name)+'</option>').join('');h+='<option value="__new">➕ Tạo dự án mới…</option>';h+='<option value="__rename">✏️ Đổi tên dự án hiện tại…</option>';if(CUR_PROJ!=='default')h+='<option value="__del">🗑️ Xóa dự án hiện tại…</option>';sel.innerHTML=h}
function projOnChange(v){renderProjects();if(v==='__new')return projCreate();if(v==='__rename')return projRename();if(v==='__del')return projDelete();if(v===CUR_PROJ||!PROJECTS.some(p=>p.id===v))return;CUR_PROJ=v;saveProjects();location.reload()}

const CLOUD_FILE_TYPES=new Set(['image/jpeg','image/png','image/gif','image/webp','video/mp4','video/webm','video/quicktime']);

async function draftFileBlob(media){

// may(): chỉ ẩn nút để hướng dẫn khi đã biết vai trò; chưa tải được thì vẫn hiện và để máy chủ quyết định.
const may=a=>!SHOP.ready||shopCan(a);
const shopHeaders=()=>SHOP.id?{'X-ShopPost-Shop':SHOP.id}:{};
const shopValid=s=>!!s&&typeof s==='object'&&typeof s.id==='string'&&SHOP_ID_RE.test(s.id)&&typeof s.name==='string'&&typeof s.role==='string';
const roleLabel=r=>SHOP.roles[r]||r||'—';
const STATUS_VI={draft:'Bản nháp',pending_review:'Chờ duyệt',approved:'Đã duyệt'};
const cloudReadOnly=()=>SHOP.ready&&!shopCan('drafts.create')&&!shopCan('drafts.edit_own')&&!shopCan('drafts.edit_any');
function shopUse(s){SHOP.id=s.id;SHOP.name=s.name;SHOP.role=s.role;SHOP.roleLabel=typeof s.roleLabel==='string'&&s.roleLabel?s.roleLabel:roleLabel(s.role);SHOP.canPublish=s.canPublish===true;SHOP.permissions=Array.isArray(s.permissions)?s.permissions.filter(x=>typeof x==='string'):[];SHOP.status=typeof s.status==='string'?s.status:'active';try{LS.setItem('pdk_shop:'+(APP_SCOPE||'unverified'),s.id)}catch(e){}}
function shopRefresh(){stopJobWatch();CONNECTIONS=null;REALCH=[];syncRealChannels();startJobWatch();channelsLoad();SHOP.members=[];SHOP.invites=[];SHOP.lastInvite=null;CLOUD.items=[];CLOUD.nextCursor=null;shopMenu();renderShopBox();render(route)}
function shopMenu(){const cfg=MENU.find(g=>g[0]==='KHÁC');if(!cfg)return;const has=cfg[1].some(m=>m[0]==='admin');if(SHOP.admin&&!has)cfg[1].push(['admin','🧭','Quản trị nền tảng']);if(!SHOP.admin&&has)cfg[1]=cfg[1].filter(m=>m[0]!=='admin');navRender()}
function renderShopBox(){const box=$('#shop_box'),m=$('#mshop');if(!box)return;if(!managedApp()){box.hidden=true;return}box.hidden=false;const opts=SHOP.shops.map(s=>`<option value="${esc(s.id)}" ${s.id===SHOP.id?'selected':''}>${esc(s.name)}</option>`).join('');
const nm=esc(SHOP.name||'Shop'),av=esc(((SHOP.name||'S').trim().charAt(0))||'S'),chCount=managedApp()?liveConnectionCount():(S.channels||[]).filter(c=>c.connected).length,isOwner=SHOP.role==='owner',crown='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4 4 5-6 5 6 4-4v10H3Z"/></svg>';
box.innerHTML=SHOP.ready?`<div class="profile"><div class="prow"><span class="av">${av}</span><div class="txt"><div class="nm">${nm}</div><div class="sub">${managedApp()?(CONNECTIONS?.shop===SHOP.id?(CONNECTIONS.complete?(chCount+' kênh đã kết nối thật'):(chCount+' kênh đã xác nhận · cần kiểm tra lại')):'Đang tải trạng thái kênh…'):(chCount+' kênh đang kết nối')}</div></div></div><span class="ownerbadge${isOwner?'':' alt'}" title="Vai trò của bạn trong shop này">${isOwner?crown:''}${esc(SHOP.roleLabel)}</span><div class="shoprow"><select id="shop_sel" onchange="shopSwitch(this.value)" title="Shop đang làm việc" aria-label="Shop đang làm việc">${opts}</select><button class="mk" onclick="shopCreate()" title="Tạo shop mới" aria-label="Tạo shop mới">＋</button></div></div>`:`<span class="small muted">${esc(SHOP.error||'Đang tải shop...')}</span>`;
if(m){m.classList.toggle('on',SHOP.ready&&SHOP.shops.length>0);m.innerHTML=opts}}
function shopSwitch(id){const s=SHOP.shops.find(x=>x.id===id);if(!s||s.id===SHOP.id)return;shopUse(s);shopRefresh();toast('Đang làm việc trong shop “'+s.name+'”')}
function shopFail(e,fallback){if(e&&e.code==='reauth_required')return reauthModal(e.message);toast((e&&e.message)||fallback||'Thao tác chưa hoàn tất. Vui lòng thử lại.')}
function reauthModal(msg){modal(`<h3>Cần đăng nhập lại</h3><p style="white-space:pre-wrap;margin:8px 0">${esc(msg||'Thao tác nhạy cảm cần phiên đăng nhập được tạo trong 10 phút gần nhất.')}</p><p class="small muted">Hãy <b>đăng xuất rồi đăng nhập lại</b>, sau đó thực hiện lại thao tác này. Dữ liệu của bạn không bị ảnh hưởng.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Để sau</button><button class="btn pri" onclick="closeModal();document.getElementById('logout_btn')?.click()">Đăng xuất ngay</button></div>`)}
async function shopInit(){if(!managedApp()||!APP_SCOPE)return;try{const r=await cloudRequest('/api/shops');if(!r||!Array.isArray(r.shops))throw Error('Không tải được danh sách shop.');SHOP.shops=r.shops.filter(shopValid);SHOP.admin=r.admin===true;if(r.roles&&typeof r.roles==='object')for(const k of Object.keys(SHOP.roles))if(typeof r.roles[k]==='string')SHOP.roles[k]=r.roles[k];
let stored='';try{stored=LS.getItem('pdk_shop:'+(APP_SCOPE||'unverified'))||''}catch(e){}const cur=SHOP.shops.find(s=>s.id===stored)||SHOP.shops.find(s=>s.id===r.defaultShopId)||SHOP.shops[0];if(!cur)throw Error('Bạn chưa có shop nào đang hoạt động.');shopUse(cur);SHOP.ready=true;SHOP.error='';shopMenu();renderShopBox();if(['members','admin','create','library','bot','inbox','response','analytics'].includes(route))render(route);
const inv=document.querySelector('meta[name="shoppost-invite"]')?.content||'';if(INVITE_RE.test(inv))inviteOffer(inv)}catch(e){SHOP.error=(e&&e.message)||'Không tải được thông tin shop.';renderShopBox();if(route==='members'||route==='analytics')render(route)}}
function shopCreate(){askText('Tên shop mới (1–80 ký tự)','',async name=>{name=String(name||'').trim().slice(0,80);if(!name)return toast('Nhập tên shop');try{const r=await cloudRequest('/api/shops',{method:'POST',body:JSON.stringify({name})});if(!shopValid(r?.shop))throw Error('Máy chủ trả về dữ liệu shop không hợp lệ.');SHOP.shops.push(r.shop);shopUse(r.shop);SHOP.ready=true;shopRefresh();toast('Đã tạo shop “'+r.shop.name+'”')}catch(e){shopFail(e,'Chưa tạo được shop.')}})}
function shopRename(){askText('Tên mới cho shop',SHOP.name,async name=>{name=String(name||'').trim().slice(0,80);if(!name||name===SHOP.name)return;try{const r=await cloudRequest('/api/shops/'+SHOP.id,{method:'PATCH',body:JSON.stringify({name})});if(!shopValid(r?.shop))throw Error('Máy chủ trả về dữ liệu shop không hợp lệ.');const i=SHOP.shops.findIndex(s=>s.id===r.shop.id);if(i>=0)SHOP.shops[i]=r.shop;shopUse(r.shop);shopRefresh();toast('Đã đổi tên shop')}catch(e){shopFail(e,'Chưa đổi được tên shop.')}})}
function shopDelete(){ask('Xóa shop “'+SHOP.name+'”? Thành viên sẽ không truy cập được nữa. Thao tác này cần phiên đăng nhập mới (trong 10 phút).',async()=>{try{await cloudRequest('/api/shops/'+SHOP.id,{method:'DELETE'});SHOP.shops=SHOP.shops.filter(s=>s.id!==SHOP.id);const next=SHOP.shops[0];if(next){shopUse(next);shopRefresh()}else{SHOP.ready=false;SHOP.error='Bạn chưa có shop nào. Hãy tạo shop mới.';SHOP.id='';renderShopBox();render(route)}toast('Đã xóa shop')}catch(e){shopFail(e,'Chưa xóa được shop.')}},{title:'Xóa shop',ok:'Xóa shop',danger:true})}
function shopTransfer(){const to=$('#tr_to')?.value||'';const m=SHOP.members.find(x=>x.userId===to);if(!m)return toast('Chọn thành viên nhận quyền sở hữu');ask('Chuyển quyền sở hữu shop “'+SHOP.name+'” cho '+(m.name||m.userId)+'? Bạn sẽ trở thành Quản lý shop. Thao tác này cần phiên đăng nhập mới (trong 10 phút).',async()=>{try{const r=await cloudRequest('/api/shops/'+SHOP.id+'/transfer',{method:'POST',body:JSON.stringify({to})});if(shopValid(r?.shop)){const i=SHOP.shops.findIndex(s=>s.id===r.shop.id);if(i>=0)SHOP.shops[i]=r.shop;shopUse(r.shop)}shopRefresh();toast('Đã chuyển quyền sở hữu')}catch(e){shopFail(e,'Chưa chuyển được quyền sở hữu.')}},{title:'Chuyển quyền sở hữu',ok:'Chuyển quyền',danger:true})}
const memberName=m=>esc(m.name||m.userId)+(m.you?' <span class="chip">bạn</span>':'');
function rolesTable(){return `<div class="card"><h3>Các vai trò</h3><div style="overflow:auto"><table><thead><tr><th>Vai trò</th><th>Được làm gì</th></tr></thead><tbody>${ROLE_HELP.map(([k,l,d])=>`<tr><td style="white-space:nowrap"><b>${esc(SHOP.roles[k]||l)}</b></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Mọi thao tác đều được máy chủ kiểm tra lại theo vai trò; việc ẩn nút trên giao diện chỉ để hướng dẫn.</p></div>`}
function membersTable(){const canRole=may('members.update_role'),canRemove=may('members.remove');if(!SHOP.members.length)return '<p class="small muted">Chưa tải được danh sách thành viên.</p>';
return `<div style="overflow:auto"><table class="memtbl"><thead><tr><th>Thành viên</th><th>Đăng nhập</th><th>Vai trò</th><th>Được phép đăng</th><th></th></tr></thead><tbody>${SHOP.members.map(m=>`<tr><td>${memberName(m)}</td><td class="small muted">${esc(m.provider||'')}</td><td>${canRole?`<select style="width:auto" onchange="memberRole('${escAttr(m.userId)}',this.value)" aria-label="Vai trò">${Object.keys(SHOP.roles).map(r=>`<option value="${r}" ${r===m.role?'selected':''}>${esc(SHOP.roles[r])}</option>`).join('')}</select>`:esc(m.roleLabel||roleLabel(m.role))}</td><td>${m.role==='content'&&canRole?`<input type="checkbox" style="width:auto" ${m.canPublish?'checked':''} onchange="memberPublish('${escAttr(m.userId)}',this.checked)" aria-label="Được phép đăng">`:(m.canPublish?'✓':'—')}</td><td>${(canRemove||m.you)?`<button class="btn sm danger" onclick="memberRemove('${escAttr(m.userId)}')">${m.you?'Rời shop':'Xóa'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function invitesTable(){if(!SHOP.invites.length)return '<p class="small muted">Không có lời mời đang chờ.</p>';return `<div style="overflow:auto"><table><thead><tr><th>Email</th><th>Vai trò</th><th>Hết hạn</th><th></th></tr></thead><tbody>${SHOP.invites.map(i=>`<tr><td>${esc(i.email||'(link mở)')}</td><td>${esc(i.roleLabel||roleLabel(i.role))}</td><td class="small muted">${fmtT(i.expiresAt)}</td><td><button class="btn sm danger" onclick="inviteRevoke('${escAttr(i.id)}')">Thu hồi</button></td></tr>`).join('')}</tbody></table></div>`}
async function membersLoad(){const shop=SHOP.id,viewAt=viewGeneration;try{const r=await cloudRequest('/api/shops/'+shop+'/members');if(SHOP.id!==shop||viewAt!==viewGeneration)return;SHOP.members=Array.isArray(r?.members)?r.members.filter(m=>m&&typeof m.userId==='string'):[];const el=$('#mem_list');if(el)el.innerHTML=membersTable();const tr=$('#tr_to');if(tr)tr.innerHTML=SHOP.members.filter(m=>!m.you).map(m=>`<option value="${esc(m.userId)}">${esc(m.name||m.userId)} · ${esc(m.roleLabel||roleLabel(m.role))}</option>`).join('')||'<option value="">Chưa có thành viên khác</option>'}catch(e){const el=$('#mem_list');if(el)el.innerHTML='<p class="small" style="color:var(--red)">'+esc(e.message)+'</p>'}
if(!may('members.invite'))return;try{const r=await cloudRequest('/api/shops/'+shop+'/invites');if(SHOP.id!==shop||viewAt!==viewGeneration)return;SHOP.invites=Array.isArray(r?.invites)?r.invites.filter(i=>i&&typeof i.id==='string'):[];const el=$('#inv_list');if(el)el.innerHTML=invitesTable()}catch(e){const el=$('#inv_list');if(el)el.innerHTML='<p class="small" style="color:var(--red)">'+esc(e.message)+'</p>'}}
async function memberRole(userId,role){try{await cloudRequest('/api/shops/'+SHOP.id+'/members/'+encodeURIComponent(userId),{method:'PATCH',body:JSON.stringify({role})});toast('Đã đổi vai trò');if(SHOP.members.some(m=>m.you&&m.userId===userId))return shopInitSilently();membersLoad()}catch(e){shopFail(e,'Chưa đổi được vai trò.');membersLoad()}}
async function memberPublish(userId,canPublish){try{await cloudRequest('/api/shops/'+SHOP.id+'/members/'+encodeURIComponent(userId),{method:'PATCH',body:JSON.stringify({canPublish:!!canPublish})});toast(canPublish?'Đã cho phép đăng':'Đã tắt quyền đăng');membersLoad()}catch(e){shopFail(e,'Chưa cập nhật được.');membersLoad()}}
function memberRemove(userId){const m=SHOP.members.find(x=>x.userId===userId);const self=!!m?.you;ask(self?'Rời khỏi shop “'+SHOP.name+'”? Bạn sẽ không truy cập được bản nháp của shop này nữa.':'Xóa thành viên '+(m?.name||userId)+' khỏi shop?',async()=>{try{await cloudRequest('/api/shops/'+SHOP.id+'/members/'+encodeURIComponent(userId),{method:'DELETE'});toast(self?'Đã rời shop':'Đã xóa thành viên');if(self)return shopInitSilently();membersLoad()}catch(e){shopFail(e,'Chưa xóa được thành viên.')}},{title:self?'Rời shop':'Xóa thành viên',ok:self?'Rời shop':'Xóa',danger:true})}
// Tải lại danh sách shop sau khi vai trò/tư cách thành viên của chính mình thay đổi.
async function shopInitSilently(){SHOP.ready=false;SHOP.shops=[];try{LS.removeItem('pdk_shop:'+(APP_SCOPE||'unverified'))}catch(e){}await shopInit();shopRefresh()}
async function inviteCreate(){const email=($('#inv_email')?.value||'').trim(),role=$('#inv_role')?.value||'viewer',b=$('#inv_btn');if(b)b.disabled=true;try{const r=await cloudRequest('/api/shops/'+SHOP.id+'/invites',{method:'POST',body:JSON.stringify({email:email||null,role})});if(typeof r?.link!=='string')throw Error('Máy chủ không trả về link mời.');SHOP.lastInvite={link:r.link,email,emailed:r.emailed===true,roleLabel:r.invite?.roleLabel||roleLabel(role)};const el=$('#inv_result');if(el)el.innerHTML=inviteResult();if($('#inv_email'))$('#inv_email').value='';toast(SHOP.lastInvite.emailed?'Đã gửi email mời':'Đã tạo link mời');membersLoad()}catch(e){shopFail(e,'Chưa tạo được lời mời.')}finally{if(b)b.disabled=false}}
function inviteResult(){const i=SHOP.lastInvite;if(!i)return '';return `<div class="card small" style="background:var(--mut);margin:10px 0 0"><p style="margin:0 0 6px"><b>Link mời (${esc(i.roleLabel)}, dùng 1 lần, hết hạn sau 7 ngày)</b>${i.email?' · '+(i.emailed?'đã gửi tới '+esc(i.email):'chưa gửi được email tới '+esc(i.email)+', hãy gửi link thủ công'):''}</p><div class="row"><input id="inv_link" readonly value="${esc(i.link)}" style="flex:1;min-width:200px" aria-label="Link mời"><button class="btn sm" onclick="inviteCopy()">Sao chép</button></div></div>`}
function inviteCopy(){const i=$('#inv_link');if(!i)return;i.select();let ok=false;try{ok=document.execCommand&&document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard?.writeText){navigator.clipboard.writeText(i.value).then(()=>toast('Đã sao chép link mời'),()=>toast('Hãy chọn và sao chép link thủ công'));return}toast(ok?'Đã sao chép link mời':'Hãy chọn và sao chép link thủ công')}
function inviteRevoke(id){ask('Thu hồi lời mời này? Link đã gửi sẽ không dùng được nữa.',async()=>{try{await cloudRequest('/api/shops/'+SHOP.id+'/invites/'+encodeURIComponent(id),{method:'DELETE'});toast('Đã thu hồi lời mời');membersLoad()}catch(e){shopFail(e,'Chưa thu hồi được.')}},{title:'Thu hồi lời mời',ok:'Thu hồi',danger:true})}
async function inviteOffer(token){try{const r=await cloudRequest('/api/invites/'+token);const inv=r?.invite;if(!inv||!inv.shop||typeof inv.shop.name!=='string')return;const name=inv.shop.name,role=inv.roleLabel||roleLabel(inv.role);const reasons={expired:'Lời mời đã hết hạn (7 ngày). Hãy đề nghị chủ shop gửi lời mời mới.',revoked:'Lời mời đã bị thu hồi.',accepted:'Lời mời đã được sử dụng.',suspended:'Shop đang bị tạm ngưng nên chưa thể tham gia.'};
if(inv.state!=='pending'){modal(`<h3>Lời mời tham gia “${esc(name)}”</h3><p style="margin:8px 0">${esc(reasons[inv.state]||'Lời mời không còn hiệu lực.')}</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal();inviteDone()">Đóng</button></div>`);return}
modal(`<h3>Lời mời tham gia shop</h3><p style="margin:8px 0">Bạn được mời tham gia shop <b>“${esc(name)}”</b> với vai trò <b>${esc(role)}</b>${inv.email?' (lời mời gửi tới '+esc(inv.email)+')':''}.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal();inviteDone()">Bỏ qua</button><button class="btn pri" onclick="closeModal();inviteAccept('${escAttr(token)}')">Tham gia</button></div>`)}catch(e){shopFail(e,'Không đọc được lời mời.')}}
function inviteDone(){try{if(location.pathname!=='/')history.replaceState(null,'','/'+location.hash)}catch(e){}}
async function inviteAccept(token){try{const r=await cloudRequest('/api/invites/'+token+'/accept',{method:'POST',body:'{}'});inviteDone();if(shopValid(r?.shop)){if(!SHOP.shops.some(s=>s.id===r.shop.id))SHOP.shops.push(r.shop);shopUse(r.shop);SHOP.ready=true;SHOP.error='';shopRefresh()}toast(r?.alreadyMember?'Bạn đã là thành viên của shop này.':'Đã tham gia shop “'+(r?.shop?.name||'')+'”')}catch(e){inviteDone();shopFail(e,'Chưa tham gia được shop.')}}
async function cloudSetStatus(id,status){if(CLOUD.busy)return;CLOUD.busy=true;try{await cloudRequest('/storage/drafts/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status})});toast(status==='pending_review'?'Đã gửi duyệt':status==='approved'?'Đã duyệt bản nháp':'Đã trả về bản nháp');CLOUD.busy=false;closeModal();cloudListDrafts()}catch(e){CLOUD.busy=false;shopFail(e,'Chưa đổi được trạng thái.')}}
V.members=()=>{const v=$('#view'),head='<h3>🛡️ Thành viên & phân quyền</h3>';
if(!managedApp()){v.innerHTML=`<div class="card">${head}<p class="small muted">Chức năng này hoạt động trên ứng dụng máy chủ đã đăng nhập (shoppost.net): mỗi shop có nhiều thành viên với vai trò riêng. Bản chạy cục bộ chỉ có một người dùng.</p></div>${rolesTable()}`;return}
if(!SHOP.ready){v.innerHTML=`<div class="card">${head}<p class="small muted">${esc(SHOP.error||'Đang tải thông tin shop...')}</p>${SHOP.error?'<div class="row"><button class="btn" onclick="shopInitSilently()">Tải lại</button><button class="btn pri" onclick="shopCreate()">Tạo shop mới</button></div>':''}</div>${rolesTable()}`;return}

async function adminLoad(){const viewAt=viewGeneration;try{const r=await cloudRequest('/api/admin/overview');if(viewAt!==viewGeneration)return;const c=r?.counts||{};$('#adm_counts').innerHTML=[['Shop',c.shops],['Người dùng',c.users],['Phiên đang hoạt động',c.sessions]].map(([l,n])=>`<div class="card" style="margin:0;padding:10px 14px"><div class="small muted">${l}</div><b style="font-size:20px">${Number.isFinite(Number(n))?Number(n):'—'}</b></div>`).join('');

try{const r=await cloudRequest('/api/admin/audit?limit=100');if(viewAt!==viewGeneration)return;const rows=Array.isArray(r?.entries)?r.entries:[];$('#adm_audit').innerHTML=rows.length?`<div style="overflow:auto;max-height:50vh"><table><thead><tr><th>Thời gian</th><th>Hành động</th><th>Người thực hiện</th><th>Shop</th><th>Đối tượng</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="small muted" style="white-space:nowrap">${fmtT(x.createdAt)}</td><td>${esc(x.action)}</td><td class="small">${esc(x.actor||'')}</td><td class="small muted">${esc(x.shopId||'')}</td><td class="small muted">${esc(x.target||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Chưa có nhật ký.</p>'}catch(e){if($('#adm_audit'))$('#adm_audit').innerHTML='<p class="small" style="color:var(--red)">'+esc(e.message)+'</p>'}}
function adminStatus(id,status){ask((status==='suspended'?'Tạm ngưng':'Kích hoạt lại')+' shop này? Thành viên của shop '+(status==='suspended'?'sẽ không thao tác được cho đến khi kích hoạt lại.':'sẽ làm việc bình thường trở lại.'),async()=>{try{await cloudRequest('/api/admin/shops/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});toast(status==='suspended'?'Đã tạm ngưng shop':'Đã kích hoạt shop');adminLoad()}catch(e){shopFail(e,'Chưa cập nhật được trạng thái.')}},{title:'Quản trị nền tảng',ok:'Xác nhận',danger:status==='suspended'})}
async function cloudOpenDraft(id){
  if(CLOUD.busy)return;
  const editor=D,original=JSON.stringify(editor),page=route,modalAt=modalGeneration,viewAt=viewGeneration,shop=SHOP.id;
  const current=()=>D===editor&&JSON.stringify(D)===original&&route===page&&viewGeneration===viewAt&&SHOP.id===shop;
  CLOUD.busy=true;cloudStatus('Đang mở bản nháp…');
  try{
    await cloudSession();
    if(!current()||modalGeneration!==modalAt)return cloudStatus('Bản đang soạn hoặc màn hình đã thay đổi; chưa thay nội dung.',true);
    const path='/storage/drafts/'+encodeURIComponent(id),row=await cloudRequest(path);
    if(!cloudRow(row)||row.draft.id!==id)throw Error('Bản nháp máy chủ không hợp lệ.');
    const files=[];
    for(const file of row.draft.media){
      if(!current()||modalGeneration!==modalAt)return cloudStatus('Bản đang soạn hoặc màn hình đã thay đổi; chưa thay nội dung.',true);
      files.push(await cloudRequest(path+'/media/'+file.id,{},file));
    }
    const apply=()=>{
      if(!current())return cloudStatus('Bản đang soạn hoặc màn hình đã thay đổi; chưa thay nội dung.',true);
      const media=row.draft.media.map(({name,type,size},i)=>{
        const fid=uid(),blob=files[i];
        const item={name,type,size,fid,url:URL.createObjectURL(blob),thumb:null};
        Object.defineProperty(item,'file',{value:blob,writable:true});
        putFile('d_'+fid,blob);
        return item;
      });
      const schedule=row.draft.schedule?{when:'later',date:row.draft.schedule.date,time:row.draft.schedule.time}:{};
      D={...newDraft(),...schedule,content:row.draft.content,channels:[...row.draft.channels],media,cloud:{id,revision:row.revision,scope:APP_SCOPE,type:row.draft.type}};
      saveDraft();closeModal();cloudStatus('Đã mở bản nháp máy chủ, phiên bản '+row.revision+'.');go('create');
    };
    if(!current()||modalGeneration!==modalAt)return cloudStatus('Bản đang soạn hoặc màn hình đã thay đổi; chưa thay nội dung.',true);
    if(draftDirty())ask('Thay bản đang soạn bằng bản nháp máy chủ? Các thay đổi cục bộ chưa lưu sẽ bị thay thế.',apply,{ok:'Mở bản máy chủ'});else apply();
  }catch(e){cloudStatus(e.message||'Không mở được bản nháp. Bản cục bộ được giữ nguyên.',true)}finally{CLOUD.busy=false;cloudStatus(CLOUD.message,CLOUD.error)}
}
async function cloudDeleteDraft(id){
  if(CLOUD.busy)return;
  if(typeof id!=='string'||!/^[a-zA-Z0-9_-]{1,64}$/.test(id))return;
  ask('Xóa vĩnh viễn bản nháp này khỏi máy chủ? Hành động không thể hoàn tác.',async()=>{
    if(CLOUD.busy)return;
    CLOUD.busy=true;cloudStatus('Đang xóa bản nháp…');
    let ok=false,msg='';
    try{
      await cloudSession();
      const res=await cloudRequest('/storage/drafts/'+encodeURIComponent(id),{method:'DELETE'});
      if(!res||typeof res.deleted!=='boolean')throw Error('Phản hồi xóa không hợp lệ.');
      if(D.cloud&&D.cloud.id===id){D.cloud=null;saveDraft()}
      ok=true;msg=res.deleted?'Đã xóa bản nháp khỏi máy chủ.':'Bản nháp không còn trên máy chủ.';
    }catch(e){msg=e.message||'Không xóa được bản nháp.'}
    CLOUD.busy=false;cloudStatus(msg,!ok);toast(msg);
    if(ok){CLOUD.items=CLOUD.items.filter(row=>row.draft.id!==id);await cloudListDrafts()}
  },{title:'Xóa bản nháp',ok:'Xóa',danger:true});
}

function validity(c){if(!c)return 'Kênh không tồn tại';const hasVideo=D.media.some(m=>m.type.startsWith('video'));if((c.pf==='tiktok'||c.pf==='youtube')&&!hasVideo)return 'Cần có video (không hỗ trợ bài chỉ văn bản/ảnh)';if(c.pf==='instagram'&&!D.media.length)return 'Cần ít nhất 1 ảnh hoặc video';const txt=(D.custom[c.id]&&D.custom[c.id].text)||D.content;if(c.pf==='x'&&txt.length>280)return 'Vượt 280 ký tự – hãy dùng Tùy chỉnh';return ''}
V.create=()=>{$('#view').innerHTML=`<div class="grid two" style="grid-template-columns:minmax(0,1fr) 340px;align-items:start"><div>

<div class="card row" style="justify-content:space-between"><label class="row" style="margin:0;color:inherit;font-size:13px"><input type="checkbox" style="width:auto" ${D.more?'checked':''} onchange="D.more=this.checked;saveDraft()"> Tạo bài viết khác</label>

${D.when==='later'?`<input type="date" style="width:auto" value="${D.date}" onchange="D.date=this.value;saveDraft()"><input type="time" style="width:auto" value="${D.time}" onchange="D.time=this.value;saveDraft()">`:''}

<div><div class="card"><h3>Xem trước</h3><div id="pv"></div></div><div class="card"><h3>📈 Điểm chất lượng nội dung</h3><div id="score"></div></div></div></div>`;renderThumbs();upd()}
let improveInFlight=false;
function upd(){saveDraft();renderGrpBar();$('#cnt').textContent=D.content.length+'/5000';const words=D.content.trim().split(/\s+/).filter(Boolean).length;const b=$('#impBtn');b.disabled=improveInFlight||words<15;b.title=words<15?'Cần tối thiểu 15 từ':'';renderCh();renderPv();renderScore();$('#sub').disabled=(typeof composerPublishing!=='undefined'&&composerPublishing)||!D.channels.some(id=>!validity(chById(id)))}
function renderCh(){const conn=S.channels.filter(c=>c.connected);if(!conn.length){$('#chlist').innerHTML='<p class="muted">Chưa có kênh. <a href="#accounts">Kết nối kênh</a></p>';return}

function togCh(id,v){D.channels=v?[...new Set([...D.channels,id])]:D.channels.filter(x=>x!==id);upd()}

async function aiAdapt(id){try{if(!D.content.trim())return toast('Nhập nội dung chung trước');const editor=D,custom=D.custom[id],original=custom?.text,content=D.content,shop=SHOP.id,view=viewGeneration,c=chById(id);if(!custom||!c)return;const text=await AI.call('adapt',{text:content,platform:c.pf});if(D!==editor||D.custom[id]!==custom||custom.text!==original||D.content!==content||SHOP.id!==shop||viewGeneration!==view)return toast('Bản đang soạn đã thay đổi; không ghi đè nội dung mới.');custom.text=text;upd()}catch(e){toast('Tác vụ AI chưa hoàn tất. Vui lòng thử lại.')}}
function renderPv(){const sel=D.channels.map(chById).filter(c=>c&&!validity(c));if(!sel.length){$('#pv').innerHTML='<p class="muted small">Chọn kênh để xem trước</p>';return}

function renderScore(){if(!D.content.trim()){$('#score').innerHTML='<p class="small muted">Nhập nội dung để chấm điểm</p>';return}const r=contentScore(D.content);const col=r.score>=80?'#16a34a':r.score>=50?'#f99c00':'#d4183d';

function addFiles(fl){[...fl].forEach(f=>{const m={name:f.name,type:f.type||'',size:f.size,url:URL.createObjectURL(f),thumb:null,fid:uid()};Object.defineProperty(m,'file',{value:f,enumerable:false,writable:true});putFile('d_'+m.fid,f);if(m.type.startsWith('image'))compressImage(f).then(d=>{m.thumb=d;saveDraft()});else if(m.type.startsWith('video'))videoPoster(m.url).then(d=>{m.thumb=d;saveDraft()});D.media.push(m)});renderThumbs();upd()}

async function runGen(p){
 const out=$('#'+p+'_out');if(!out||GENERATION_BUSY.has(out))return;
 let base;try{base=readGenerationForm(p);}catch{return;}
 if(!base.topic&&!base.product)return toast('Nhập chủ đề hoặc sản phẩm');
 const countInput=$('#'+p+'_count'),count=countInput?Number(countInput.value):3;
 if(!Number.isInteger(count)||count<1||count>5)return toast('Chọn số lượng từ 1 đến 5 bài viết.');
 const snapshot=JSON.stringify(base),page=route,generation=viewGeneration;
 const current=()=>out.isConnected&&$('#'+p+'_out')===out&&route===page&&viewGeneration===generation&&(!countInput||Number(countInput.value)===count)&&JSON.stringify(readGenerationForm(p))===snapshot;
 const buttons=[...document.querySelectorAll('button[onclick]')].filter(button=>button.getAttribute('onclick')===`runGen('${p}')`),labels=buttons.map(b=>b.textContent);
 GENERATION_BUSY.add(out);buttons.forEach(b=>{b.disabled=true;b.textContent='Đang tạo nội dung…';});out.setAttribute('aria-busy','true');
 try{const seed=rnd(0,99),outs=[];
  for(let i=0;i<count;i++){if(!current())return;out.textContent='Đang tạo bài '+(i+1)+'/'+count+'…';outs.push(await AI.call('generate',{...base,seed:seed+i}));}
  if(!current())return;window._gen=outs;out._variants=outs;out.innerHTML=outs.map((o,i)=>`<div class="variant"><div class="row" style="justify-content:space-between"><b class="small">Phương án ${i+1}</b><span class="tag">Điểm chất lượng ${contentScore(o).score}/100</span></div><div style="white-space:pre-wrap;margin-top:6px">${esc(o)}</div><div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="useGen(${i},'${p}')">Dùng nội dung này</button><button class="btn sm" onclick="copyGenerated(${i},'${p}')">Sao chép</button></div></div>`).join('');
 }catch(e){if(out.isConnected&&$('#'+p+'_out')===out){out.textContent='Chưa tạo được nội dung. Hãy thử lại.';toast('Tạo nội dung chưa hoàn tất.');}}
 finally{GENERATION_BUSY.delete(out);out.removeAttribute('aria-busy');buttons.forEach((button,i)=>{if(button.isConnected){button.disabled=false;button.textContent=labels[i];}});if(out.isConnected&&out.textContent.startsWith('Đang tạo'))out.textContent='Yêu cầu đã dừng vì nội dung hoặc màn hình thay đổi.';}
}

function runPlan(){const t=$('#pl_topic').value.trim()||S.settings.brand,a=$('#pl_aud').value.trim()||'nhà bán hàng online';const st=new Date();st.setDate(st.getDate()+1);
const out=$('#pl_out');const plan=PILLARS.map((p,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return {ds,d,pillar:p[0],idea:p[1].replace('{n}',rnd(3,7)).replace(/{t}/g,t).replace(/{a}/g,a),format:p[2],time:TIMES[i],pf:p[2]==='Video ngắn'?'tiktok':'facebook',topic:t,aud:a}});
out._plan=plan;out.innerHTML=`<table style="margin-top:10px"><tr><th>Ngày</th><th>Trụ cột</th><th>Ý tưởng</th><th>Định dạng</th><th>Giờ</th><th></th></tr>${plan.map((r,i)=>`<tr><td>${r.d.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})}</td><td>${r.pillar}</td><td>${esc(r.idea)}</td><td>${r.format}</td><td>${r.time}</td><td><button class="btn sm" onclick="planUse(${i})">Soạn</button></td></tr>`).join('')}</table><p class="small muted">Giờ đăng là gợi ý mặc định; xem trang Phân tích để chọn khung giờ hiệu quả nhất với kênh của bạn.</p><p class="small" role="status"></p>`}
async function planUse(i){
 const out=$('#pl_out'),plan=out?._plan,row=plan?.[i];
 if(!row||GENERATION_BUSY.has(plan))return;
 const view=viewGeneration,shop=SHOP.id,dialog=modalGeneration,draft=D,original=JSON.stringify(D);
 const current=()=>out.isConnected&&out._plan===plan&&viewGeneration===view&&SHOP.id===shop;
 const sameDraft=()=>D===draft&&JSON.stringify(D)===original;
 const buttons=[...out.querySelectorAll('button')],status=out.querySelector('[role="status"]');
 GENERATION_BUSY.add(plan);
 buttons.forEach(button=>{button.disabled=true;});
 status.textContent='Đang soạn bài…';
 try{
  const content=await AI.call('generate',{topic:row.idea,product:row.topic,audience:row.aud,tone:S.settings.tone,platform:row.pf,length:'medium',seed:i});
  if(!current()||modalGeneration!==dialog)return;
  if(typeof content!=='string'||!content.trim())throw new Error('Empty AI result');
  const apply=()=>{
   if(!current())return;
   if(!sameDraft()){status.textContent='Bản nháp đã thay đổi. Hãy bấm Soạn để thử lại.';return;}
   D={...newDraft(),content,when:'later',date:row.ds,time:row.time};
   saveDraft();
   go('create');
   toast('Đã tạo bản nháp cho '+row.time+'. Chọn kênh để lên lịch đăng.');
  };
  if(sameDraft()&&draftDirty())ask('Bài đang soạn chưa đăng sẽ bị thay thế. Tiếp tục?',apply,{ok:'Bỏ nháp & tạo mới',danger:true});
  else apply();
 }catch{
  if(current()&&modalGeneration===dialog)status.textContent='Chưa soạn được bài. Hãy bấm Soạn để thử lại.';
 }finally{
  GENERATION_BUSY.delete(plan);
  if(current()){
   buttons.forEach(button=>{button.disabled=false;});
   if(status.textContent==='Đang soạn bài…')status.textContent='';
  }
 }
}

 GENERATION_BUSY.add(out);buttons.forEach(b=>{b.disabled=true;b.textContent='Đang viết lại…';});out.setAttribute('aria-busy','true');out.textContent='Đang viết lại nội dung…';
 try{const o=await AI.call(k,base);if(!current())return;window._gen=[o];out._variants=[o];out.innerHTML=`<div class="variant"><div style="white-space:pre-wrap">${esc(o)}</div><div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="useGen(0,'rw')">Dùng nội dung này</button></div></div>`;}
 catch(e){if(current()){out.textContent='Chưa viết lại được nội dung. Hãy thử lại.';toast('Tác vụ AI chưa hoàn tất. Vui lòng thử lại.');}}

function filterBar(k){const f=F[k];const pfs=[...new Set(S.channels.map(c=>c.pf))];const sel=(n,o)=>`<select style="width:auto" onchange="F.${k}.${n}=this.value;V.${k}()">${o.map(([v,l])=>`<option value="${v}" ${f[n]===v?'selected':''}>${l}</option>`).join('')}</select>`;

function fpost(k){const f=F[k];return S.posts.filter(p=>(f.type==='all'||p.type===f.type)&&(f.status==='all'||p.status===f.status)&&(f.pf==='all'||p.channels.some(id=>(chById(id)||{}).pf===f.pf))&&(!f.grp||f.grp==='all'||!grpById(f.grp)||p.channels.some(id=>grpById(f.grp).channels.includes(id))))}
function sumM(p){const s={views:0,likes:0,comments:0,shares:0};Object.values(p.metrics||{}).forEach(m=>{for(const k in s)s[k]+=m[k]||0});return s}
function er(s){return s.views?((s.likes+s.comments+s.shares)/s.views*100).toFixed(2):'0.00'}

const safeUrl=value=>{try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password&&['facebook.com','www.facebook.com','instagram.com','www.instagram.com','zalo.me','www.zalo.me','oa.zalo.me','t.me'].includes(u.hostname)?u.href:null}catch{return null}};

<div style="white-space:pre-wrap;margin:10px 0">${esc(p.content.slice(0,280))}${p.content.length>280?'…':''}</div>${p.error?`<div class="small" style="color:var(--red)">⚠ ${esc(p.error)}</div>`:''}

function pubNow(id){const p0=S.posts.find(x=>x.id===id);if(managedApp()&&p0&&p0.channels.some(cid=>{const c=chById(cid);return c&&c.real}))return pubNowReal(p0);if(!demoAction())return;const p=S.posts.find(x=>x.id===id);if(p.channels.map(chById).some(c=>!c||!c.connected)){p.status='failed';p.error='Có kênh chưa kết nối';toast('Đăng thất bại: kênh chưa kết nối')}else{p.time=Date.now();publish(p);toast('Đã đăng (mô phỏng)')}save();render()}
function dupPost(id){const p=S.posts.find(x=>x.id===id);freshDraft(()=>{D.content=p.content;D.channels=p.channels.filter(x=>(chById(x)||{}).connected);D.custom=JSON.parse(JSON.stringify(p.custom||{}));D.media=(p.media||[]).filter(m=>m.thumb||(m.assetId&&BLOBS[m.assetId])).map(m=>({...m,url:(m.assetId&&BLOBS[m.assetId])||m.thumb}));go('create')})}
function delPost(id){const p=S.posts.find(x=>x.id===id);if(!p)return;const held=()=>managedApp()&&(p.status==='scheduled'||p.status==='processing'||p.status==='unknown'||(p.jobs||[]).some(j=>!['sent','failed'].includes(j.status)));if(held())return toast('Chưa thể xóa bản ghi đang chờ hoặc chưa rõ kết quả. Chưa hỗ trợ hủy lịch tại đây.');ask('Xóa bản ghi khỏi lịch sử trên trình duyệt này? Bài trên nền tảng vẫn còn. Thao tác này không hủy tác vụ máy chủ.',()=>{if(held())return toast('Trạng thái đã thay đổi. Giữ bản ghi để theo dõi kết quả.');S.posts=S.posts.filter(x=>x.id!==id);save();render()},{ok:'Xóa khỏi lịch sử',danger:true})}
const CAL={mode:'month',ref:new Date()};
V.calendar=()=>{const list=fpost('calendar');const r=new Date(CAL.ref);const days=[];if(CAL.mode==='month'){const f=new Date(r.getFullYear(),r.getMonth(),1);const off=(f.getDay()+6)%7;for(let i=0;i<42;i++)days.push(new Date(f.getFullYear(),f.getMonth(),1-off+i))}else{const off=(r.getDay()+6)%7;for(let i=0;i<7;i++)days.push(new Date(r.getFullYear(),r.getMonth(),r.getDate()-off+i))}
const same=(a,b)=>a.toDateString()===b.toDateString();const col={published:'#dcfce7',scheduled:'#dbeafe',failed:'#fee2e2',unknown:'#fef3c7',processing:'#ede9fe'};const title=CAL.mode==='month'?`Tháng ${r.getMonth()+1}/${r.getFullYear()}`:`${days[0].toLocaleDateString('vi-VN')} – ${days[6].toLocaleDateString('vi-VN')}`;

<p class="small muted">Lịch các bản ghi đã tạo tại đây. Nút + mở bản nháp; bài chỉ được lên lịch khi bạn xác nhận trong trình soạn.</p>${!list.some(p=>days.some(d=>same(new Date(p.time),d)))?'<div class="card muted">Chưa có bài trong khoảng thời gian và bộ lọc này. Chọn + ở một ngày để soạn bài hoặc đổi bộ lọc.</div>':''}<div class="cal">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${days.map(d=>{const ev=list.filter(p=>same(new Date(p.time),d)).sort((a,b)=>a.time-b.time);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<div class="d ${same(d,new Date())?'today':''}" style="${CAL.mode==='month'&&d.getMonth()!==r.getMonth()?'opacity:.45;':''}${CAL.mode==='week'?'min-height:320px':''}"><div class="row" style="justify-content:space-between"><b>${d.getDate()}</b><button class="btn sm" aria-label="Soạn bài cho ngày ${ds}" title="Soạn bài cho ngày này" onclick="newAt('${ds}')">+</button></div>${ev.map(p=>`<span class="ev" style="background:${col[p.status]||'#f1f5f9'}" title="${esc((STL[p.status]||'Chưa rõ trạng thái')+': '+p.content)}">${esc(STL[p.status]||'Chưa rõ trạng thái')} · ${new Date(p.time).toTimeString().slice(0,5)} ${esc(p.content.slice(0,40))}</span>`).join('')}${CAL.mode==='week'&&!ev.length?'<div class="small muted" style="margin-top:6px">Không có bài đăng</div>':''}</div>`}).join('')}</div>
<div class="row small" style="margin-top:10px"><span class="tag st-published">Đã đăng</span><span class="tag st-scheduled">Đã lên lịch</span><span class="tag st-failed">Thất bại</span><span class="tag">Cần kiểm tra kết quả</span><span class="tag">Đang đăng</span></div>`}
function calMove(n){const r=new Date(CAL.ref);if(CAL.mode==='month'){r.setDate(1);r.setMonth(r.getMonth()+n)}else r.setDate(r.getDate()+7*n);CAL.ref=r;V.calendar()}
function newAt(ds){freshDraft(()=>{D.when='later';D.date=ds;D.time='20:00';go('create')})}

const AN={days:30,ch:'all',sort:'views',dir:'desc'};const LBL={views:'Lượt xem',likes:'Thích',comments:'Bình luận',shares:'Chia sẻ'};
function anRows(a,b){const rows=[];S.posts.filter(p=>p.status==='published'&&p.time>=a&&p.time<b).forEach(p=>Object.entries(p.metrics).forEach(([id,m])=>{if(AN.ch!=='all'&&id!==AN.ch)return;const c=chById(id);if(c)rows.push({p,c,...m})}));return rows}
const tot=rows=>rows.reduce((s,r)=>{for(const k in LBL)s[k]+=r[k];return s},{views:0,likes:0,comments:0,shares:0});
const PUBLISH_REPORT_STATES={sent:'Đã đăng',pending:'Đang chờ',sending:'Đang gửi',retryable:'Chờ thử lại',failed:'Thất bại',unknown:'Cần xác minh'};
function publishReportPage(){
 $('#view').innerHTML=`<section class="card"><h3>Kết quả đăng bài</h3>
 <p class="muted small">Đếm lượt đăng theo kênh từ hàng đợi của shop trong khoảng thời gian đã chọn. Chỉ số tương tác theo nền tảng được hiển thị bên dưới.</p>
 <div class="row"><select id="publish_report_period" aria-label="Khoảng thời gian" style="width:auto">${[7,30,90].map(days=>`<option value="${days}" ${AN.days===days?'selected':''}>${days} ngày qua</option>`).join('')}</select><button class="btn" id="publish_report_refresh">Làm mới</button><a href="#posts">Xem danh sách bài viết</a></div>
 <p id="publish_report_status" role="status"></p><div id="publish_report_result" style="overflow:auto"></div></section>
 <section class="card"><h3>Tương tác Facebook và Instagram</h3>

 <button class="btn" id="meta_report_load">Cập nhật tương tác Meta</button>
 <p id="meta_report_status" role="status"></p><div id="meta_report_result" style="overflow:auto"></div></section>
 <section class="card"><h3>Chỉ số video YouTube</h3>
 <p class="muted small">Số tích lũy từ YouTube cho tối đa 25 video gần đây của kênh đã chọn. Bộ lọc kết quả đăng bài ở trên không áp dụng ở đây.</p>
 <div class="row"><select id="youtube_report_account" aria-label="Kênh YouTube" hidden></select><button class="btn" id="youtube_report_load" hidden>Cập nhật chỉ số YouTube</button><a href="#accounts">Quản lý kênh</a></div>
 <p id="youtube_report_status" role="status"></p><div id="youtube_report_result" style="overflow:auto"></div></section>`;
 youtubeReport();
 metaReport();
 const period=$('#publish_report_period'),refresh=$('#publish_report_refresh'),out=$('#publish_report_result'),status=$('#publish_report_status');
 let requestNumber=0;
 const load=async()=>{
  const request=++requestNumber,shop=SHOP.id,days=Number(period.value);
  const current=()=>out.isConnected&&route==='analytics'&&SHOP.id===shop&&requestNumber===request;
  AN.days=days;
  out.replaceChildren();
  if(!SHOP.ready){status.textContent=SHOP.error||'Đang tải thông tin shop…';return;}
  if(!shopCan('reports.view')){status.textContent='Vai trò hiện tại chưa có quyền xem báo cáo.';return;}
  refresh.disabled=true;status.textContent='Đang tải kết quả đăng bài…';
  try{
   const data=await cloudRequest('/api/social/jobs/summary?days='+days);
   if(!current())return;
   if(data.days!==days||!Array.isArray(data.rows)||data.rows.some(row=>!row||typeof row.provider!=='string'||!Object.hasOwn(PUBLISH_REPORT_STATES,row.status)||!Number.isSafeInteger(row.count)||row.count<1))throw Error('Dữ liệu báo cáo không hợp lệ.');
   status.textContent=data.rows.length?'':'Chưa có lượt đăng trong khoảng thời gian này.';
   if(data.rows.length)out.innerHTML=`<table><thead><tr><th scope="col">Nền tảng</th><th scope="col">Trạng thái</th><th scope="col">Số lượt</th></tr></thead><tbody>${data.rows.map(row=>`<tr><td>${esc(PF[row.provider]?.n||'Chưa xác định')}</td><td>${PUBLISH_REPORT_STATES[row.status]}</td><td>${fmtN(row.count)}</td></tr>`).join('')}</tbody></table>`;
  }catch(error){if(current())status.textContent=error.status===403?'Vai trò hiện tại chưa có quyền xem báo cáo.':'Chưa tải được kết quả đăng bài. Hãy bấm Làm mới để thử lại.';}

 };
 period.onchange=load;refresh.onclick=load;load();
}

   if(data.rows.length)out.innerHTML=`<table><thead><tr><th scope="col">Kênh</th><th scope="col">Mã bài</th><th scope="col">Cảm xúc / lượt thích</th><th scope="col">Bình luận</th><th scope="col">Trạng thái</th></tr></thead><tbody>${data.rows.map(row=>`<tr><td>${esc(PF[row.provider]?.n||'Meta')} · ${esc(row.channel)}</td><td>${esc(row.postId)}</td><td>${count(row.reactions)}</td><td>${count(row.comments)}</td><td>${state[row.status]||state.unavailable}</td></tr>`).join('')}</tbody></table>`;

 };

async function youtubeReport(){
 const select=$('#youtube_report_account'),button=$('#youtube_report_load'),status=$('#youtube_report_status'),out=$('#youtube_report_result'),shop=SHOP.id;
 const current=()=>out.isConnected&&route==='analytics'&&SHOP.id===shop;
 if(!SHOP.ready){status.textContent=SHOP.error||'Đang tải thông tin shop…';return;}
 if(!shopCan('reports.view')){status.textContent='Vai trò hiện tại chưa có quyền xem báo cáo.';return;}
 status.textContent='Đang tải danh sách kênh YouTube…';
 try{
  const {accounts}=await cloudRequest('/api/social/google/accounts');
  if(!current())return;
  const channels=accounts.filter(a=>a.status==='connected');
  if(!channels.length){status.textContent='Shop này chưa có kênh YouTube đang kết nối.';return;}
  for(const channel of channels)select.add(new Option(channel.name,channel.id));
  select.hidden=false;button.hidden=false;
  status.textContent='Chọn kênh và cập nhật để lấy số liệu từ YouTube.';
 }catch{if(current())status.textContent='Chưa tải được danh sách kênh YouTube. Hãy tải lại trang để thử lại.';return;}
 select.onchange=()=>{out.replaceChildren();status.textContent='Cập nhật để lấy số liệu của kênh đã chọn.';};
 button.onclick=async()=>{
  button.disabled=true;select.disabled=true;out.replaceChildren();status.textContent='Đang lấy số liệu từ YouTube…';
  try{
   const data=await cloudRequest('/api/social/google/video-stats?'+new URLSearchParams({accountId:select.value}));
   if(!current())return;
   if(!Array.isArray(data.videos)||!Number.isSafeInteger(data.fetchedAt))throw Error('invalid_stats');
   const metric=value=>typeof value==='string'&&/^\d{1,20}$/.test(value)?BigInt(value).toLocaleString('vi-VN'):'Chưa có dữ liệu';
   status.textContent=data.videos.length?'Cập nhật lúc '+fmtT(data.fetchedAt*1000):'YouTube chưa trả về video cho kênh này.';
   if(data.videos.length)out.innerHTML=`<table><thead><tr><th scope="col">Video</th><th scope="col">Lượt xem</th><th scope="col">Lượt thích</th><th scope="col">Bình luận</th></tr></thead><tbody>${data.videos.map(v=>`<tr><td>${esc(v.title||v.id)}</td><td>${metric(v.views)}</td><td>${metric(v.likes)}</td><td>${metric(v.comments)}</td></tr>`).join('')}</tbody></table>`;
  }catch(error){
   if(current())status.textContent=error.code==='google_reauth_required'?'Quyền YouTube đã hết hạn. Hãy kết nối lại trong mục Kênh.':'Chưa lấy được số liệu YouTube. Hãy thử cập nhật lại.';
  }finally{if(current()){button.disabled=false;select.disabled=false;}}
 };
}
V.analytics=()=>{if(managedApp())return publishReportPage();const now=Date.now(),since=now-AN.days*864e5;const rows=anRows(since,Infinity),prev=anRows(since-AN.days*864e5,since);const T=tot(rows),P=tot(prev);
const byPf={};rows.forEach(r=>{const b=byPf[r.c.pf]||(byPf[r.c.pf]={views:0,likes:0,comments:0,shares:0,posts:new Set(),chs:new Set()});for(const k in LBL)b[k]+=r[k];b.posts.add(r.p.id);b.chs.add(r.c.id)});
const hours=Array(24).fill(0),hc=Array(24).fill(0);rows.forEach(r=>{const h=new Date(r.p.time).getHours();hc[h]++;hours[h]+=r.views?(r.likes+r.comments+r.shares)/r.views*100:0});
rows.sort((a,b)=>(AN.dir==='desc'?-1:1)*(a[AN.sort]-b[AN.sort]));const nPosts=new Set(rows.map(r=>r.p.id)).size,nCh=new Set(rows.map(r=>r.c.id)).size;
$('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row"><select style="width:auto" onchange="AN.ch=this.value;V.analytics()"><option value="all">Tất cả kênh</option>${S.channels.filter(c=>c.connected).map(c=>`<option value="${c.id}" ${AN.ch===c.id?'selected':''}>${PF[c.pf].n} – ${esc(c.name)}</option>`).join('')}</select><div class="seg">${[7,14,30,90].map(d=>`<button class="${AN.days===d?'on':''}" onclick="AN.days=${d};V.analytics()">${d} ngày</button>`).join('')}</div></div><div class="row"><span class="small muted">${S.lastSync?'Đồng bộ lúc '+fmtT(S.lastSync):''}</span><button class="btn sm" onclick="syncMetrics()">🔄 Đồng bộ chỉ số</button></div></div>
<p class="muted">Tổng ${nPosts} bài đăng trên ${nCh} kênh trong ${AN.days} ngày</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px">${Object.keys(LBL).map(k=>kp(LBL[k],fmtN(T[k]),dl(T[k],P[k],true))).join('')}${kp('Tỷ lệ tương tác',er(T)+'%',dl(+er(T)/100,+er(P)/100,true,true),'(Thích + Bình luận + Chia sẻ) / Lượt xem')}</div>
<div class="grid two g2"><div class="card"><h3>Lượt xem theo nền tảng</h3>${bars(Object.entries(byPf).map(([p,b])=>({l:PF[p].n,v:b.views,c:PF[p].c,lab:fmtN(b.views)})))}</div><div class="card"><h3>Tỷ lệ tương tác theo nền tảng (%)</h3>${bars(Object.entries(byPf).map(([p,b])=>({l:PF[p].n,v:+er(b),c:PF[p].c})))}</div></div>

/* ================= CHATBOT ENGINE ================= */
const TRG={keyword:'Từ khóa',regex:'Biểu thức (regex)',welcome:'Tin nhắn đầu tiên',offhours:'Ngoài giờ làm việc',fallback:'Không khớp (dự phòng)'};
const ACT={none:'Chỉ trả lời',tag:'Gắn nhãn',handoff:'Chuyển nhân viên',close:'Đóng hội thoại'};
function inHours(t){const d=new Date(t),h=d.getHours()+d.getMinutes()/60;return h>=S.settings.open&&h<S.settings.close}
function fillTpl(t,name,kenh){const s=S.settings;return t.replace(/{ten}/g,name).replace(/{shop}/g,s.brand).replace(/{kenh}/g,kenh).replace(/{gio_mo}/g,`${s.open}h–${s.close}h`).replace(/{dang_ky}/g,s.signup||'')}
function fillVars(t,c,pf){return fillTpl(t,c.customer,PF[pf].n)}
function botReply(c,text,t=Date.now(),o={}){if(!o.test&&(!S.settings.botOn||c.botPaused))return null;const pf=o.pf||chOfConv(c).pf;const T=tok(text);const first=c.messages.filter(m=>m.from==='customer').length<=1;const off=o.forceOff!==undefined?o.forceOff:!inHours(t);
const act=S.scripts.filter(s=>s.on&&(!s.channels.length||s.channels.includes(pf))).sort((a,b)=>a.priority-b.priority);let hit=null;
for(const s of act){if(s.trigger==='offhours'&&off){hit=s;break}if(s.trigger==='keyword'&&s.keywords.split(',').some(k=>hasKw(T,k))){hit=s;break}if(s.trigger==='regex'&&s.keywords){try{if(new RegExp(s.keywords,'i').test(text)){hit=s;break}}catch(e){}}if(s.trigger==='welcome'&&first){hit=s;break}}
if(!hit)hit=act.find(s=>s.trigger==='fallback');if(!hit)return null;let txt=fillVars(hit.reply,c,pf);if(hit.trigger==='keyword'){const more=act.find(s=>s!==hit&&s.trigger==='keyword'&&s.action!=='handoff'&&s.keywords.split(',').some(k=>hasKw(T,k)));if(more)txt+='\n\n'+fillVars(more.reply,c,pf).replace(/^(Dạ chào|Xin chào|Chào) [^!,.]*[!,.]\s*/,'Ngoài ra, ')}let extra=null;if(hit.trigger==='offhours'){const ho=act.find(s=>s.trigger==='keyword'&&s.action==='handoff'&&s.keywords.split(',').some(k=>hasKw(T,k)));if(ho){extra=ho;txt+='\n\n'+fillVars(ho.reply,c,pf)}}return {script:hit,text:txt,extra}}
function applyBot(c,r){if(!demoAction())return;const s=r.script;c.messages.push({id:uid(),from:'bot',text:r.text,t:Date.now(),script:s.name,quick:s.quick?s.quick.split(',').map(x=>x.trim()).filter(Boolean):[]});s.hits=(s.hits||0)+1;c.tags=c.tags.filter(x=>x!=='Chưa xử lý');
if(s.action==='handoff'){if(!c.tags.includes('Cần nhân viên'))c.tags.push('Cần nhân viên');c.botPaused=true;c.unread=true}if(s.action==='tag'&&s.tagName&&!c.tags.includes(s.tagName))c.tags.push(s.tagName);if(s.action==='close')c.status='closed';if(r.extra){r.extra.hits=(r.extra.hits||0)+1;if(!c.tags.includes('Cần nhân viên'))c.tags.push('Cần nhân viên');c.botPaused=true;c.unread=true;c.status='open'}}
function incoming(c,text){if(!demoAction())return;c.messages.push({id:uid(),from:'customer',text,t:Date.now()});c.status='open';c.unread=true;const r=botReply(c,text);if(r)setTimeout(()=>{applyBot(c,r);save();if(route==='inbox')V.inbox();navRender()},900);else if(!c.tags.includes('Chưa xử lý'))c.tags.push('Chưa xử lý')}

if(!IB.sel||!cv(IB.sel))IB.sel=list[0]?list[0].id:null;const c=IB.sel?cv(IB.sel):null;if(c&&c.unread){c.unread=false;save();navRender()}
$('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="seg">${[['all','Tất cả'],['open','Đang mở'],['unread','Chưa đọc'],['human','Cần nhân viên']].map(([k,l])=>`<button class="${IB.f===k?'on':''}" onclick="IB.f='${k}';V.inbox()">${l}</button>`).join('')}</div><div class="row"><span class="small">Bot tự động</span><label class="switch"><input type="checkbox" ${S.settings.botOn?'checked':''} onchange="S.settings.botOn=this.checked;save()"><span></span></label><button class="btn sm" onclick="simIncoming()">+ Mô phỏng tin nhắn đến</button></div></div>
<div class="inbox"><div class="clist"><div style="padding:8px"><input placeholder="🔍 Tìm khách hoặc nội dung (Enter)..." value="${esc(IB.q)}" onchange="IB.q=this.value;V.inbox()"></div>${list.slice(0,IB.limit).map(x=>{const ch=chOfConv(x),l=last(x);return `<div class="citem ${x.id===IB.sel?'on':''}" onclick="IB.sel='${x.id}';V.inbox()"><div class="row" style="gap:8px;flex-wrap:nowrap">${pfIcon(ch.pf)}<div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="${x.unread?'':'font-weight:500'}">${x.unread?'● ':''}${esc(x.customer)}</b><span class="small muted">${fmtT(l.t)}</span></div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.from==='bot'?'🤖 ':l.from==='agent'?'Bạn: ':''}${esc(l.text)}</div><div>${SENT_ICON[sentimentOf(x)]}${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${x.status==='closed'?'<span class="tag">Đã đóng</span>':''}</div></div></div></div>`}).join('')||'<p class="muted" style="padding:12px">Không có hội thoại</p>'}${list.length>IB.limit?`<div style="padding:10px;text-align:center"><button class="btn sm" id="ibmore" onclick="IB.limit+=150;V.inbox()">Xem thêm (${IB.limit}/${list.length})</button></div>`:''}</div>
<div class="chat">${c?chatPane(c):'<p class="muted" style="padding:20px">Chọn một hội thoại</p>'}</div></div>`;const ms=$('#msgs');if(ms)ms.scrollTop=ms.scrollHeight}
function chatPane(c){const ch=chOfConv(c);return `<div class="row" style="justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd)"><div class="row">${pfIcon(ch.pf)}<div><b>${esc(c.customer)}</b><div class="small muted">${esc(ch.name)} · ${PF[ch.pf].n}</div></div></div><div class="row"><label class="small row" style="margin:0;color:inherit"><input type="checkbox" style="width:auto" ${c.botPaused?'':'checked'} onchange="cv('${escAttr(c.id)}').botPaused=!this.checked;save()"> Bot cho hội thoại này</label><button class="btn sm" onclick="toggleTag('${escAttr(c.id)}','Cần nhân viên')">${c.tags.includes('Cần nhân viên')?'✓ ':''}Cần nhân viên</button><button class="btn sm" onclick="closeConv('${escAttr(c.id)}')">${c.status==='closed'?'Mở lại':'Đóng hội thoại'}</button></div></div>
<div class="msgs" id="msgs">${c.messages.map(m=>`<div class="m ${m.from}">${m.from==='bot'?`<div class="small" style="opacity:.7">🤖 Bot${m.script?' · '+esc(m.script):''}</div>`:''}${esc(m.text)}${m.quick&&m.quick.length?'<div>'+m.quick.map(q=>`<span class="qr">${esc(q)}</span>`).join('')+'</div>':''}<div class="t">${fmtT(m.t)}</div></div>`).join('')}${c.csat?`<div class="small muted" style="text-align:center;margin-top:8px">Khách đánh giá CSAT: ${'⭐'.repeat(c.csat)} (${c.csat}/5)</div>`:''}</div>
<div style="border-top:1px solid var(--bd);padding:10px"><div class="row" style="margin-bottom:6px"><div class="seg"><button class="${IB.role==='agent'?'on':''}" onclick="IB.role='agent';V.inbox()">Trả lời (nhân viên)</button><button class="${IB.role==='customer'?'on':''}" onclick="IB.role='customer';V.inbox()">Giả lập khách gửi</button></div><button class="btn sm" onclick="aiSuggest('${escAttr(c.id)}')">✨ AI gợi ý trả lời</button>${c.status==='closed'&&!c.csat?`<button class="btn sm" onclick="askCsat('${escAttr(c.id)}')">Gửi khảo sát CSAT</button>`:''}</div><div class="row" style="flex-wrap:nowrap"><textarea id="reply" style="min-height:44px;height:48px" placeholder="${IB.role==='agent'?'Nhập câu trả lời... (Enter để gửi)':'Nhập tin nhắn của khách (mô phỏng) để thử bot...'}" onkeydown="if(isEnter(event)&&!event.shiftKey){event.preventDefault();sendMsg('${escAttr(c.id)}')}"></textarea><button class="btn pri" onclick="sendMsg('${escAttr(c.id)}')">Gửi</button></div></div>`}
function sendMsg(id){if(!demoAction())return;const c=cv(id);const t=$('#reply').value.trim();if(!t)return;if(IB.role==='agent'){c.messages.push({id:uid(),from:'agent',text:t,t:Date.now()});c.tags=c.tags.filter(x=>x!=='Chưa xử lý')}else incoming(c,t);save();V.inbox()}
async function aiSuggest(id){try{const c=cv(id),selected=IB.sel,role=IB.role,input=$('#reply');if(!input)return;const original=input.value;const lc=[...c.messages].reverse().find(m=>m.from==='customer');const t=await AI.call('reply',{text:lc?lc.text:'',name:c.customer});if(IB.sel!==selected||IB.sel!==id||cv(id)!==c||IB.role!==role||$('#reply')!==input||input.value!==original)return toast('Hội thoại hoặc bản nháp đã thay đổi; không ghi đè nội dung mới.');if(role!=='agent'){IB.role='agent';V.inbox()}const target=$('#reply');if(!target)return;target.value=t;target.focus()}catch(e){toast('Tác vụ AI chưa hoàn tất. Vui lòng thử lại.')}}
function toggleTag(id,tg){const c=cv(id);c.tags=c.tags.includes(tg)?c.tags.filter(x=>x!==tg):[...c.tags,tg];save();V.inbox()}
function closeConv(id){const c=cv(id);c.status=c.status==='closed'?'open':'closed';save();V.inbox()}
function askCsat(id){if(!demoAction())return;const c=cv(id);const se=sentimentOf(c);c.csat=se==='neg'?rnd(1,3):se==='pos'?rnd(4,5):rnd(3,5);c.messages.push({id:uid(),from:'bot',text:'Bạn đánh giá trải nghiệm hỗ trợ hôm nay thế nào? (1–5 ⭐)',t:Date.now(),script:'Khảo sát CSAT'});save();V.inbox();toast('Khách (mô phỏng) đã chấm '+c.csat+'/5')}

function simIncoming(){if(!demoAction())return;const conn=S.channels.filter(c=>c.connected);if(!conn.length)return toast('Chưa có kênh kết nối');modal(`<h3>Mô phỏng tin nhắn đến</h3><label>Kênh</label><select id="si_ch">${conn.map(c=>`<option value="${c.id}">${PF[c.pf].n} – ${esc(c.name)}</option>`).join('')}</select><label>Tên khách</label><input id="si_n" value="Khách ${rnd(100,999)}"><label>Tin nhắn</label><textarea id="si_t" style="min-height:70px">${SIMS[0]}</textarea><div class="small" style="margin-top:6px">Mẫu: ${SIMS.map((x,i)=>`<a href="javascript:void(0)" class="tag" onclick="$('#si_t').value=SIMS[${i}]">${esc(x)}</a>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="doSim()">Gửi</button></div>`)}

/* ================= RESPONSE METRICS ================= */
const RS={days:14,ch:'all'};
function metrics(list){const sla=S.settings.slaMin*6e4;let resp=0,slaOk=0,bot=0,hand=0,closed=0,inM=0,outM=0;const frt=[],cs=[],sent={pos:0,neu:0,neg:0},hours=Array(24).fill(0);
list.forEach(c=>{const f=c.messages.find(m=>m.from==='customer');if(!f)return;c.messages.forEach(m=>{if(m.from==='customer'){inM++;hours[new Date(m.t).getHours()]++}else outM++});const r=c.messages.find(m=>m.from!=='customer'&&m.t>=f.t);if(r){resp++;const d=r.t-f.t;frt.push(d);if(d<=sla)slaOk++}
const reps=c.messages.filter(m=>m.from!=='customer');if(reps.length&&reps.every(m=>m.from==='bot')&&!c.tags.includes('Cần nhân viên'))bot++;if(c.tags.includes('Cần nhân viên'))hand++;if(c.csat)cs.push(c.csat);if(c.status==='closed')closed++;sent[sentimentOf(c)]++});
frt.sort((a,b)=>a-b);const n=list.length,q=p=>frt.length?frt[Math.min(frt.length-1,Math.floor(frt.length*p))]:0;
return {n,resp,unanswered:n-resp,rate:n?resp/n:0,avg:frt.length?frt.reduce((a,b)=>a+b,0)/frt.length:0,med:q(.5),p90:q(.9),sla:resp?slaOk/resp:0,bot:n?bot/n:0,hand:n?hand/n:0,closed:n?closed/n:0,csat:cs.length?cs.reduce((a,b)=>a+b,0)/cs.length:0,csatPos:cs.length?cs.filter(x=>x>=4).length/cs.length:0,csN:cs.length,sent,inM,outM,hours}}
function qScore(M){if(!M.n)return 0;return Math.round(100*(.3*M.rate+.25*M.sla+.25*(M.csN?M.csat/5:M.rate)+.2*(1-M.sent.neg/M.n)))}
V.response=()=>{if(managedApp())return liveMetricsPage();const now=Date.now(),since=now-RS.days*864e5,ps=since-RS.days*864e5;const fm=c=>c.messages.find(m=>m.from==='customer');const flt=c=>(RS.ch==='all'||c.ch===RS.ch)&&fm(c);
const cur=S.convos.filter(c=>flt(c)&&fm(c).t>=since),prev=S.convos.filter(c=>flt(c)&&fm(c).t>=ps&&fm(c).t<since);const M=metrics(cur),P=metrics(prev);const Q=qScore(M),QP=qScore(P);const qc=Q>=80?'#16a34a':Q>=60?'#f99c00':'#d4183d';
const chRows=S.channels.filter(c=>c.connected&&(RS.ch==='all'||c.id===RS.ch)).map(c=>({c,m:metrics(cur.filter(x=>x.ch===c.id))}));
const kws=S.scripts.filter(x=>x.trigger==='keyword').sort((a,b)=>a.priority-b.priority);const intents={};cur.forEach(c=>{const T=tok(fm(c).text);const s=kws.find(x=>x.keywords.split(',').some(k=>hasKw(T,k)));const k=s?s.name:'Khác';intents[k]=(intents[k]||0)+1});const intentArr=Object.entries(intents).sort((a,b)=>b[1]-a[1]);const topI=intentArr.find(x=>x[0]!=='Khác');
const ins=[];if(!M.n)ins.push('Chưa có hội thoại trong khoảng thời gian này.');else{if(M.avg>S.settings.slaMin*6e4)ins.push(`⏱️ Thời gian phản hồi đầu tiên trung bình (${fmtDur(M.avg)}) vượt SLA ${S.settings.slaMin} phút. Bổ sung kịch bản tự động cho các câu hỏi phổ biến.`);else ins.push(`✅ Thời gian phản hồi đầu tiên trung bình ${fmtDur(M.avg)} – đạt SLA ${S.settings.slaMin} phút.`);
if(M.unanswered)ins.push(`📭 Còn ${M.unanswered} hội thoại chưa được trả lời – xử lý ngay trong <a href="#inbox">Hộp thư</a>.`);if(M.sent.neg/M.n>.15)ins.push(`😠 ${pct(M.sent.neg/M.n)} hội thoại mang cảm xúc tiêu cực – nên để kịch bản "Khiếu nại" chuyển nhân viên và theo dõi sát.`);
const w=chRows.filter(r=>r.m.n).sort((a,b)=>a.m.rate-b.m.rate)[0];if(w&&w.m.rate<1)ins.push(`📉 Kênh ${esc(w.c.name)} (${PF[w.c.pf].n}) có tỷ lệ phản hồi thấp nhất: ${pct(w.m.rate)}.`);if(topI)ins.push(`💡 Chủ đề khách hỏi nhiều nhất: "${esc(topI[0])}" (${topI[1]} hội thoại) – giữ kịch bản trả lời luôn cập nhật.`);if(M.bot<.3)ins.push(`🤖 Bot mới tự xử lý trọn vẹn ${pct(M.bot)} hội thoại. Thêm từ khóa cho kịch bản để giảm tải cho nhân viên.`)}
const eb={};S.posts.filter(p=>p.status==='published'&&p.time>=since).forEach(p=>Object.entries(p.metrics).forEach(([id,m])=>{const c=chById(id);if(!c||(RS.ch!=='all'&&id!==RS.ch))return;const b=eb[c.pf]||(eb[c.pf]={views:0,likes:0,comments:0,shares:0,n:0});for(const k in LBL)b[k]+=m[k];b.n++}));
const sn=M.n||1;

const RPL={shop:null,epoch:0,ready:false,loading:null,busy:false,previewBusy:false,scripts:[],settings:{brand:'ShopTrack',signup:'',open:8,close:22,slaMin:15,timeZone:'Asia/Ho_Chi_Minh'},form:null,revision:0,canEdit:false,channels:[],events:[],channelError:'',error:''};
function rplCurrent(shop,epoch){return SHOP.id===shop&&RPL.shop===shop&&RPL.epoch===epoch;}
function rplReset(){RPL.epoch++;Object.assign(RPL,{shop:SHOP.id,ready:false,loading:null,busy:false,previewBusy:false,scripts:[],revision:0,canEdit:false,form:null,channels:[],events:[],error:'',channelError:''});BT.log=[];}
function rplRecord(id){return RPL.scripts.find(s=>s.id===id);}
function rplError(e){return e?.code==='revision_conflict'?'Kịch bản đã được cập nhật ở phiên khác. Bản đang soạn được giữ; tải lại danh sách trước khi lưu lại.':e?.message||'Thao tác chưa hoàn tất. Vui lòng thử lại.';}
async function rplLoad(force=false){
 if(!managedApp()||window.QA_RUNNING||!APP_SCOPE||!SHOP.ready)return;
 if(RPL.shop!==SHOP.id)rplReset();if(RPL.loading)return RPL.loading;if(RPL.busy||RPL.ready&&!force)return;
 const shop=SHOP.id,epoch=RPL.epoch;RPL.error='';
 const pending=(async()=>{const results=await Promise.allSettled([cloudRequest('/api/replies/config'),cloudRequest('/api/replies/channels'),cloudRequest('/api/replies/activity')]);if(!rplCurrent(shop,epoch))return;
  const [config,channels,events]=results;
  if(config.status==='fulfilled'){const d=config.value;if(!Array.isArray(d.scripts)||!d.settings||!Number.isSafeInteger(d.revision))throw Error('Máy chủ trả về cấu hình không hợp lệ.');RPL.scripts=d.scripts;RPL.settings=d.settings;RPL.revision=d.revision;RPL.canEdit=d.canEdit===true;RPL.ready=true;}else RPL.error=rplError(config.reason);
  if(channels.status==='fulfilled'){RPL.channels=channels.value.channels||[];RPL.channelError='';}else RPL.channelError='Chưa tải được trạng thái nhận tin. Hãy làm mới trước khi bật kênh.';
  if(events.status==='fulfilled')RPL.events=events.value.events||[];
 })().catch(e=>{if(rplCurrent(shop,epoch))RPL.error=rplError(e);}).finally(()=>{if(rplCurrent(shop,epoch)){RPL.loading=null;if(route==='bot')render('bot');}});RPL.loading=pending;return pending;
}

 <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Kịch bản của shop</h3><div class="row"><button class="btn sm" onclick="rplDefaults()" ${readOnly?'disabled':''}>Dùng mẫu ShopTrack</button><button class="btn pri" onclick="editScript()" ${readOnly?'disabled':''}>Tạo kịch bản</button></div></div>${S.scripts.length?`<button class="btn sm" style="margin-top:10px" onclick="rplImportLocal()" ${readOnly?'disabled':''}>Nhập kịch bản từ trình duyệt</button>`:''}</div>
