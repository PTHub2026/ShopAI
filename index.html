<div class="row"><button class="btn sm" onclick="lbReset()">Xóa bộ lọc</button><div class="seg"><button class="${LB.view==='grid'?'on':''}" onclick="LB.view='grid';V.library()">▦ Lưới</button><button class="${LB.view==='list'?'on':''}" onclick="LB.view='list';V.library()">☰ Danh sách</button></div></div></div></div>
<div class="card row" style="padding:10px 12px;justify-content:space-between;position:sticky;top:60px;z-index:4;${LB.sel.size?'background:#eef2ff;border-color:#c7d2fe':''}"><div class="row"><input type="checkbox" style="width:auto" ${list.length&&list.every(a=>LB.sel.has(a.id))?'checked':''} onchange="lbSelList(this.checked)" title="Chọn tất cả kết quả"><b class="small">${LB.sel.size?`Đã chọn ${LB.sel.size}`:`${list.length} kết quả`}</b>
<select style="width:auto" onchange="lbQuick(this.value);this.value=''"><option value="">⚡ Chọn nhanh theo nhóm…</option><option value="all">Tất cả kết quả</option><option value="invert">Đảo vùng chọn</option><option value="none">Bỏ chọn tất cả</option><optgroup label="Theo loại">${Object.entries(KIND).map(([k,v])=>`<option value="kind:${k}">${v}</option>`).join('')}</optgroup><optgroup label="Theo trạng thái">${Object.entries(ASTAT).map(([k,v])=>`<option value="status:${k}">${v}</option>`).join('')}</optgroup><optgroup label="Theo ngày tạo"><option value="date:today">Tạo hôm nay</option><option value="date:7">Tạo trong 7 ngày</option><option value="date:30">Tạo trong 30 ngày</option><option value="date:old">Cũ hơn 30 ngày</option></optgroup><optgroup label="Theo thư mục">${S.folders.map(f=>`<option value="folder:${f.id}">${esc(f.name)}</option>`).join('')}</optgroup></select></div>
${LB.sel.size?`<div class="row"><button class="btn sm pri" onclick="lbUse([...LB.sel])">✏️ Dùng trong bài viết</button><select style="width:auto" onchange="if(this.value)lbMove(this.value)"><option value="">📁 Chuyển tới…</option>${S.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}<option value="none">Chưa phân loại</option></select><button class="btn sm" onclick="lbTag()"># Gắn nhãn</button><button class="btn sm" onclick="lbDownload([...LB.sel])">⬇ Tải xuống</button><button class="btn sm danger" onclick="lbDelete([...LB.sel])">Xóa</button></div>`:''}</div>
${list.length?[...groups.values()].map(g=>`${LB.group!=='none'?`<div class="row" style="margin:14px 0 8px"><input type="checkbox" style="width:auto" ${g.items.every(a=>LB.sel.has(a.id))?'checked':''} onchange="lbSelGroup(${esc(JSON.stringify(g.items.map(a=>a.id)))},this.checked)" title="Chọn cả nhóm"><b>${esc(g.l)}</b><span class="tag">${g.items.length}</span><span class="small muted">· tick để chọn cả nhóm</span></div>`:''}${LB.view==='grid'?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px">${g.items.map(a=>assetCard(a,sm)).join('')}</div>`:assetTable(g.items,sm)}`).join(''):'<div class="card muted">Không có tài nguyên phù hợp bộ lọc.</div>'}${list.length>shown.length?`<div style="text-align:center;margin:16px"><button class="btn" id="lbmore" onclick="LB.limit+=120;V.library()">Hiển thị thêm (${shown.length}/${list.length})</button></div>`:''}<div id="lbquota" class="small muted" style="margin-top:12px"></div>
</div></div>`;showQuota()}
async function showQuota(){const e=$('#lbquota');if(!e)return;let t='💾 Lưu trữ: '+STORE.mode;try{if(typeof navigator!=='undefined'&&navigator.storage&&navigator.storage.estimate){const q=await navigator.storage.estimate();t+=` · đã dùng ${fmtSize(q.usage||0)} / hạn mức ~${fmtSize(q.quota||0)}`}}catch(x){}e.textContent=t+(LS._mem&&!IDB.db?'':' · file gốc lưu trên trình duyệt này, chưa đồng bộ đám mây')}
function lbToggle(id,v){v?LB.sel.add(id):LB.sel.delete(id);V.library()}
function lbSelList(v){lbFilter(assetStatusMap()).forEach(a=>v?LB.sel.add(a.id):LB.sel.delete(a.id));V.library()}
function lbSelGroup(ids,v){ids.forEach(id=>v?LB.sel.add(id):LB.sel.delete(id));V.library()}
function lbQuick(v){if(!v)return;const sm=assetStatusMap();const l=lbFilter(sm);const [k,x]=v.split(':');const now=Date.now();
if(k==='none')LB.sel.clear();else if(k==='all')l.forEach(a=>LB.sel.add(a.id));else if(k==='invert')l.forEach(a=>LB.sel.has(a.id)?LB.sel.delete(a.id):LB.sel.add(a.id));
else{const f={kind:a=>a.kind===x,status:a=>(sm[a.id]||'unused')===x,folder:a=>a.folder===x,date:a=>x==='old'?a.created<now-30*DAY:x==='today'?new Date(a.created).toDateString()===new Date().toDateString():a.created>=now-(+x)*DAY}[k];const m=l.filter(f);m.forEach(a=>LB.sel.add(a.id));toast(`Đã chọn thêm ${m.length} tài nguyên`)}V.library()}
function lbReset(){Object.assign(LB,{limit:120,q:'',type:'all',status:'all',source:'all',date:'all',from:'',to:'',tag:'all'});V.library()}
function lbNewFolder(){askText('Tên thư mục mới','',n=>{if(!n||!n.trim())return;const f={id:'f'+uid(),name:n.trim()};S.folders.push(f);LB.folder=f.id;save();V.library()})}
function lbRenameFolder(){const f=S.folders.find(x=>x.id===LB.folder);if(!f)return;askText('Đổi tên thư mục',f.name,n=>{if(n&&n.trim()){f.name=n.trim();save();V.library()}})}
function lbDelFolder(){const f=S.folders.find(x=>x.id===LB.folder);if(!f)return;ask(`Xóa thư mục "${f.name}"? Tài nguyên bên trong sẽ chuyển sang "Chưa phân loại".`,()=>{S.folders=S.folders.filter(x=>x.id!==f.id);S.assets.forEach(a=>{if(a.folder===f.id)a.folder=null});LB.folder='all';save();V.library()},{ok:'Xóa thư mục',danger:true})}
function moveAssets(ids,fid){ids.forEach(i=>{const a=aById(i);if(a)a.folder=fid==='none'?null:fid});save();V.library();toast(`Đã chuyển ${ids.length} tài nguyên tới "${fid==='none'?'Chưa phân loại':folderName(fid)}"`)}
function lbDrop(e,fid){e.preventDefault();if(fid==='all')return;const id=e.dataTransfer.getData('text/plain');if(!aById(id))return;moveAssets(LB.sel.has(id)?[...LB.sel]:[id],fid)}
function lbMove(fid){moveAssets([...LB.sel],fid)}
function lbTag(){askText('Nhập nhãn (cách nhau dấu phẩy)','',v=>{const tg=splitTags(v);if(!tg.length)return;LB.sel.forEach(i=>{const a=aById(i);if(a)a.tags=[...new Set([...a.tags,...tg])]});save();V.library();toast('Đã gắn nhãn')})}
function lbDelete(ids){const used=ids.filter(id=>assetPosts(id).some(p=>p.status==='scheduled'));ask(`Xóa ${ids.length} tài nguyên khỏi Kho?`+(used.length?`\n⚠ ${used.length} tài nguyên đang gắn với bài sắp đăng (bài vẫn giữ nội dung đã soạn).`:''),()=>{
S.assets=S.assets.filter(a=>!ids.includes(a.id));ids.forEach(id=>{LB.sel.delete(id);delete BLOBS[id];IDB.del('files',id)});S.posts.forEach(p=>{if(p.assets)p.assets=p.assets.filter(x=>!ids.includes(x))});save();closeModal();V.library();toast(`Đã xóa ${ids.length} tài nguyên`)},{ok:'Xóa',danger:true})}
function lbDownload(ids){let n=0;ids.forEach(id=>{const a=aById(id);if(!a)return;let href=null,name=a.name;if(a.kind==='text'){href=URL.createObjectURL(new Blob([a.text||''],{type:'text/plain;charset=utf-8'}));if(!/\.txt$/i.test(name))name+='.txt'}else if(BLOBS[id])href=BLOBS[id];else if(a.kind==='image'&&(a.thumb||a.url))href=a.thumb||a.url;else if(a.url)href=a.url;if(!href)return;const d=n*350;n++;setTimeout(()=>{const l=document.createElement('a');l.href=href;l.download=name;l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove()},d)});
const miss=ids.length-n;toast(`Đang tải ${n} file`+(miss?` · ${miss} mục không còn file gốc trong trình duyệt này`:''))}
function compressImage(file,max=800,q=.82){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};img.onerror=()=>res(null);img.src=url})}
function videoPoster(url){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.preload='auto';let t;const done=x=>{clearTimeout(t);res(x)};t=setTimeout(()=>done(null),6000);v.onloadeddata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){done(null)}};v.onseeked=()=>{try{const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.7))}catch(e){done(null)}};v.onerror=()=>done(null);v.src=url})}
function kindOf(f){const t=f.type||'',n=f.name.toLowerCase();if(t.startsWith('image/'))return 'image';if(t.startsWith('video/'))return 'video';if(t.startsWith('text/')||/\.(txt|md)$/.test(n))return 'text';return 'doc'}
function targetFolder(k){if(LB.folder!=='all'&&LB.folder!=='none'&&S.folders.some(f=>f.id===LB.folder))return LB.folder;const f=KIND_FOLDER[k];return S.folders.some(x=>x.id===f)?f:null}
async function makeAsset(f){const kind=kindOf(f);const a={id:uid(),kind,name:f.name,folder:targetFolder(kind),tags:[],source:'upload',created:Date.now(),size:f.size};
if(kind!=='text')putFile(a.id,f);if(kind==='image'){BLOBS[a.id]=URL.createObjectURL(f);a.thumb=await compressImage(f)}else if(kind==='video'){BLOBS[a.id]=URL.createObjectURL(f);a.thumb=await videoPoster(BLOBS[a.id])}else if(kind==='text'){a.text=(await f.text()).slice(0,20000);a.name=a.name.replace(/\.(txt|md)$/i,'')}else BLOBS[a.id]=URL.createObjectURL(f);return a}
async function lbUpload(files){const fl=[...files];if(!fl.length)return;toast(`Đang tải lên ${fl.length} file…`);const docs=fl.filter(f=>kindOf(f)==='doc').length;for(const f of fl)S.assets.unshift(await makeAsset(f));save();if(route==='library')V.library();toast(`Đã thêm ${fl.length} tài nguyên vào Kho`+(IDB.db?' · đã lưu file gốc trong trình duyệt':''))}
function folderSelect(id,cur,auto){return `<select id="${id}">${auto?'<option value="auto" selected>Tự phân loại theo loại file</option>':''}${S.folders.map(f=>`<option value="${f.id}" ${!auto&&f.id===cur?'selected':''}>${esc(f.name)}</option>`).join('')}<option value="" ${!auto&&!cur?'selected':''}>Chưa phân loại</option></select>`}
function lbAddText(){modal(`<h3>📝 Thêm nội dung văn bản</h3><label>Tiêu đề</label><input id="lt_n" placeholder="VD: Mẫu bài tuyển đại lý"><label>Nội dung</label><textarea id="lt_t" style="min-height:180px"></textarea><label>Thư mục</label>${folderSelect('lt_f',targetFolder('text'))}<label>Nhãn (cách nhau dấu phẩy)</label><input id="lt_g"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="lbSaveText()">Lưu vào Kho</button></div>`)}
function lbSaveText(){const t=$('#lt_t').value.trim();if(!t)return toast('Nhập nội dung');S.assets.unshift({id:uid(),kind:'text',name:$('#lt_n').value.trim()||t.split('\n')[0].slice(0,60),text:t,folder:$('#lt_f').value||null,tags:splitTags($('#lt_g').value),source:'upload',created:Date.now(),size:new Blob([t]).size});save();closeModal();V.library();toast('Đã lưu nội dung vào Kho')}
function lbAddUrl(){modal(`<h3>🔗 Thêm từ URL</h3><label>Đường dẫn</label><input id="lu_u" placeholder="https://..."><label>Tên hiển thị</label><input id="lu_n"><label>Thư mục</label>${folderSelect('lu_f',LB.folder!=='all'&&LB.folder!=='none'?LB.folder:'f1')}<p class="small muted">Link ảnh (.jpg/.png/.webp/.gif/.svg) lưu dạng Hình ảnh, link video (.mp4/.mov/.webm) lưu dạng Video, link khác lưu dạng Liên kết.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="lbSaveUrl()">Thêm</button></div>`)}
function lbSaveUrl(){const u=$('#lu_u').value.trim();if(!/^https?:\/\//i.test(u))return toast('URL phải bắt đầu bằng http(s)://');const img=/\.(jpe?g|png|webp|gif|svg)(\?|#|$)/i.test(u),vid=/\.(mp4|mov|webm)(\?|#|$)/i.test(u);let nm=$('#lu_n').value.trim();if(!nm){try{nm=decodeURIComponent(u.split('?')[0].split('/').filter(Boolean).pop()||u)}catch(e){nm=u}}
S.assets.unshift({id:uid(),kind:img?'image':vid?'video':'link',name:nm.slice(0,80),url:u,thumb:img?u:null,folder:$('#lu_f').value||null,tags:[],source:'url',created:Date.now(),size:0});save();closeModal();V.library();toast('Đã thêm vào Kho')}
function lbConnect(k){const c=CONN[k];modal(`<h3>${c.ic} Kết nối ${c.n}</h3><div class="card small" style="background:#fffbeb;border-color:#fde68a">ℹ️ Bản demo <b>mô phỏng</b> kết nối. Bản production dùng <b>${c.api}</b> qua backend – không lưu mật khẩu trong trình duyệt.</div><label>${k==='email'?'Địa chỉ email nhận tài nguyên cho Kho':'Tài khoản'}</label><input id="cn_acc" value="${esc(c.acc)}">${k==='email'?'<p class="small muted">Sau khi kết nối, file đính kèm trong các email gửi tới địa chỉ này có thể nhập vào Kho.</p>':''}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="lbDoConnect('${k}')">Kết nối</button></div>`)}
function lbDoConnect(k){S.connectors[k]=$('#cn_acc').value.trim()||CONN[k].acc;save();closeModal();V.library();toast(`Đã kết nối ${CONN[k].n} (mô phỏng)`)}
function remoteItems(k){const I=(kind,name,x={})=>({rid:k+':'+name,kind,name,size:x.size||(x.text?new Blob([x.text]).size:((name.length*7919)%2800+200)*1024),...x});

return {drive:[I('image','Banner Tết 2027.png',{thumb:svgThumb('Banner Tết 2027','Chiến dịch cuối năm','#7c2d12','#f05100')}),I('image','Ảnh giao diện lên đơn.png',{thumb:svgThumb('Màn hình lên đơn','Ảnh giao diện','#1e3a8a','#3b82f6')}),I('video','Video giới thiệu ShopTrack 30s.mp4',{size:24e6}),I('doc','Brief chiến dịch Q4.docx'),I('text','Mẫu caption tuyển đại lý',{text:T1})],
dropbox:[I('image','Logo ShopTrack.png',{thumb:svgThumb('Logo ShopTrack','Bộ nhận diện','#030213','#717182')}),I('doc','Brand guideline.pdf',{size:5.2e6}),I('image','Key visual đại lý.jpg',{thumb:svgThumb('Key visual','Chương trình đại lý','#009588','#fcbb00')})],

email:[I('image','poster-hoi-thao.jpg',{thumb:svgThumb('Hội thảo đại lý','Đính kèm email','#d4183d','#030213'),mail:'Agency – Poster hội thảo'}),I('doc','hop-dong-dai-ly-mau.pdf',{mail:'Phòng kinh doanh – Hợp đồng mẫu'}),I('text','Nội dung email quảng cáo',{text:T2,mail:'Content team – Bản nháp'})]}[k]}
function lbImport(k){const items=remoteItems(k);const have=new Set(S.assets.map(a=>a.rid).filter(Boolean));modal(`<h3>${CONN[k].ic} Nhập từ ${CONN[k].n}</h3><div class="small muted">Tài khoản: ${esc(S.connectors[k])} · danh sách file mô phỏng</div><div style="margin:10px 0">${items.map((it,i)=>`<label class="ch" style="cursor:pointer;color:inherit;font-size:13px;margin-bottom:6px"><input type="checkbox" class="imp_c" value="${i}" style="width:auto" ${have.has(it.rid)?'disabled':''}>${it.thumb?`<img src="${it.thumb}" style="width:40px;height:40px;border-radius:6px;object-fit:cover">`:`<span style="font-size:24px">${KICON[it.kind]}</span>`}<div style="flex:1"><b>${esc(it.name)}</b><div class="small muted">${KIND[it.kind]} · ${fmtSize(it.size)}${it.mail?' · ✉️ '+esc(it.mail):''}${have.has(it.rid)?' · <b>đã có trong Kho</b>':''}</div></div></label>`).join('')}</div><label>Lưu vào thư mục</label>${folderSelect('imp_f','',true)}<div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn sm" onclick="document.querySelectorAll('.imp_c:not(:disabled)').forEach(c=>c.checked=true)">Chọn tất cả</button><div class="row"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="lbDoImport('${k}')">Nhập vào Kho</button></div></div>`)}
function lbDoImport(k){const items=remoteItems(k);const idx=[...document.querySelectorAll('.imp_c:checked')].map(c=>+c.value);if(!idx.length)return toast('Chọn ít nhất 1 file');const fv=$('#imp_f').value;
idx.forEach(i=>{const it=items[i];S.assets.unshift({id:uid(),rid:it.rid,kind:it.kind,name:it.name,thumb:it.thumb||null,text:it.text,url:'',folder:fv==='auto'?(S.folders.some(f=>f.id===KIND_FOLDER[it.kind])?KIND_FOLDER[it.kind]:null):(fv||null),tags:[],source:k,created:Date.now(),size:it.size})});save();closeModal();V.library();toast(`Đã nhập ${idx.length} file từ ${CONN[k].n}`)}
function lbOpen(id){const a=aById(id);if(!a)return;const s=assetStatusMap()[id]||'unused';const ps=assetPosts(id);const src=BLOBS[id]||a.thumb||a.url;
const big=a.kind==='image'&&src?`<img src="${esc(src)}" style="max-width:100%;max-height:340px;border-radius:8px;display:block;margin:auto">`:a.kind==='video'&&(BLOBS[id]||a.url)?`<video src="${esc(BLOBS[id]||a.url)}" controls style="max-width:100%;max-height:340px;display:block;margin:auto"></video>`:a.kind==='text'?`<textarea id="ad_text" style="min-height:200px">${esc(a.text||'')}</textarea>`:`<div style="text-align:center;padding:20px;background:#f3f3f5;border-radius:8px">${a.thumb?`<img src="${a.thumb}" style="max-width:100%;max-height:240px;display:block;margin:auto">`:`<div style="font-size:60px">${KICON[a.kind]}</div>`}<div class="small muted" style="margin-top:8px">${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a>`:(BLOBS[a.id]?`<a href="${BLOBS[a.id]}" download="${esc(a.name)}">⬇ Tải file gốc</a>`:'Không tìm thấy file gốc trong trình duyệt này (tải lên từ thiết bị/trình duyệt khác hoặc đã bị xóa)')}</div></div>`;
modal(`<div class="row" style="justify-content:space-between"><h3 style="margin:0">${KICON[a.kind]} Chi tiết tài nguyên</h3><span class="tag ${ASTC[s]}">${ASTAT[s]}</span></div><div style="margin:12px 0">${big}</div><div class="grid g2"><div><label>Tên</label><input id="ad_n" value="${esc(a.name)}"></div><div><label>Thư mục</label>${folderSelect('ad_f',a.folder)}</div></div><label>Nhãn (cách nhau dấu phẩy)</label><input id="ad_g" value="${esc(a.tags.join(', '))}">

function lbUse(ids,keep){const as=ids.map(aById).filter(Boolean);D.textAssets=D.textAssets||[];let added=0,skipped=0;
as.forEach(a=>{if(a.kind==='image'||a.kind==='video'){const src=BLOBS[a.id]||(a.kind==='image'?(a.thumb||a.url):a.url);if(!src){skipped++;return}if(!D.media.some(m=>m.assetId===a.id)){D.media.push({name:a.name,type:a.kind==='image'?'image/jpeg':'video/mp4',size:a.size,url:src,thumb:a.thumb||(a.kind==='image'?a.url:null),assetId:a.id});added++}}
else if(a.kind==='text'){D.content=(D.content?D.content.trimEnd()+'\n\n':'')+(a.text||'');D.textAssets.push(a.id);added++}else if(a.kind==='link'&&a.url){D.content=(D.content?D.content.trimEnd()+'\n\n':'')+a.url;added++}else skipped++});

function syncDraftToKho(){const ids=[];D.media.forEach(m=>{if(!m.assetId||!aById(m.assetId)){const kind=m.type.startsWith('video')?'video':'image';const a={id:uid(),kind,name:m.name,thumb:m.thumb||null,folder:S.folders.some(f=>f.id===KIND_FOLDER[kind])?KIND_FOLDER[kind]:null,tags:[],source:'post',created:Date.now(),size:m.size||0};if(m.url&&m.url.startsWith('blob:'))BLOBS[a.id]=m.url;if(m.file)putFile(a.id,m.file);else if(m.url&&m.url.startsWith('blob:'))fetch(m.url).then(r=>r.blob()).then(b=>putFile(a.id,b)).catch(()=>{});S.assets.unshift(a);m.assetId=a.id}ids.push(m.assetId)});
const c=D.content.trim();if(c){const linked=(D.textAssets||[]).filter(id=>{const a=aById(id);return a&&c.includes((a.text||'').trim())});ids.push(...linked);const same=linked.length&&linked.map(id=>aById(id).text.trim()).join('\n\n')===c;
if(!same){const a={id:uid(),kind:'text',name:(c.split('\n')[0].replace(/\p{Extended_Pictographic}\uFE0F?/gu,'').trim()||'Bài viết').slice(0,60),text:D.content,folder:S.folders.some(f=>f.id==='f4')?'f4':null,tags:[],source:'post',created:Date.now(),size:new Blob([D.content]).size};S.assets.unshift(a);ids.push(a.id)}}return [...new Set(ids)]}

function vScript(o){const s=S.settings,b=s.brand||'ShopTrack',a=(s.audience||'Shop online').split(',')[0].trim();const seed=o.seed||0;const pick=(arr,k=0)=>arr[(seed+k)%arr.length];

const out=[];out.push(topic?(/\?$/.test(topic)?topic:topic+' – bạn đã biết chưa?'):fill(pick(VHOOK)));

function vMedia(id){const a=aById(id);const src=vSrc(a);if(!src)return Promise.resolve(null);const c=VS.media[id];if(c&&c.src===src)return c.ready;const o={src,kind:a.kind};
o.ready=new Promise(res=>{if(a.kind==='video'){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.loop=true;v.preload='auto';v.onloadeddata=()=>res(v);v.onerror=()=>res(null);v.src=src;o.el=v}else{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;o.el=im}setTimeout(()=>res(null),8000)}).then(el=>{o.ok=!!el;return el});VS.media[id]=o;return o.ready}

function vRR(x,X,Y,w,hh,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+hh,r);x.arcTo(X+w,Y+hh,X,Y+hh,r);x.arcTo(X,Y+hh,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function vWrap(x,t,maxW){const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{const tt=line?line+' '+w:w;if(x.measureText(tt).width>maxW&&line){out.push(line);line=w}else line=tt});out.push(line)});return out}
function vScene(x,W,H,sc,lt,alpha,idx){const th=VTHEME[VP.theme]||VTHEME.dark;x.save();x.globalAlpha=alpha;const m=sc.asset&&VS.media[sc.asset];const el=m&&m.ok?m.el:null;
if(el){const iw=el.videoWidth||el.naturalWidth||el.width,ih=el.videoHeight||el.naturalHeight||el.height;const zoom=1+0.06*Math.min(1,lt/Math.max(sc.d,0.1));const kc=Math.max(W/iw,H/ih);if(VP.fit==='fit'&&Math.abs(iw/ih-W/H)>0.15){try{x.save();x.filter='blur(28px) brightness(.7)';x.drawImage(el,(W-iw*kc*1.1)/2,(H-ih*kc*1.1)/2,iw*kc*1.1,ih*kc*1.1);x.restore();x.globalAlpha=alpha;const kf=Math.min(W/iw,H/ih)*zoom*0.96;const fw=iw*kf,fh=ih*kf;const fy=VP.ratio==='9:16'?H*0.42-fh/2:(H-fh)/2;x.drawImage(el,(W-fw)/2,Math.max(0,fy),fw,fh)}catch(e){}}else{const k=kc*zoom;const dw=iw*k,dh=ih*k;try{x.drawImage(el,(W-dw)/2,(H-dh)/2,dw,dh)}catch(e){}}const g=x.createLinearGradient(0,H*0.35,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=g;x.fillRect(0,0,W,H)}
else{const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,th[0]);g.addColorStop(1,th[1]);x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=alpha*0.08;x.fillStyle=th[2];for(let i=0;i<5;i++){x.beginPath();x.arc(W*(0.15+0.2*i),H*(0.2+0.13*((i+idx)%5)),W*0.18,0,7);x.fill()}x.globalAlpha=alpha}
const fs=Math.round(Math.min(W,H)*(sc.cta?0.072:0.064));x.font=`800 ${fs}px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;x.textAlign='center';x.textBaseline='middle';
const lines=vWrap(x,sc.text,W*0.82).slice(0,6);const lh=fs*1.28;const bh=lines.length*lh+fs*0.9;const ap=Math.min(1,lt/0.45);const fitMid=el&&VP.fit==='fit'&&VP.pos==='center'&&VP.ratio==='9:16';const yc=(VP.pos==='bottom'||fitMid?H*(fitMid?0.8:0.74):VP.pos==='top'?H*0.28:H*0.5)+(1-ap)*fs*0.8;
x.globalAlpha=alpha*ap;const bw=Math.min(W*0.9,Math.max(...lines.map(l=>x.measureText(l).width))+fs*1.2);const light=VP.theme==='light'&&!el;x.fillStyle=light?'rgba(255,255,255,.85)':'rgba(0,0,0,.42)';vRR(x,(W-bw)/2,yc-bh/2,bw,bh,fs*0.4);x.fill();
x.fillStyle=light?th[2]:'#fff';lines.forEach((l,i)=>x.fillText(l,W/2,yc-bh/2+fs*0.45+lh*(i+0.5)));
if(sc.cta){x.font=`700 ${Math.round(fs*0.62)}px Inter,system-ui,sans-serif`;x.fillStyle=light?th[2]:'#fff';x.fillText('👉 '+(S.settings.brand||'ShopTrack'),W/2,yc+bh/2+fs*1.1)}
x.restore()}
function vDraw(x,t){const [W,H]=VRATIO[VP.ratio]||VRATIO['9:16'];x.clearRect(0,0,W,H);x.fillStyle='#000';x.fillRect(0,0,W,H);const sc=VP.scenes;if(!sc.length)return -1;let acc=0,i=0;for(;i<sc.length;i++){if(t<acc+(+sc[i].d)||i===sc.length-1)break;acc+=+sc[i].d}

['Bảo mật','Chặn chèn mã (XSS) qua tên khách & tên tài nguyên',async()=>{window.__xss=0;const p='<img src=x onerror="window.__xss=1">';const c=JSON.parse(JSON.stringify(S.convos[0]));c.id='qa_xss';c.customer=p;c.unread=true;c.messages[c.messages.length-1].t=Date.now()+9e5;S.convos.unshift(c);S.assets.unshift({id:'qa_x',kind:'text',name:p,text:p,folder:null,tags:[p],source:'upload',created:Date.now()+9e5,size:1});IB.sel='qa_xss';go('inbox');lbReset();go('library');await qWait(150);qOk(!window.__xss,'Mã độc đã chạy');qOk(!document.querySelector('#view img[src="x"]'),'Thẻ img bị chèn')}],
['Bảo mật','Không lưu API key trong trình duyệt',async()=>{qOk(!/(sk-[A-Za-z0-9]{16}|AIza[0-9A-Za-z_-]{20})/.test(JSON.stringify(S)))}],
['Lưu trữ','IndexedDB ghi/đọc file gốc',async()=>{if(!IDB.db)await IDB.open();if(!IDB.db)throw {skip:'Trình duyệt chặn IndexedDB trong khung nhúng sandbox – app hiện cảnh báo, dùng bộ nhớ tạm'};await IDB.put('files','qa_blob',new Blob(['QA'],{type:'text/plain'}));const b=await IDB.get('files','qa_blob');await IDB.del('files','qa_blob');qOk(b&&b.size===2,'Đọc lại sai')}],
['Lưu trữ','Dữ liệu xuất JSON hợp lệ, nhập lại được',async()=>{const s=JSON.parse(JSON.stringify(S));qOk(s.v===3&&Array.isArray(s.posts)&&Array.isArray(s.assets))}],
['Hiệu năng','Mỗi trang render < 300 ms',async()=>{let mx=0,w='';for(const r of ROUTES()){const t=performance.now();go(r);const d=performance.now()-t;QA.perf['view_'+r]=Math.round(d);if(d>mx){mx=d;w=r}}QA.perf.maxView=Math.round(mx)+' ms ('+w+')';qOk(mx<300,'Chậm nhất '+Math.round(mx)+' ms ở '+w)}],
['Hiệu năng','Chatbot xử lý 1.000 tin < 1 giây',async()=>{const t=performance.now();for(let i=0;i<1000;i++)botReply(qConv(),'cho hỏi bảng giá cước và cách lên đơn '+i,Date.now(),{test:true});const d=performance.now()-t;QA.perf.bot1000=Math.round(d)+' ms';qOk(d<1000,Math.round(d)+' ms')}],
['Hiệu năng','Chấm điểm nội dung 1.000 lần < 500 ms',async()=>{const t=performance.now();for(let i=0;i<1000;i++)contentScore('🚀 ShopTrack lên đơn nhanh?\n✅ Quản lý đại lý\nĐăng ký ngay! #ShopTrack '+i);const d=performance.now()-t;QA.perf.score1000=Math.round(d)+' ms';qOk(d<500,Math.round(d)+' ms')}]
];
async function runQA(){if(QA.running)return;QA.running=true;const btn=$('#qa_run');if(btn){btn.disabled=true;btn.textContent='Đang chạy…'}
const bak={S,D,VP,VSo:VS.out,LB:{...LB,sel:new Set(LB.sel)},IB:{...IB},AN:{...AN},RS:{...RS},F:JSON.parse(JSON.stringify(F)),conf:window.confirm,pr:window.prompt,toast:window.toast};
let js=0;const onErr=()=>{js++};addEventListener('error',onErr);window.QA_RUNNING=true;S=migrate3(seed());D=newDraft();QA.perf={};const res=[];const t0=performance.now();
for(const [g,n,fn] of QA_TESTS){window.confirm=()=>true;window.prompt=()=>'QA';const t=performance.now();try{await fn();res.push({g,n,ok:true,ms:performance.now()-t})}catch(e){if(e&&e.skip)res.push({g,n,ok:null,err:e.skip,ms:performance.now()-t});else res.push({g,n,ok:false,err:String(e&&e.message||e),ms:performance.now()-t})}}
QA.ms=Math.round(performance.now()-t0);removeEventListener('error',onErr);
S=bak.S;D=bak.D;VP=bak.VP;VS.out=bak.VSo;Object.assign(LB,bak.LB);Object.assign(IB,bak.IB);Object.assign(AN,bak.AN);Object.assign(RS,bak.RS);Object.assign(F.posts,bak.F.posts);Object.assign(F.calendar,bak.F.calendar);window.confirm=bak.conf;window.prompt=bak.pr;
await qWait(1000);window.QA_RUNNING=false;QA.js=js;QA.res=res;QA.at=new Date();QA.running=false;go('qa')}
V.qa=()=>{const r=QA.res;const pass=r?r.filter(x=>x.ok===true).length:0,skip=r?r.filter(x=>x.ok===null).length:0,fail=r?r.length-pass-skip:0;const groups=r?[...new Set(r.map(x=>x.g))]:[];
$('#view').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">🧪 Kiểm thử tự động (${QA_TESTS.length} ca)</h3><p class="small muted" style="margin:4px 0 0">Chạy trên bản sao dữ liệu demo, dữ liệu thật được khôi phục sau khi chạy. Màn hình sẽ nhấp nháy khi các trang được mở thử.</p></div><button class="btn pri" id="qa_run" onclick="runQA()" ${QA.running?'disabled':''}>▶ Chạy kiểm thử</button></div></div>
${r?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px">${kp('Đạt',`<span id="qa_pass">${pass}</span>/${r.length}`,'')}${kp('Không đạt',`<span id="qa_fail">${fail}</span>`,'')}${kp('Bỏ qua (môi trường)',`<span id="qa_skip">${skip}</span>`,'')}${kp('Lỗi JS khi chạy',`<span id="qa_js">${QA.js}</span>`,'')}${kp('Thời gian chạy',QA.ms+' ms',`<span class="d muted">${QA.at.toLocaleTimeString('vi-VN')}</span>`)}</div>
<div class="card"><h3>⚡ Số đo hiệu năng</h3><div class="small" id="qa_perf">${Object.entries(QA.perf).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(typeof v==='number'?v+' ms':v)}</span>`).join(' ')}</div></div>
${groups.map(g=>`<div class="card"><h3>${esc(g)} <span class="tag">${r.filter(x=>x.g===g&&x.ok===true).length}/${r.filter(x=>x.g===g).length}</span></h3>${r.filter(x=>x.g===g).map(x=>`<div class="row qa-case" style="justify-content:space-between;border-top:1px solid var(--bd);padding:6px 0;flex-wrap:nowrap"><span>${x.ok===true?'✅':x.ok===null?'⚠️':'❌'} ${esc(x.n)}${x.ok===true?'':`<br><span class="small" style="color:${x.ok===null?'#b26b00':'#d4183d'}">${esc(x.err)}</span>`}</span><span class="small muted">${Math.round(x.ms)} ms</span></div>`).join('')}</div>`).join('')}`:'<div class="card muted">Chưa chạy. Bấm "▶ Chạy kiểm thử" (khoảng 5–20 giây).</div>'}`}

/* ================= SCHEDULER & BOOT ================= */
function tick(){let ch=false;S.posts.forEach(p=>{if(p.status==='scheduled'&&p.time<=Date.now()){if(p.channels.map(chById).some(c=>!c||!c.connected)){p.status='failed';p.error='Kênh đã ngắt kết nối'}else publish(p);ch=true}});if(ch){save();toast('Đã xử lý bài đến giờ đăng');if(route==='posts'||route==='calendar')render()}$('#clock').textContent=new Date().toLocaleString('vi-VN',{weekday:'short',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}
setInterval(tick,15000);tick();render(location.hash.slice(1)||'create');bootStorage().then(()=>{if(LS._mem&&!IDB.db){const b=document.createElement('div');b.id='storewarn';b.setAttribute('role','alert');b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff7e6;border-top:1px solid #f5c26b;padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between';b.innerHTML='<span>⚠️ Trình duyệt đang <b>chặn lưu trữ</b> trong khung nhúng này: dữ liệu và nháp sẽ <b>mất khi tải lại trang</b>. Để lưu lâu dài, tải file <code>shopai.html</code> về máy rồi mở bằng Chrome (hoặc đưa lên hosting riêng).</span><button class="btn sm" onclick="this.parentNode.remove()">Đã hiểu</button>';document.body.appendChild(b)}});
</script></body></html>
