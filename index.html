 <div class="card"><h3>Thương hiệu & giờ làm việc</h3><div class="grid g2"><div><label for="rpl_brand">Tên thương hiệu</label><input id="rpl_brand" value="${esc(s.brand)}" oninput="rplForm('brand',this.value)" ${readOnly?'disabled':''}></div><div><label for="rpl_signup">Link đăng ký</label><input id="rpl_signup" value="${esc(s.signup)}" oninput="rplForm('signup',this.value)" ${readOnly?'disabled':''}></div><div><label for="rpl_open">Mở cửa (giờ)</label><input id="rpl_open" type="number" step="0.5" min="0" max="23.5" value="${s.open}" oninput="rplForm('open',+this.value)" ${readOnly?'disabled':''}></div><div><label for="rpl_close">Đóng cửa (giờ)</label><input id="rpl_close" type="number" step="0.5" min="0" max="24" value="${s.close}" oninput="rplForm('close',+this.value)" ${readOnly?'disabled':''}></div><div><label for="rpl_sla">SLA phản hồi (phút)</label><input id="rpl_sla" type="number" min="1" max="1440" value="${s.slaMin}" oninput="rplForm('slaMin',+this.value)" ${readOnly?'disabled':''}></div><div class="small muted" style="align-self:center">Giờ Việt Nam · UTC+7</div></div><button class="btn pri" style="margin-top:12px" onclick="rplSaveSettings()" ${readOnly?'disabled':''}>Lưu cài đặt</button></div>
 <div class="card"><h3>Kênh trả lời tự động</h3>${RPL.channelError?'<p role="status">'+esc(RPL.channelError)+'</p>':''}${RPL.channels.map(c=>`<div class="ch" style="justify-content:space-between"><div><b>${esc(c.name)}</b><div class="small muted">${esc(PF[c.provider]?.n||c.provider)} · ${c.enabled?'Đang tự động trả lời':esc(rplReason(c.reason))}</div></div><button class="btn sm ${c.enabled?'':'pri'}" aria-label="${c.enabled?'Tắt':'Bật'} trả lời tự động cho ${esc(c.name)}" onclick="rplActivate('${escAttr(c.id)}',${!c.enabled})" ${RPL.busy||!may('channels.configure_token')?'disabled':''}>${c.enabled?'Tắt':c.ready?'Bật trả lời tự động':'Thiết lập'}</button></div>`).join('')||'<p class="muted">Chưa có kênh hỗ trợ nhận tin. Kết nối Telegram hoặc bổ sung quyền Messenger cho Facebook Page.</p>'}<button class="btn sm" onclick="go('accounts')">Quản lý kênh</button></div>
 <div class="card"><h3>Hoạt động gần đây</h3>${RPL.events.length?'<table><tr><th>Thời gian</th><th>Kịch bản</th><th>Kết quả</th></tr>'+RPL.events.slice(0,20).map(e=>'<tr><td>'+esc(fmtT(e.createdAt*1000))+'</td><td>'+esc(e.scriptName||'—')+'</td><td>'+esc(rplEventStatus(e.status))+(e.errorCode?' · '+esc(e.errorCode):'')+'</td></tr>').join('')+'</table>':'<p class="muted">Chưa có lượt xử lý tin nhắn thật.</p>'}</div></div>
 <div class="card" style="position:sticky;top:72px"><h3>Chạy thử kịch bản</h3><p class="small muted">Dùng cấu hình đã lưu trên máy chủ. Kết quả chạy thử không gửi cho khách hàng.</p><div class="row"><select aria-label="Kênh chạy thử" style="flex:1;width:auto" onchange="BT.pf=this.value">${Object.entries(PF).map(([k,v])=>`<option value="${k}" ${BT.pf===k?'selected':''}>${esc(v.n)}</option>`).join('')}</select><label class="small row" style="margin:0"><input type="checkbox" style="width:auto" ${BT.off?'checked':''} onchange="BT.off=this.checked"> Ngoài giờ</label></div><div id="btmsgs" class="msgs" style="height:300px;margin:12px 0;border-radius:8px">${BT.log.map(m=>'<div class="m '+m.from+'">'+(m.script?'<div class="small">'+esc(m.script)+'</div>':'')+esc(m.text)+'</div>').join('')||'<p class="small muted">Nhập tin nhắn để kiểm tra điều kiện và câu trả lời.</p>'}</div><div class="row" style="flex-wrap:nowrap"><input id="bt_in" aria-label="Tin nhắn chạy thử" placeholder="Ví dụ: Tôi muốn làm đại lý" onkeydown="if(isEnter(event))btSend()"><button class="btn pri" onclick="btSend()" ${!RPL.ready||RPL.previewBusy?'disabled':''}>Chạy thử</button></div><button class="btn sm" style="margin-top:10px" onclick="BT.log=[];render('bot')">Xóa cuộc thử</button></div></div>`;
 if(!RPL.ready&&!RPL.loading&&!RPL.error)rplLoad();const list=$('#btmsgs');if(list)list.scrollTop=list.scrollHeight;
}
function rplReason(reason){return ({channel_disconnected:'Kênh cần kết nối lại',social_key_missing:'Máy chủ cần cấu hình khóa bảo mật',public_origin_missing:'Máy chủ cần cấu hình địa chỉ webhook',meta_webhook_not_ready:'Cần hoàn tất webhook và cấp quyền Messenger',provider_unsupported:'Nền tảng chưa hỗ trợ nhận tin',meta_messaging_permissions_missing:'Cần cấp quyền nhận và trả lời tin nhắn cho Trang',telegram_webhook_owned_elsewhere:'Bot đang được hệ thống khác nhận tin',telegram_target_unsupported:'Chọn nhóm hoặc tài khoản Telegram nhận tin',provider_verification_failed:'Chưa xác minh được quyền nhận tin'})[reason]||reason||'Chưa bật';}
function rplEventStatus(s){return ({sent:'Đã gửi',queued:'Đang chờ',processing:'Đang xử lý',failed:'Thất bại',unknown:'Cần kiểm tra',skipped:'Đã bỏ qua'})[s]||s;}
function rplForm(k,v){if(!RPL.form)RPL.form={...RPL.settings};RPL.form[k]=v;}
async function rplCommit(scripts,settings=RPL.settings){
 if(!RPL.ready||RPL.busy||!RPL.canEdit)throw Error('Chưa thể lưu cấu hình của shop hiện tại.');const shop=SHOP.id,epoch=RPL.epoch,revision=RPL.revision;RPL.busy=true;
 try{const d=await cloudRequest('/api/replies/config',{method:'PUT',body:JSON.stringify({scripts,settings,revision})});if(!rplCurrent(shop,epoch))return false;RPL.scripts=d.scripts;RPL.settings=d.settings;RPL.revision=d.revision;RPL.canEdit=d.canEdit===true;RPL.error='';return true;}catch(e){if(rplCurrent(shop,epoch))RPL.error=rplError(e);throw e;}finally{if(rplCurrent(shop,epoch))RPL.busy=false;}
}
async function rplSaveScript(id,v){const shop=SHOP.id,epoch=RPL.epoch,generation=modalGeneration;const source=id?rplRecord(id):null;if(id&&!source)return toast('Kịch bản đã thay đổi. Tải lại danh sách.');const list=RPL.scripts.map(x=>({...x}));if(source)list[list.findIndex(x=>x.id===id)]={...source,...v};else list.push({id:uid(),on:true,...v});const button=$('#mbox button[onclick^="saveScript"]');if(button)button.disabled=true;try{const saved=await rplCommit(list);if(!saved||!rplCurrent(shop,epoch))return;if(modalGeneration===generation)closeModal();if(route==='bot')render('bot');toast('Đã lưu kịch bản lên máy chủ.');}catch(e){toast(rplError(e));}finally{if(button?.isConnected)button.disabled=false;}}
async function rplToggle(id,on){const before=rplRecord(id);if(!before)return;try{if(await rplCommit(RPL.scripts.map(x=>x.id===id?{...x,on}:x))&&route==='bot')render('bot');}catch(e){toast(rplError(e));if(route==='bot')render('bot');}}
function rplDelete(id){const shop=SHOP.id,epoch=RPL.epoch;ask('Xóa kịch bản này khỏi máy chủ? Các lượt xử lý cũ vẫn được giữ trong lịch sử.',async()=>{if(!rplCurrent(shop,epoch))return;try{if(await rplCommit(RPL.scripts.filter(x=>x.id!==id))&&route==='bot')render('bot');}catch(e){toast(rplError(e));}},{ok:'Xóa kịch bản',danger:true});}
async function rplSaveSettings(){try{if(await rplCommit(RPL.scripts,RPL.form||RPL.settings)){RPL.form=null;if(route==='bot')render('bot');toast('Đã lưu giờ làm việc và SLA trên máy chủ.');}}catch(e){toast(rplError(e));}}
function rplDefaults(){const shop=SHOP.id,epoch=RPL.epoch;ask('Dùng bộ kịch bản ShopTrack thay cho danh sách hiện tại? Thao tác này chưa bật gửi tin tự động.',async()=>{if(!rplCurrent(shop,epoch))return;try{if(await rplCommit(defaultScripts().map(({hits,...s})=>s))&&route==='bot')render('bot');}catch(e){toast(rplError(e));}},{ok:'Dùng bộ mẫu'});}
function rplImportLocal(){const shop=SHOP.id,epoch=RPL.epoch;ask('Nhập '+S.scripts.length+' kịch bản từ trình duyệt vào shop “'+SHOP.name+'”, thay cho danh sách máy chủ hiện tại? Thao tác này chưa bật gửi tin tự động.',async()=>{if(!rplCurrent(shop,epoch))return;try{if(await rplCommit(S.scripts.map(({hits,...s})=>s))&&route==='bot')render('bot');}catch(e){toast(rplError(e));}},{ok:'Nhập kịch bản'});}
async function rplPreview(txt){if(!RPL.ready||RPL.previewBusy)return;const t=String(txt||$('#bt_in')?.value||'').trim();if(!t)return;const shop=SHOP.id,epoch=RPL.epoch,view=viewGeneration;RPL.previewBusy=true;BT.log.push({from:'customer',text:t});try{const d=await cloudRequest('/api/replies/preview',{method:'POST',body:JSON.stringify({text:t,name:'Khách chạy thử',provider:BT.pf,firstMessage:BT.log.filter(m=>m.from==='customer').length===1,forceOff:BT.off})});if(!rplCurrent(shop,epoch)||viewGeneration!==view)return;BT.log.push({from:'bot',text:d.reply?.text||'Không có kịch bản phù hợp.',script:d.reply?d.reply.scriptName+' · '+(ACT[d.reply.action]||d.reply.action):''});RPL.previewBusy=false;if(route==='bot')render('bot');}catch(e){if(rplCurrent(shop,epoch))toast(rplError(e));}finally{RPL.previewBusy=false;}}
async function rplActivate(id,enabled){const channel=RPL.channels.find(c=>c.id===id);if(!channel)return;if(enabled&&!channel.ready)return modal(`<h3>Thiết lập ${esc(PF[channel.provider]?.n||channel.provider)}</h3><p>${esc(rplReason(channel.reason))}</p><p class="small muted">Kết nối đăng bài và kết nối hộp thư là hai quyền riêng. Kênh này chưa gửi tự động.</p><div class="row"><button class="btn" onclick="closeModal()">Đóng</button>${channel.provider==='facebook'?'<button class="btn pri" onclick="closeModal();socialConnectMeta(true)">Cấp quyền Messenger</button>':''}<button class="btn" onclick="closeModal();go('accounts')">Quản lý kênh</button></div>`);const shop=SHOP.id,epoch=RPL.epoch;if(enabled&&channel.provider==='facebook'){

{esc(s.detailError)}</p>`:c?`<h3>${esc(c.name)} · ${esc(PF[c.provider]?.n||c.provider)}</h3><p class="small muted">${esc(liveConversationStatus(c.status))} · ${c.paused?'Bot đang tạm dừng':'Bot có thể phản hồi khi hội thoại đang mở'}${c.assignedTo?' · Được giao: '+esc(c.assignedTo):''}</p><div class="row" style="margin-bottom:12px"><button class="btn sm" data-live-action="pause" ${!editable||locked?'disabled':''}>${c.paused?'Tiếp tục bot':'Tạm dừng bot'}</button><button class="btn sm" data-live-action="status" ${!editable||locked?'disabled':''}>${c.status==='closed'?'Mở lại hội thoại':'Đóng hội thoại'}</button></div>${shopCan('conversations.assign')?liveInboxAssignment(c,locked):''}<label for="live_inbox_tags">Nhãn (cách nhau dấu phẩy)</label><div class="row"><input id="live_inbox_tags" style="flex:1" value="${esc(c.tags.join(', '))}" ${!editable||locked?'disabled':''}><button class="btn sm" data-live-action="tags" ${!editable||locked?'disabled':''}>Lưu nhãn</button></div><div style="margin:16px 0;max-height:480px;overflow:auto">${s.messages.map(m=>`<div class="card" style="margin:8px 0;padding:10px"><div class="small muted">${esc(({customer:'Khách hàng',bot:'Bot',agent:'Nhân viên'})[m.from]||m.from)} · ${esc(new Date(m.createdAt*1000).toLocaleString('vi-VN'))}${m.scriptName?' · '+esc(m.scriptName):''}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.text)}</div></div>`).join('')||'<p class="muted">Chưa có tin nhắn.</p>'}</div><p class="small muted">Hiển thị tối đa 500 tin nhắn đầu tiên đã ghi nhận. Chưa hỗ trợ gửi trả lời thủ công tại đây; nhân viên trả lời trực tiếp trên nền tảng.</p>`:'<p class="muted">Chọn một hội thoại để đọc tin nhắn.</p>'}</div></div>`;
for(const el of document.querySelectorAll('[data-live-conversation]'))el.onclick=()=>liveInboxSelect(el.dataset.liveConversation);
for(const el of document.querySelectorAll('[data-live-action]'))el.onclick=()=>{if(!LIVEIN.conversation)return;const c=LIVEIN.conversation;if(el.dataset.liveAction==='pause')liveInboxUpdate(c.paused&&c.status==='handoff'?{paused:false,status:'open'}:{paused:!c.paused});else if(el.dataset.liveAction==='status')liveInboxUpdate({status:c.status==='closed'?'open':'closed'});else if(el.dataset.liveAction==='assign'){if(!shopCan('conversations.assign')||!LIVEIN.membersLoaded)return;const assignedTo=$('#live_inbox_assignee')?.value||null;if(assignedTo&&!LIVEIN.members.some(m=>m.userId===assignedTo))return toast('Hãy chọn thành viên đang có quyền trả lời.');liveInboxUpdate({assignedTo});}else{const tags=$('#live_inbox_tags').value.split(',').map(t=>t.trim()).filter(Boolean);if(tags.length>20||tags.some(t=>t.length>100))return toast('Tối đa 20 nhãn, mỗi nhãn 100 ký tự.');liveInboxUpdate({tags:[...new Set(tags)]});}};
}
function liveConversationStatus(status){return ({open:'Đang mở',closed:'Đã đóng',handoff:'Cần nhân viên'})[status]||status;}
function liveInboxFilter(){if(LIVEIN.busy)return;LIVEIN.q=$('#live_inbox_q')?.value.trim()||'';LIVEIN.status=$('#live_inbox_status')?.value||'';LIVEIN.selected=null;LIVEIN.conversation=null;LIVEIN.messages=[];LIVEIN.detailLoading=false;LIVEIN.detailError='';LIVEIN.detailRun++;liveInboxLoad();}
async function liveInboxLoad(more=false){if(!SHOP.ready||!shopCan('conversations.view_assigned'))return;liveInboxReset();const shop=SHOP.id,generation=viewGeneration,run=++LIVEIN.run,cursor=more?LIVEIN.cursor:null;LIVEIN.loading=true;LIVEIN.error='';if(!more)LIVEIN.rows=[];liveInboxDraw();try{const query=new URLSearchParams({q:LIVEIN.q,status:LIVEIN.status});if(cursor)query.set('cursor',cursor);const data=await cloudRequest('/api/replies/conversations?'+query);if(!liveScope(shop,generation,'inbox')||run!==LIVEIN.run)return;if(!Array.isArray(data.conversations))throw Error('Danh sách hội thoại không hợp lệ.');LIVEIN.rows=more?[...LIVEIN.rows,...data.conversations.filter(x=>!LIVEIN.rows.some(old=>old.id===x.id))]:data.conversations;LIVEIN.cursor=data.cursor||null;if(!more&&LIVEIN.selected)liveInboxSelect(LIVEIN.selected);}
catch(e){if(liveScope(shop,generation,'inbox')&&run===LIVEIN.run)LIVEIN.error=e.message||'Chưa tải được hội thoại.';}finally{if(run===LIVEIN.run&&LIVEIN.shop===shop){LIVEIN.loading=false;if(liveScope(shop,generation,'inbox'))liveInboxDraw();}}}
async function liveInboxSelect(id){if(LIVEIN.busy||!SHOP.ready||!shopCan('conversations.view_assigned'))return;const shop=SHOP.id,generation=viewGeneration,run=++LIVEIN.detailRun;LIVEIN.selected=id;LIVEIN.conversation=null;LIVEIN.messages=[];LIVEIN.detailLoading=true;LIVEIN.detailError='';liveInboxDraw();try{const data=await cloudRequest('/api/replies/conversations/'+encodeURIComponent(id));if(!liveScope(shop,generation,'inbox')||LIVEIN.detailRun!==run||LIVEIN.selected!==id)return;if(!data.conversation||!Array.isArray(data.messages))throw Error('Tin nhắn không hợp lệ.');LIVEIN.conversation=data.conversation;LIVEIN.messages=data.messages;LIVEIN.rows=LIVEIN.rows.map(row=>row.id===id?data.conversation:row);}catch(e){if(liveScope(shop,generation,'inbox')&&run===LIVEIN.detailRun)LIVEIN.detailError=e.message||'Chưa tải được tin nhắn.';}finally{if(run===LIVEIN.detailRun&&LIVEIN.shop===shop){LIVEIN.detailLoading=false;if(liveScope(shop,generation,'inbox'))liveInboxDraw();}}}

function liveMetricsDraw(){if(route!=='response'||LIVEMET.shop!==SHOP.id)return;const s=LIVEMET,d=s.data,number=n=>Number.isFinite(Number(n))?Number(n):0,duration=n=>n===null||n===undefined?'Chưa có phản hồi':Math.round(number(n))+' giây';$('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>Chất lượng phản hồi thực tế</h3><div class="row"><select aria-label="Khoảng thời gian báo cáo" style="width:auto" onchange="LIVEMET.days=Number(this.value);LIVEMET.data=null;liveMetricsLoad()">${[7,14,30,90].map(n=>`<option value="${n}" ${s.days===n?'selected':''}>${n} ngày</option>`).join('')}</select><button class="btn" onclick="liveMetricsLoad()" ${s.loading?'disabled':''}>Làm mới</button></div></div>${s.loading?'<p role="status">Đang tải số liệu máy chủ…</p>':''}${s.error?`<p role="alert" style="color:var(--red)">${esc(s.error)}</p>`:''}${d?`<div class="grid g2">${[['Hội thoại có tin nhắn trong kỳ',number(d.conversations)],['Tin nhắn đến',number(d.inboundMessages)],['Tin nhắn trả lời đã ghi nhận',number(d.outboundMessages)],['Hội thoại mới trong kỳ đã có phản hồi',number(d.respondedConversations)],['Phản hồi đầu tiên trung bình',duration(d.firstReplyAverageSeconds)],['Phản hồi đầu tiên P90',duration(d.firstReplyP90Seconds)],['Đạt SLA trong số hội thoại đã phản hồi',number(d.respondedConversations)?number(d.slaMet)+' / '+number(d.respondedConversations)+' ('+Math.round(number(d.slaMet)/number(d.respondedConversations)*100)+'%)':'Chưa có phản hồi'],['Mục tiêu SLA',number(d.slaMinutes)+' phút']].map(([label,value])=>`<div class="card"><div class="small muted">${label}</div><strong style="font-size:24px">${esc(String(value))}</strong></div>`).join('')}</div><p class="small muted">Nguồn: tin nhắn đã ghi nhận trên máy chủ của shop trong ${esc(String(d.days))} ngày. Thời gian phản hồi tính từ tin đầu tiên của khách đến trả lời đầu tiên của bot hoặc nhân viên, cho hội thoại bắt đầu trong kỳ. Chưa có dữ liệu CSAT hoặc phân tích cảm xúc từ async function liveMetricsLoad(){if(!SHOP.ready||!shopCan('reports.view'))return;const shop=SHOP.id,generation=viewGeneration,run=++LIVEMET.run;LIVEMET.shop=shop;LIVEMET.loading=true;LIVEMET.error='';liveMetricsDraw();try{const data=await cloudRequest('/api/replies/metrics?days='+LIVEMET.days);if(!liveScope(shop,generation,'response')||run!==LIVEMET.run)return;if(!data||!Number.isFinite(data.conversations))throw Error('Số liệu phản hồi không hợp lệ.');LIVEMET.data=data;}catch(e){if(liveScope(shop,generation,'response')&&run===LIVEMET.run){LIVEMET.data=null;LIVEMET.error=e.message||'Chưa tải được số liệu.';}}finally{if(LIVEMET.shop===shop&&run===LIVEMET.run){LIVEMET.loading=false;if(liveScope(shop,generation,'response'))liveMetricsDraw();}}}

async function socialRequest(path,options={}){
 const headers={...shopHeaders(),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})};
 const target=path==='providers'?'/channels/all/providers':path.startsWith('meta/')?'/channels/'+path:path==='accounts'&&options.method==='POST'?'/channels/telegram/connect':'/channels/all/'+path;
 const r=await fetch(target,{credentials:'same-origin',...options,headers});
 const data=await r.json().catch(()=>({}));
 if(!r.ok){const e=Error(data.error||data.job?.errorCode||data.code||'Không thể thực hiện thao tác');e.job=data.job;e.status=r.status;throw e;}
 return data;
}

function jobHistoryHtml(jobs){return jobs.map(j=>`<div class="ch"><div style="flex:1"><b>${esc(j.provider||j.kind)}</b><div class="small muted">${esc(j.status)} · ${esc(j.id)} · ${j.attempts} lần${j.errorCode?' · '+esc(j.errorCode):''}</div></div>${j.status==='retryable'?`<button class="btn sm" onclick="socialRetryTelegram('${escAttr(j.id)}')">Thử lại</button>`:''}</div>`).join('')||'<p>Chưa có bài đăng.</p>';}
function applyPublishJobs(jobs,shop){
 if(SHOP.id!==shop)return;
 const history=$('#live_job_history');if(history)history.innerHTML=jobHistoryHtml(jobs);
 const byId=new Map(jobs.map(j=>[j.id,j]));let changed=false;
 for(const post of S.posts){
  if(post.jobs?.length){
   let updated=false;post.jobs=post.jobs.map(j=>{const fresh=byId.get(j.id);if(!fresh)return j;updated=true;return {...j,...fresh};});
   if(updated){post.status=socialPostStatus(post.jobs);post.url=post.jobs.find(j=>j.url)?.url||post.url;post.error=post.jobs.filter(j=>j.errorCode).map(j=>j.errorCode).join('; ')||null;changed=true;}continue;
  }
  const j=byId.get(post.schedId);if(!j)continue;
  const status=({sent:'published',pending:'scheduled',retryable:'scheduled',sending:'processing',unknown:'unknown',failed:'failed'})[j.status];
  if(status&&post.status!==status){post.status=status;post.error=j.errorCode||null;if(j.url)post.url=j.url;changed=true;}
 }
 if(changed){save();if(route==='posts'||route==='calendar')render();}
}
let JOB_WATCH=null;
function stopJobWatch(){if(JOB_WATCH)JOB_WATCH.abort();JOB_WATCH=null;}
async function startJobWatch(){
 stopJobWatch();if(!managedApp()||!SHOP.ready||!SHOP.id||document.hidden||window.QA_RUNNING)return;
 const controller=new AbortController(),shop=SHOP.id;JOB_WATCH=controller;let cursor='';
 while(!controller.signal.aborted&&SHOP.id===shop&&!document.hidden){
  try{
   const r=await cloudRequest('/channels/all/jobs/events?wait=20&cursor='+encodeURIComponent(cursor),{signal:controller.signal});
   if(controller.signal.aborted||SHOP.id!==shop)return;
   if(typeof r.cursor!=='string'||!Array.isArray(r.jobs))throw Error('Không nhận được trạng thái đăng bài.');
   cursor=r.cursor;if(r.changed)applyPublishJobs(r.jobs,shop);
  }catch(e){
   if(controller.signal.aborted||[401,403,404].includes(e.status))return;
   await new Promise(resolve=>{const done=()=>{clearTimeout(timer);controller.signal.removeEventListener('abort',done);resolve();};const timer=setTimeout(done,5000);controller.signal.addEventListener('abort',done,{once:true});});
  }
 }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopJobWatch();else startJobWatch();});
window.addEventListener('pagehide',stopJobWatch);

async function googleConnect(){
 try{const r=await googleRequest('start',{method:'POST',body:'{}'}),url=new URL(r.authorizationUrl);if(url.origin!=='https://accounts.google.com')throw Error('Đường dẫn Google không hợp lệ');window.location.assign(url.toString());}catch(e){toast(e.message);}
}
async function googleDisconnect(id){
 if(!confirm('Ngắt kết nối YouTube và xóa thông tin cấp quyền đã lưu trong shop? Video đã đăng trên YouTube vẫn được giữ.'))return;
 try{await googleRequest('accounts/'+encodeURIComponent(id),{method:'DELETE'});socialAccountsLive();}catch(e){toast(e.message);}
}
async function googleUpload(){
 const file=$('#yt_file')?.files[0],title=$('#yt_title')?.value.trim(),accountId=$('#yt_account')?.value,kids=$('#yt_kids')?.value;
 if(!file||!title||!accountId||!['true','false'].includes(kids))return toast('Chọn kênh, video, tiêu đề và đối tượng người xem.');
 if(file.size>50*1024*1024||!['video/mp4','video/webm','video/quicktime'].includes(file.type))return toast('Chọn video MP4, WebM hoặc MOV tối đa 50 MB.');
 const privacy=$('#yt_privacy').value,description=$('#yt_description').value;
 if(!confirm('Tải video "'+title+'" lên kênh YouTube đã chọn với chế độ '+$('#yt_privacy').selectedOptions[0].text+'?'))return;
 const button=$('#yt_upload'),status=$('#yt_status');button.disabled=true;status.textContent='Đang gửi video tới YouTube…';
 const attempt=window.googleUploadAttempt;
 const key=attempt&&attempt.shop===SHOP.id&&attempt.accountId===accountId?attempt.key:crypto.randomUUID();
 window.googleUploadAttempt={shop:SHOP.id,accountId,key};
 const query=new URLSearchParams({accountId,title,description,privacy,madeForKids:kids});
 try{const r=await googleRequest('upload?'+query,{method:'POST',headers:{'Content-Type':file.type,'Idempotency-Key':key},body:file});window.googleUploadAttempt=null;status.textContent='YouTube đã xác nhận video '+r.videoId;toast(status.textContent);socialAccountsLive();}
 catch(e){if(e.deliveryStatus==='failed')window.googleUploadAttempt=null;status.textContent='Chưa xác nhận tải thành công. Kiểm tra lịch sử và YouTube Studio trước khi gửi lại. '+e.message;button.disabled=false;}
}

async function socialConnectMeta(messenger=false){
 try{const result=await socialRequest('meta/start'+(messenger?'?purpose=messenger':''),{method:'POST',body:'{}'});const uri=new URL(result.authorizationUrl);if(uri.protocol!=='https:'||uri.hostname!=='www.facebook.com')throw Error('Đường dẫn xác thực không hợp lệ');window.location.assign(uri.toString());}
 catch(e){toast('Không thể kết nối Meta: '+e.message);}
}
async function socialSyncInstagram(){
 try{const r=await socialRequest('meta/sync',{method:'POST',body:'{}'});
  let m;
  if(r.connected>0)m='Đã thêm '+r.connected+' tài khoản Instagram từ Trang Facebook.';
  else if(r.missingPermission>0)m='Trang đã liên kết Instagram nhưng ShopPost chưa được cấp quyền Instagram. Bấm Kết nối Facebook / Instagram và bật quyền Instagram.';
  else if(r.alreadyConnected>0)m='Instagram của Trang đã được kết nối.';
  else if(r.errors>0)m='Chưa kiểm tra được Instagram. Thử lại sau ít phút hoặc kết nối lại Facebook.';
  else if(!r.pages)m='Chưa có Trang Facebook nào được kết nối. Bấm Kết nối Facebook / Instagram trước.';
  else m='Trang Facebook chưa liên kết tài khoản Instagram chuyên nghiệp. Liên kết trong phần cài đặt Trang trên Facebook rồi bấm kiểm tra lại.';
  toast(m);if(r.connected>0)socialAccountsLive();}
 catch(e){toast('Không thể kiểm tra Instagram: '+e.message);}
}
async function socialConnectTelegram(){
 const token=$('#tg_token').value.trim(),chatId=$('#tg_chat').value.trim();
 try{await socialRequest('accounts',{method:'POST',body:JSON.stringify({token,chatId})});toast('Đã xác minh và kết nối Telegram');socialAccountsLive();}
 catch(e){toast('Không kết nối được: '+e.message);}
}
async function socialDisconnectTelegram(id){
 if(!confirm('Ngắt kết nối và xóa token đã lưu?'))return;
 try{await socialRequest('accounts/'+encodeURIComponent(id),{method:'DELETE'});toast('Đã ngắt kết nối');socialAccountsLive();}catch(e){toast(e.message);}
}
async function socialPublishTelegram(){
 const accountId=$('#tg_account')?.value,text=$('#tg_text')?.value||'',photoUrl=$('#tg_photo')?.value.trim()||'';
 const selected=$('#tg_account')?.selectedOptions?.[0]?.dataset?.provider||'';
 if(!accountId||(!text.trim()&&!photoUrl))return toast('Chọn kênh và nhập nội dung');
 if(['instagram','zalo'].includes(selected)&&!photoUrl)return toast('Kênh này yêu cầu URL ảnh HTTPS');
 if(!confirm('Xác nhận đăng bài thật lên nền tảng đã chọn?'))return;
 const button=document.querySelector('#view button[onclick="socialPublishTelegram()"]');if(button)button.disabled=true;
 // Keep the same key for a retry within this page; accidental clicks will not duplicate.
 const key=window.socialPendingKey||(window.socialPendingKey=crypto.randomUUID());
 try {const result=await socialRequest('jobs',{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify({accountId,kind:photoUrl?'photo':'text',text,photoUrl,...(selected==='zalo'?{images:[photoUrl]}:{})})});window.socialPendingKey=null;toast('Nền tảng đã xác nhận bài đăng '+result.job.remoteMessageId);socialAccountsLive();}
 catch(e){toast('Chưa xác nhận đăng thành công: '+e.message+' — kiểm tra lịch sử trước khi thử lại');if(button)button.disabled=false;}
}
async function socialRetryTelegram(id){try{await socialRequest('jobs/'+encodeURIComponent(id)+'/retry',{method:'POST'});toast('Đã gửi lại');socialAccountsLive();}catch(e){toast(e.message);socialAccountsLive();}}

function connectionState(status,target){
 if(status==='revoked')return 'revoked';
 if(['reauth_required','error','expired'].includes(status))return 'reauth_required';
 if(['active','connected'].includes(status))return target?'connected':'reauth_required';
 return 'unknown';
}
function connectionBadge(status){const text={connected:'Đã kết nối thật',reauth_required:'Cần cấp quyền lại',revoked:'Đã ngắt kết nối',unknown:'Chưa xác nhận'};return '<span class="chip '+(status==='connected'?'ok':'warn')+'">'+esc(text[status]||text.unknown)+'</span>';}
function updateConnectionInventory(social,zalo,google,shop){
 if(SHOP.id!==shop)return;
 const accounts=[];
 for(const a of social?.accounts||[]){if(!['facebook','instagram','telegram'].includes(a.provider))continue;accounts.push({...a,state:connectionState(a.status,a.targetId)});}
 for(const a of zalo?.channels||[]){if(a.provider!=='zalo')continue;const id=(social?.accounts||[]).find(c=>c.provider==='zalo'&&String(c.targetId)===String(a.external_id||a.oa_id))?.id;accounts.push({id,provider:'zalo',name:a.name||'Zalo OA',targetId:a.external_id||a.oa_id,state:connectionState(a.needsReconnect?'reauth_required':a.status,a.external_id||a.oa_id)});}
 for(const a of google?.accounts||[])accounts.push({...a,provider:'youtube',state:connectionState(a.status,a.targetId)});
 CONNECTIONS={shop,accounts,complete:Boolean(Array.isArray(social?.accounts)&&Array.isArray(zalo?.channels)&&Array.isArray(google?.accounts)),checkedAt:Date.now()};
 REALCH=accounts.filter(a=>a.state==='connected'&&a.id&&a.provider!=='youtube').map(a=>({...a,status:'connected',external_id:a.targetId}));syncRealChannels();
 renderShopBox();
}

function channelAction(action,provider,id,shop){
 if(SHOP.id!==shop)return toast('Shop đã thay đổi. Hãy làm mới danh sách kênh.');
 if(!shopCan('channels.configure_token'))return toast('Bạn chưa có quyền quản lý kênh.');
 closeActionMenus();
 if(action==='connect')return connectAdditionalAccount(provider,shop);
 if(action==='disconnect')return provider==='youtube'?googleDisconnect(id):provider==='zalo'?zaloDisconnect():socialDisconnectTelegram(id);
}
function channelManage(a){
 if(!shopCan('channels.configure_token'))return '';
 return `<details class="action-menu" ontoggle="if(this.open)closeActionMenus(this)"><summary class="btn sm">Quản lý</summary><div class="account-popover"><button type="button" onclick="channelAction('connect','${escAttr(a.provider)}','${escAttr(a.id||'')}','${escAttr(SHOP.id)}')">${a.provider==='telegram'?'Cập nhật bot':'Cấp lại quyền'}</button>${a.state!=='revoked'?`<button type="button" class="account-signout" onclick="channelAction('disconnect','${escAttr(a.provider)}','${escAttr(a.id||'')}','${escAttr(SHOP.id)}')">Ngắt kết nối</button>`:''}</div></details>`;
}
function channelTabKey(event,tab){if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?'connected':event.key==='End'?'available':tab==='connected'?'available':'connected';setChannelTab(next);document.getElementById('tab_'+next)?.focus();}
function setChannelTab(tab){if(!['connected','available'].includes(tab))return;CHANNEL_TAB=tab;const root=$('#connection_summary');if(root){root.outerHTML=connectionSummary();document.getElementById('tab_'+tab)?.focus();}}
function connectionSummary(){
 if(CONNECTIONS?.shop!==SHOP.id)return '<div class="card" role="status">Đang tải trạng thái kết nối…</div>';
 const {accounts,complete,checkedAt}=CONNECTIONS,platforms=['facebook','instagram','zalo','telegram','youtube'],rows=accounts.filter(a=>a.state!=='revoked');
 return `<section class="card channel-workspace" id="connection_summary"><div class="channel-heading"><div><h2>Kênh đăng bài</h2><p class="muted">Quản lý các kênh của shop ${esc(SHOP.name)}.</p></div><div class="row"><button class="btn sm" onclick="channelsLoad()">Làm mới</button><button id="add_account_btn" class="btn pri" onclick="openAddAccount()" ${shopCan('channels.configure_token')?'':'disabled title="Chỉ chủ shop hoặc quản lý được kết nối kênh"'}>Kết nối kênh</button></div></div><p class="small muted" role="status">${liveConnectionCount()} tài khoản đã kết nối thật · ${complete?'Cập nhật lúc '+new Date(checkedAt).toLocaleTimeString('vi-VN'):'Chưa xác nhận đủ trạng thái. Bấm Làm mới để kiểm tra lại.'}</p><div class="channel-tabs" role="tablist" aria-label="Danh sách kênh"><button role="tab" onkeydown="channelTabKey(event,'connected')" id="tab_connected" tabindex="${CHANNEL_TAB==='connected'?0:-1}" aria-selected="${CHANNEL_TAB==='connected'}" aria-controls="channel_panel" onclick="setChannelTab('connected')">Đã kết nối (${liveConnectionCount()})</button><button role="tab" onkeydown="channelTabKey(event,'available')" id="tab_available" tabindex="${CHANNEL_TAB==='available'?0:-1}" aria-selected="${CHANNEL_TAB==='available'}" aria-controls="channel_panel" onclick="setChannelTab('available')">Nền tảng khả dụng</button></div><div id="channel_panel" role="tabpanel" aria-labelledby="tab_${CHANNEL_TAB}">${CHANNEL_TAB==='connected'?(rows.length?rows.map(a=>`<div class="channel-row ${a.state==='connected'?'is-connected':''}">${channelBrandIcon(a.provider)}<div class="channel-copy"><b>${esc(PF[a.provider]?.n||a.provider)}</b><span>${esc(a.name)}</span><small>${esc(a.targetId||'Chưa xác minh tài khoản')}</small></div>${connectionBadge(a.state)}${channelManage(a)}</div>`).join(''):'<div class="channel-empty"><h3>Chưa có kênh nào</h3><p>Kết nối Facebook, YouTube hoặc nền tảng khác để bắt đầu đăng bài.</p></div>'):platforms.map(provider=>{const linked=accounts.filter(a=>a.provider===provider&&a.state==='connected').length;const replace=provider==='zalo'&&rows.some(a=>a.provider==='zalo');const label=replace?'Đổi Zalo OA':linked?'Kết nối thêm':'Kết nối';return `<div class="channel-row">${channelBrandIcon(provider)}<div class="channel-copy"><b>${esc(PF[provider]?.n||provider)}</b><span>${linked?linked+' kênh đã kết nối':'Chưa kết nối'}${accounts.some(a=>a.provider===provider&&a.state==='revoked')?' · Đã ngắt kết nối':''}</span>${replace?`<small>${ZALO_REPLACEMENT_NOTICE}</small>`:''}</div><button class="btn" aria-label="${replace?label:label+' '+escAttr(PF[provider]?.n||provider)}" ${shopCan('channels.configure_token')?'':'disabled'} onclick="connectAdditionalAccount('${provider}','${escAttr(SHOP.id)}')">${label}</button></div>`;}).join('')}</div></section>`;
}
async function channelsLoad(){
 if(!managedApp()||!APP_SCOPE||!SHOP.ready)return;
 const shop=SHOP.id,connectionSequence=++CONNECTION_SEQUENCE;
 const results=await Promise.allSettled([cloudRequest('/channels'),socialRequest('accounts'),googleRequest('accounts')]);
 if(SHOP.id!==shop||connectionSequence!==CONNECTION_SEQUENCE)return;
 const [zalo,social,google]=results.map(r=>r.status==='fulfilled'?r.value:null);
 updateConnectionInventory(social,zalo,google,shop);
 if(route==='accounts'||route==='create')render();
}
function syncRealChannels(){
 S.channels=S.channels.filter(c=>!(c&&c.real));
 for(const rc of REALCH){if(!PF[rc.provider])continue;S.channels.push({id:rc.provider==='zalo'?'real_zalo':'real_'+rc.provider+'_'+rc.id,accountId:rc.id,pf:rc.provider,name:rc.name||PF[rc.provider].n,handle:rc.external_id||rc.oa_id||'',connected:true,real:true,provider:rc.provider,status:rc.status});}
}

async function zaloScheduleDraft(content,images,runAt){D.scheduleKey=D.scheduleKey||crypto.randomUUID();saveDraft();return cloudRequest('/channels/zalo/schedule',{method:'POST',headers:{'Idempotency-Key':D.scheduleKey||(D.scheduleKey=crypto.randomUUID())},body:JSON.stringify({content,title:'',images:images||[],runAt})})}
// Ảnh gửi tới backend: lấy bản thu nhỏ (data URL JPEG < 1MB) của media ảnh trong bản nháp/bài, tối đa 4 ảnh.
function realImages(media){return (media||[]).filter(m=>m&&(m.type||'').startsWith('image')&&m.thumb).map(m=>m.thumb).slice(0,4)}
let composerPublishing=false;
function socialPostStatus(items){
 if(items.every(j=>j.status==='sent'))return 'published';
 if(items.some(j=>j.status==='unknown'))return 'unknown';
 if(items.some(j=>j.status==='failed'))return 'failed';
 if(items.some(j=>j.status==='sending'))return 'processing';
 return 'scheduled';
}
function composerPayload(channel,draft,runAt){
 const text=((draft.custom[channel.id]||{}).text||draft.content||'').trim();
 if(draft.custom[channel.id]?.first)throw Error('Bình luận đầu tiên chưa được hỗ trợ khi đăng thật. Hãy bỏ phần này trước khi đăng.');
 if(draft.media.some(m=>!m.type?.startsWith('image/')))throw Error('Màn hình này hỗ trợ bài văn bản và ảnh. Video YouTube được tải tại mục Kênh.');
 const images=draft.media.map(m=>m.thumb||(/^https:\/\//.test(m.url||'')?m.url:null));
 if(images.some(i=>!i))throw Error('Ảnh chưa xử lý xong hoặc không đọc được. Hãy đợi hoặc chọn lại ảnh.');
 if(images.length>6)throw Error('Mỗi bài hỗ trợ tối đa 6 ảnh.');
 if(channel.provider==='zalo'&&(!text||!images.length))throw Error('Zalo OA cần nội dung và ảnh bìa.');
 if(!text&&!images.length)throw Error('Nhập nội dung hoặc thêm ảnh.');
 const payload={accountId:channel.accountId,kind:images.length?'photo':'text',text,...(runAt?{runAt}:{} )};
 if(!payload.accountId)throw Error('Kênh chưa tải xong. Hãy tải lại danh sách kênh.');
 if(['facebook','zalo'].includes(channel.provider)){if(images.length)payload.images=images;}
 else if(images.length){
  if(images.length!==1||!/^https:\/\//.test(images[0]))throw Error(PF[channel.provider].n+' hiện cần một đường dẫn ảnh HTTPS công khai.');
  payload.photoUrl=images[0];
 }
 if(channel.provider==='instagram'&&!images.length)throw Error('Instagram cần ảnh.');
 return payload;
}
async function submitSocialDraft(chs){
 if(composerPublishing)return;
 const editor=D,shop=SHOP.id,channels=chs.map(chById);
 if(!SHOP.ready||!shop||channels.some(c=>!c?.connected||!c.real))return toast('Hãy chọn kênh đã kết nối của shop hiện tại.');
 let runAt=0,payloads;
 try{
  if(D.when==='later'){
   runAt=Math.floor(new Date(D.date+'T'+D.time).getTime()/1000);
   if(!D.date||!D.time||!(runAt>Date.now()/1000))throw Error('Chọn ngày và giờ đăng trong tương lai.');
  }
  payloads=channels.map(c=>composerPayload(c,editor,runAt));
 }catch(e){return toast(e.message);}
 const signature=JSON.stringify({shop,payloads});
 if(!confirm((runAt?'Lên lịch đăng':'Đăng bài thật')+' lên '+channels.map(c=>c.name+' ('+PF[c.pf].n+')').join(', ')+' với '+editor.media.length+' ảnh?'))return;
 if(SHOP.id!==shop||D!==editor)return;
 if(editor.socialAttempt?.signature!==signature)editor.socialAttempt={signature,keys:payloads.map(()=>crypto.randomUUID())};
 saveDraft();composerPublishing=true;const button=$('#sub');if(button){button.disabled=true;button.textContent='Đang gửi…';}
 const items=[],snapshot=JSON.stringify(editor),submitted=JSON.parse(snapshot),attemptKeys=[...editor.socialAttempt.keys];
 try{
  for(let i=0;i<payloads.length;i++){
   if(SHOP.id!==shop)break;
   try{
    const r=await socialRequest('jobs',{method:'POST',headers:{'Idempotency-Key':attemptKeys[i],...(runAt?{'X-Channel-Schedule':'1'}:{})},body:JSON.stringify(payloads[i])});
    items.push({...r.job,channelId:channels[i].id,url:r.url||r.job?.url,status:r.job?.status||(r.ok?'sent':'unknown')});
   }catch(e){items.push({...e.job,channelId:channels[i].id,status:e.job?.status||'unknown',errorCode:e.message});}
  }
  if(SHOP.id!==shop)return;
  const ids=items.map(j=>j.id).filter(Boolean),prior=S.posts.find(p=>p.socialAttemptId===attemptKeys.join(':'));
  const media=submitted.media.map(({name,type,size,thumb,assetId})=>({name,type,size,thumb,assetId}));
  const post=prior||{id:uid(),type:'post',content:submitted.content,media,channels:[...chs],custom:submitted.custom,metrics:{},time:runAt?runAt*1000:Date.now(),createdBy:'Bạn',socialAttemptId:attemptKeys.join(':')};
  Object.assign(post,{jobs:items,schedId:ids[0],status:socialPostStatus(items),url:items.find(j=>j.url)?.url,error:items.filter(j=>j.errorCode).map(j=>j.errorCode).join('; ')||null});
  if(!prior)S.posts.unshift(post);save();
  const accepted=items.length===channels.length&&items.every(j=>j.id&&['sent','pending','retryable','sending'].includes(j.status));
  if(accepted&&D===editor&&JSON.stringify(D)===snapshot){post.assets=syncDraftToKho();save();const more=D.more;D=newDraft();D.more=more;saveDraft();more?V.create():go('posts');}
  toast(post.status==='published'?'Nền tảng đã xác nhận bài đăng.':accepted?'Đã lưu vào hàng đợi đăng bài.':'Chưa hoàn tất đăng bài. Bản nháp được giữ; kiểm tra lịch sử trước khi gửi lại.');
 }finally{composerPublishing=false;const current=$('#sub');if(current){current.textContent=D.when==='later'?'Lên lịch':'Đăng bài';upd();}}
}

async function testAI(){
 if(window.QA_RUNNING)return toast('Không gọi AI thật khi chạy QA demo');
 const button=$('#st_ai_test'),status=$('#st_ai_status'),preview=$('#st_ai_preview');
 if(!button||button.disabled)return;
 const endpoint=managedAIEndpoint()||$('#st_ai')?.value.trim();
 preview.hidden=true;preview.textContent='';
 if(!endpoint){status.textContent='Nhập URL endpoint AI để kiểm tra.';return;}
 button.disabled=true;status.textContent='Đang kiểm tra kết nối AI…';
 try{
  const target=new URL(endpoint,location.href);
  if(target.origin!==location.origin)throw new Error('Endpoint AI phải cùng tên miền với ShopPost.');
  const response=await fetch(target.href,{method:'POST',credentials:'same-origin',redirect:'error',signal:AbortSignal.timeout(45000),headers:{'Content-Type':'application/json',...shopHeaders()},body:JSON.stringify({task:'reply',text:'Xin chào, tôi muốn được tư vấn về dịch vụ.',name:'Khách hàng'})});
  if(response.status===401||response.status===403)throw new Error('Phiên đăng nhập đã hết hạn hoặc bạn chưa có quyền dùng AI.');
  if(response.status===429)throw new Error('Đã đạt giới hạn gọi AI. Hãy thử lại sau.');
  if(!response.ok)throw new Error('Dịch vụ AI chưa phản hồi thành công. Hãy thử lại sau.');
  const result=await response.json();
  if(typeof result?.text!=='string'||!result.text.trim())throw new Error('Dịch vụ AI chưa trả về nội dung.');
  status.textContent='Kết nối AI thành công. Phản hồi thử:';
  preview.textContent=result.text.trim();preview.hidden=false;
 }catch(error){status.textContent=error instanceof TypeError||error.name==='TimeoutError'||error.name==='SyntaxError'?'Chưa nhận được phản hồi AI hợp lệ. Hãy thử lại sau.':error.message;}
 finally{button.disabled=false;}
}

// Loại bỏ mọi bản ghi có id không hợp lệ khi nhập tệp, tránh chèn mã qua id (xem escAttr).
function sanitizeImport(s){
  const validId=x=>typeof x==='string'&&VALID_ID.test(x);
  for(const key of ['channels','posts','convos','scripts','hashtags','groups','assets','folders']){
    if(Array.isArray(s[key]))s[key]=s[key].filter(it=>it&&typeof it==='object'&&!Array.isArray(it)&&validId(it.id));
  }
  (s.posts||[]).forEach(p=>{if(Array.isArray(p.channels))p.channels=p.channels.filter(validId);if(Array.isArray(p.assets))p.assets=p.assets.filter(validId);});
  (s.groups||[]).forEach(g=>{if(Array.isArray(g.channels))g.channels=g.channels.filter(validId);});
  return s;
}

function lbFilter(sm){const now=new Date();const sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();let a0=-Infinity,a1=Infinity;
if(LB.date==='today')a0=sod;else if(LB.date==='7')a0=sod-6*DAY;else if(LB.date==='30')a0=sod-29*DAY;else if(LB.date==='month')a0=new Date(now.getFullYear(),now.getMonth(),1).getTime();else if(LB.date==='custom'){if(LB.from)a0=new Date(LB.from+'T00:00').getTime();if(LB.to)a1=new Date(LB.to+'T23:59:59').getTime()}
const q=norm(LB.q);const l=S.assets.filter(a=>(LB.folder==='all'||(LB.folder==='none'?!S.folders.some(f=>f.id===a.folder):a.folder===LB.folder))&&(LB.type==='all'||a.kind===LB.type)&&(LB.status==='all'||(sm[a.id]||'unused')===LB.status)&&(LB.source==='all'||a.source===LB.source)&&(LB.tag==='all'||a.tags.includes(LB.tag))&&a.created>=a0&&a.created<=a1&&(!q||norm(a.name+' '+(a.text||'')+' '+a.tags.join(' ')).includes(q)));
const so={new:(x,y)=>y.created-x.created,old:(x,y)=>x.created-y.created,name:(x,y)=>x.name.localeCompare(y.name,'vi'),size:(x,y)=>(y.size||0)-(x.size||0)}[LB.sort];return l.sort(so)}
function groupKey(a,sm){const d=new Date(a.created);switch(LB.group){case 'day':{const t=new Date();const sod=new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();const ds=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();return [ds,ds===sod?'Hôm nay':ds===sod-DAY?'Hôm qua':d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})]}
case 'month':return [d.getFullYear()*12+d.getMonth(),`Tháng ${d.getMonth()+1}/${d.getFullYear()}`];case 'type':return [a.kind,KICON[a.kind]+' '+KIND[a.kind]];case 'status':{const s=sm[a.id]||'unused';return [s,ASTAT[s]]}case 'folder':return [a.folder||'none','📁 '+folderName(a.folder)];case 'source':return [a.source,SRC[a.source]];default:return ['all','Tất cả']}}
function assetThumb(a,h){const src=a.thumb||(a.kind==='image'&&a.url)||'';if(src)return `<img src="${esc(src)}" style="width:100%;height:${h}px;object-fit:cover;display:block" loading="lazy">`;if(a.kind==='video'&&(BLOBS[a.id]||a.url))return `<video src="${esc(BLOBS[a.id]||a.url)}" style="width:100%;height:${h}px;object-fit:cover;display:block" muted></video>`;if(a.kind==='text')return `<div style="height:${h}px;padding:10px;font-size:12px;overflow:hidden;background:#fafafa;white-space:pre-wrap;color:#333">${esc((a.text||'').slice(0,220))}</div>`;return `<div style="height:${h}px;display:grid;place-items:center;font-size:42px;background:#f3f3f5">${KICON[a.kind]}</div>`}

function assetTable(items,sm){return `<div class="card" style="padding:0;overflow:auto"><table><tr><th></th><th>Tên</th><th>Loại</th><th>Thư mục</th><th>Ngày tạo</th><th>Trạng thái</th><th>Nguồn</th><th>Dung lượng</th></tr>${items.map(a=>{const s=sm[a.id]||'unused';return `<tr draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${escAttr(a.id)}')"><td><input type="checkbox" aria-label="Chọn tài nguyên ${esc(a.name)}" style="width:auto" ${LB.sel.has(a.id)?'checked':''} onchange="lbToggle('${escAttr(a.id)}',this.checked)"></td><td><a href="javascript:void(0)" onclick="lbOpen('${escAttr(a.id)}')">${KICON[a.kind]} ${esc(a.name)}</a>${a.tags.length?'<div>'+a.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')+'</div>':''}</td><td>${KIND[a.kind]}</td><td>${esc(folderName(a.folder))}</td><td>${fmtT(a.created)}</td><td><span class="tag ${ASTC[s]}">${ASTAT[s]}</span></td><td>${SRC[a.source]}</td><td>${fmtSize(a.size)}</td></tr>`}).join('')}</table></div>`}

async function showQuota(){const e=$('#lbquota');if(!e)return;let t='💾 Lưu trữ: '+STORE.mode;try{if(typeof navigator!=='undefined'&&navigator.storage&&navigator.storage.estimate){const q=await navigator.storage.estimate();t+=` · đã dùng ${fmtSize(q.usage||0)} / hạn mức ~${fmtSize(q.quota||0)}`}}catch(x){}e.textContent=t+(LS._mem&&!IDB.db?'':' · file gốc lưu trên trình duyệt này, chưa đồng bộ đám mây')}
function lbToggle(id,v){v?LB.sel.add(id):LB.sel.delete(id);V.library()}
function lbSelList(v){lbFilter(assetStatusMap()).forEach(a=>v?LB.sel.add(a.id):LB.sel.delete(a.id));V.library()}
function lbSelGroup(ids,v){ids.forEach(id=>v?LB.sel.add(id):LB.sel.delete(id));V.library()}
function lbQuick(v){if(!v)return;const sm=assetStatusMap();const l=lbFilter(sm);const [k,x]=v.split(':');const now=Date.now();
if(k==='none')LB.sel.clear();else if(k==='all')l.forEach(a=>LB.sel.add(a.id));else if(k==='invert')l.forEach(a=>LB.sel.has(a.id)?LB.sel.delete(a.id):LB.sel.add(a.id));
else{const f={kind:a=>a.kind===x,status:a=>(sm[a.id]||'unused')===x,folder:a=>a.folder===x,date:a=>x==='old'?a.created<now-30*DAY:x==='today'?new Date(a.created).toDateString()===new Date().toDateString():a.created>=now-(+x)*DAY}[k];const m=l.filter(f);m.forEach(a=>LB.sel.add(a.id));toast(`Đã chọn thêm ${m.length} tài nguyên`)}V.library()}
function lbReset(){Object.assign(LB,{limit:120,q:'',type:'all',status:'all',source:'all',date:'all',from:'',to:'',tag:'all'});V.library()}

function lbRenameFolder(){const f=S.folders.find(x=>x.id===LB.folder);if(!f)return;askText('Đổi tên thư mục',f.name,n=>{if(n&&n.trim()){f.name=n.trim();save();V.library()}})}
function lbDelFolder(){const f=S.folders.find(x=>x.id===LB.folder);if(!f)return;ask(`Xóa thư mục "${f.name}"? Tài nguyên bên trong sẽ chuyển sang "Chưa phân loại".`,()=>{S.folders=S.folders.filter(x=>x.id!==f.id);S.assets.forEach(a=>{if(a.folder===f.id)a.folder=null});LB.folder='all';save();V.library()},{ok:'Xóa thư mục',danger:true})}
function moveAssets(ids,fid){ids.forEach(i=>{const a=aById(i);if(a)a.folder=fid==='none'?null:fid});save();V.library();toast(`Đã chuyển ${ids.length} tài nguyên tới "${fid==='none'?'Chưa phân loại':folderName(fid)}"`)}
function lbDrop(e,fid){e.preventDefault();if(fid==='all')return;const id=e.dataTransfer.getData('text/plain');if(!aById(id))return;moveAssets(LB.sel.has(id)?[...LB.sel]:[id],fid)}
function lbMove(fid){moveAssets([...LB.sel],fid)}
function lbTag(){askText('Nhập nhãn (cách nhau dấu phẩy)','',v=>{const tg=splitTags(v);if(!tg.length)return;LB.sel.forEach(i=>{const a=aById(i);if(a)a.tags=[...new Set([...a.tags,...tg])]});save();V.library();toast('Đã gắn nhãn')})}
function lbDelete(ids){const used=ids.filter(id=>assetPosts(id).some(p=>p.status==='scheduled'));ask(`Xóa ${ids.length} tài nguyên khỏi Kho?`+(used.length?`\n⚠ ${used.length} tài nguyên đang gắn với bài sắp đăng (bài vẫn giữ nội dung đã soạn).`:''),()=>{
S.assets=S.assets.filter(a=>!ids.includes(a.id));ids.forEach(id=>{LB.sel.delete(id);delete BLOBS[id];IDB.del('files',id)});S.posts.forEach(p=>{if(p.assets)p.assets=p.assets.filter(x=>!ids.includes(x))});save();closeModal();V.library();toast(`Đã xóa ${ids.length} tài nguyên`)},{ok:'Xóa',danger:true})}
function lbDownload(ids){let n=0;ids.forEach(id=>{const a=aById(id);if(!a)return;let href=null,name=a.name;if(['drive','dropbox','onedrive','email'].includes(a.source)&&BLOBS[id])href=BLOBS[id];else if(a.kind==='text'){href=URL.createObjectURL(new Blob([a.text||''],{type:'text/plain;charset=utf-8'}));if(!/\.txt$/i.test(name))name+='.txt'}else if(BLOBS[id])href=BLOBS[id];else if(a.kind==='image'&&(a.thumb||a.url))href=a.thumb||a.url;else if(a.url)href=a.url;if(!href)return;const d=n*350;n++;setTimeout(()=>{const l=document.createElement('a');l.href=href;l.download=name;l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove()},d)});
const miss=ids.length-n;toast(`Đang tải ${n} file`+(miss?` · ${miss} mục không còn file gốc trong trình duyệt này`:''))}
function compressImage(file,max=800,q=.82){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};img.onerror=()=>res(null);img.src=url})}
function videoPoster(url){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.preload='auto';let t;const done=x=>{clearTimeout(t);res(x)};t=setTimeout(()=>done(null),6000);v.onloadeddata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){done(null)}};v.onseeked=()=>{try{const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.7))}catch(e){done(null)}};v.onerror=()=>done(null);v.src=url})}
function kindOf(f){const t=f.type||'',n=f.name.toLowerCase();if(t.startsWith('image/'))return 'image';if(t.startsWith('video/'))return 'video';if(t.startsWith('text/')||/\.(txt|md)$/.test(n))return 'text';return 'doc'}
function targetFolder(k){if(LB.folder!=='all'&&LB.folder!=='none'&&S.folders.some(f=>f.id===LB.folder))return LB.folder;const f=KIND_FOLDER[k];return S.folders.some(x=>x.id===f)?f:null}
async function makeAsset(f){const kind=kindOf(f);const a={id:uid(),kind,name:f.name,folder:targetFolder(kind),tags:[],source:'upload',created:Date.now(),size:f.size};
if(kind!=='text')putFile(a.id,f);if(kind==='image'){BLOBS[a.id]=URL.createObjectURL(f);a.thumb=await compressImage(f)}else if(kind==='video'){BLOBS[a.id]=URL.createObjectURL(f);a.thumb=await videoPoster(BLOBS[a.id])}else if(kind==='text'){a.text=(await f.text()).slice(0,20000);a.name=a.name.replace(/\.(txt|md)$/i,'')}else BLOBS[a.id]=URL.createObjectURL(f);return a}
async function lbUpload(files){const fl=[...files];if(!fl.length)return;toast(`Đang tải lên ${fl.length} file…`);const docs=fl.filter(f=>kindOf(f)==='doc').length;for(const f of fl)S.assets.unshift(await makeAsset(f));save();if(route==='library')V.library();toast(`Đã thêm ${fl.length} tài nguyên vào Kho`+(IDB.db?' · đã lưu file gốc trong trình duyệt':''))}
function folderSelect(id,cur,auto){return `<select id="${id}">${auto?'<option value="auto" selected>Tự phân loại theo loại file</option>':''}${S.folders.map(f=>`<option value="${f.id}" ${!auto&&f.id===cur?'selected':''}>${esc(f.name)}</option>`).join('')}<option value="" ${!auto&&!cur?'selected':''}>Chưa phân loại</option></select>`}

const topic=(o.topic||'').trim();const feats=String(s.features||'Lên đơn nhanh,Quản lý đơn hàng tập trung,Đối soát COD minh bạch,Hệ thống đại lý phân phối cước').split(',').map(x=>x.trim()).filter(Boolean);
const n=o.dur<=15?4:o.dur<=30?6:9;const fill=t=>t.replace(/{a}/g,a).replace(/{b}/g,b).replace(/{n}/g,o.dur).replace(/{dang_ky}/g,s.signup||'[link đăng ký]');
const out=[];out.push(topic?(/\?$/.test(topic)?topic:topic+' – bạn đã biết chưa?'):fill(pick(VHOOK)));
const pool=[...new Set([...feats,'Theo dõi trạng thái đơn hàng mọi lúc','Đối soát COD rõ ràng, dễ kiểm tra','Phân quyền cho nhân viên và đại lý','Kết nối nhiều hãng vận chuyển'])];const mid=n-2;const pains=VPAIN.slice(0);for(let i=0;i<mid;i++){if(i===0)out.push(pick(pains,1));else if(i===1)out.push('Với '+b+', mọi thứ gọn trong một nơi');else out.push('✅ '+pool[(i-2+seed)%pool.length])}
const ctas=VCTA.map(fill).filter(t=>!t.includes('['));out.push(ctas.length?ctas[(seed+2)%ctas.length]:'Nhắn tin cho '+b+' để được tư vấn');const per=Math.max(2,Math.round(o.dur/n*10)/10);
return out.slice(0,n).map((t,i)=>({id:uid(),text:t.slice(0,120),d:i===0?Math.max(2,per-0.5):i===n-1?per+0.5:per,asset:null,cta:i===n-1}))}
function vGen(){VP.topic=($('#v_topic')||{}).value||VP.topic;VP.dur=+(($('#v_dur')||{}).value||VP.dur);const go2=()=>{VP.scenes=vScript({topic:VP.topic,dur:VP.dur,seed:(VP._seed=(VP._seed||0)+1)});vSave();VS.t=0;V.video();toast('Đã viết kịch bản '+VP.scenes.length+' cảnh')};if(VP.scenes.length)ask('Thay kịch bản hiện tại bằng kịch bản mới?',go2,{ok:'Viết lại'});else go2()}
const VIDEO_CAPTION_BUSY=new WeakSet();
function videoCaptionTopic(project){return String(project.topic||'').trim()||project.scenes.slice(0,2).map(scene=>scene.text).join(' ').trim();}
async function vCaption(){
 const project=VP,shop=SHOP.id,original=project.caption,topic=videoCaptionTopic(project);
 if(route!=='video'||VIDEO_CAPTION_BUSY.has(project))return;
 if(!topic)return toast('Nhập chủ đề hoặc thêm nội dung cảnh trước.');
 const current=()=>route==='video'&&SHOP.id===shop&&VP===project;
 VIDEO_CAPTION_BUSY.add(project);
 const button=$('#v_capbtn');if(button){button.disabled=true;button.textContent='Đang viết…';}
 try{
  const text=await AI.call('generate',{topic,product:S.settings.brand,audience:S.settings.audience,tone:S.settings.tone,platform:'tiktok',length:'short',seed:project._seed||0});
  if(!current())return;
  if(project.caption!==original||videoCaptionTopic(project)!==topic)return toast('Chủ đề hoặc mô tả đã thay đổi. Hãy bấm viết lại khi cần.');
  project.caption=adaptText(text,'tiktok').slice(0,2200);
  vSave();
  const input=$('#v_cap');if(input)input.value=project.caption;
 }catch{if(current())toast('Chưa viết được mô tả. Hãy thử lại.');}
 finally{
  VIDEO_CAPTION_BUSY.delete(project);
  if(current()){
   const button=$('#v_capbtn');if(button){button.disabled=false;button.textContent='Viết mô tả bằng AI';}
  }
 }
}

function vMedia(id){const a=aById(id);const src=vSrc(a);if(!src)return Promise.resolve(null);const c=VS.media[id];if(c&&c.src===src)return c.ready;const o={src,kind:a.kind};
o.ready=new Promise(res=>{if(a.kind==='video'){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.loop=true;v.preload='auto';v.onloadeddata=()=>res(v);v.onerror=()=>res(null);v.src=src;o.el=v}else{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;o.el=im}setTimeout(()=>res(null),8000)}).then(el=>{o.ok=!!el;return el});VS.media[id]=o;return o.ready}

function vRR(x,X,Y,w,hh,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+hh,r);x.arcTo(X+w,Y+hh,X,Y+hh,r);x.arcTo(X,Y+hh,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}

function vScene(x,W,H,sc,lt,alpha,idx){const th=VTHEME[VP.theme]||VTHEME.dark;x.save();x.globalAlpha=alpha;const m=sc.asset&&VS.media[sc.asset];const el=m&&m.ok?m.el:null;
if(el){const iw=el.videoWidth||el.naturalWidth||el.width,ih=el.videoHeight||el.naturalHeight||el.height;const zoom=1+0.06*Math.min(1,lt/Math.max(sc.d,0.1));const kc=Math.max(W/iw,H/ih);if(VP.fit==='fit'&&Math.abs(iw/ih-W/H)>0.15){try{x.save();x.filter='blur(28px) brightness(.7)';x.drawImage(el,(W-iw*kc*1.1)/2,(H-ih*kc*1.1)/2,iw*kc*1.1,ih*kc*1.1);x.restore();x.globalAlpha=alpha;const kf=Math.min(W/iw,H/ih)*zoom*0.96;const fw=iw*kf,fh=ih*kf;const fy=VP.ratio==='9:16'?H*0.42-fh/2:(H-fh)/2;x.drawImage(el,(W-fw)/2,Math.max(0,fy),fw,fh)}catch(e){}}else{const k=kc*zoom;const dw=iw*k,dh=ih*k;try{x.drawImage(el,(W-dw)/2,(H-dh)/2,dw,dh)}catch(e){}}const g=x.createLinearGradient(0,H*0.35,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=g;x.fillRect(0,0,W,H)}
else{const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,th[0]);g.addColorStop(1,th[1]);x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=alpha*0.08;x.fillStyle=th[2];for(let i=0;i<5;i++){x.beginPath();x.arc(W*(0.15+0.2*i),H*(0.2+0.13*((i+idx)%5)),W*0.18,0,7);x.fill()}x.globalAlpha=alpha}
const fs=Math.round(Math.min(W,H)*(sc.cta?0.072:0.064));x.font=`800 ${fs}px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;x.textAlign='center';x.textBaseline='middle';
const lines=vWrap(x,sc.text,W*0.82).slice(0,6);const lh=fs*1.28;const bh=lines.length*lh+fs*0.9;const ap=Math.min(1,lt/0.45);const fitMid=el&&VP.fit==='fit'&&VP.pos==='center'&&VP.ratio==='9:16';const yc=(VP.pos==='bottom'||fitMid?H*(fitMid?0.8:0.74):VP.pos==='top'?H*0.28:H*0.5)+(1-ap)*fs*0.8;
x.globalAlpha=alpha*ap;const bw=Math.min(W*0.9,Math.max(...lines.map(l=>x.measureText(l).width))+fs*1.2);const light=VP.theme==='light'&&!el;x.fillStyle=light?'rgba(255,255,255,.85)':'rgba(0,0,0,.42)';vRR(x,(W-bw)/2,yc-bh/2,bw,bh,fs*0.4);x.fill();
x.fillStyle=light?th[2]:'#fff';lines.forEach((l,i)=>x.fillText(l,W/2,yc-bh/2+fs*0.45+lh*(i+0.5)));
if(sc.cta){x.font=`700 ${Math.round(fs*0.62)}px Inter,system-ui,sans-serif`;x.fillStyle=light?th[2]:'#fff';x.fillText('👉 '+(S.settings.brand||'ShopTrack'),W/2,yc+bh/2+fs*1.1)}
x.restore()}
function vDraw(x,t){const [W,H]=VRATIO[VP.ratio]||VRATIO['9:16'];x.clearRect(0,0,W,H);x.fillStyle='#000';x.fillRect(0,0,W,H);const sc=VP.scenes;if(!sc.length)return -1;let acc=0,i=0;for(;i<sc.length;i++){if(t<acc+(+sc[i].d)||i===sc.length-1)break;acc+=+sc[i].d}
const lt=t-acc;vScene(x,W,H,sc[i],lt,1,i);const rem=(+sc[i].d)-lt,TR=0.3;if(i<sc.length-1&&rem<TR)vScene(x,W,H,sc[i+1],0,1-rem/TR,i+1);
const th=VTHEME[VP.theme]||VTHEME.dark;const tot=vTotal();x.fillStyle='rgba(255,255,255,.25)';x.fillRect(0,0,W,6);x.fillStyle=th[0]==='#f8fafc'?'#009588':'#fff';x.fillRect(0,0,W*Math.min(1,t/tot),6);
if(VP.logo){const fs=Math.round(Math.min(W,H)*0.035);x.font=`800 ${fs}px Inter,system-ui,sans-serif`;x.textAlign='left';x.textBaseline='top';x.fillStyle='rgba(0,0,0,.35)';const tw=x.measureText(S.settings.brand||'ShopTrack').width;vRR(x,fs*0.8,fs*1.2,tw+fs*1.2,fs*1.7,fs*0.5);x.fill();x.fillStyle='#fff';x.fillText(S.settings.brand||'ShopTrack',fs*1.4,fs*1.55)}return i}

async function vExport(){if(VS.rec||VS.busy)return;const err=vCheck();if(err)return toast(err);const cv=$('#vcv');const mt=vMime();if(!cv||!cv.captureStream||!mt)return toast('Trình duyệt này không hỗ trợ xuất video (cần Chrome/Edge/Firefox bản mới)');

await done;if(!vExportCurrent(job))return;VS.rec=null;VS.busy=false;const type=mt.split(';')[0];const blob=new Blob(chunks,{type});if(!blob.size){return toast('Xuất video thất bại (file rỗng)')}
const c2=document.createElement('canvas');const [W,H]=VRATIO[VP.ratio];const k=480/Math.max(W,H);c2.width=Math.round(W*k);c2.height=Math.round(H*k);const x2=c2.getContext('2d');x2.scale(k,k);vDraw(x2,Math.min(1.2,vTotal()/2));let thumb=null;try{thumb=c2.toDataURL('image/jpeg',.75)}catch(e){}

const bak={S,D,VP,VSo:VS.out,LB:{...LB,sel:new Set(LB.sel)},IB:{...IB},AN:{...AN},RS:{...RS},F:JSON.parse(JSON.stringify(F)),conf:window.confirm,pr:window.prompt,toast:window.toast};
let js=0;const onErr=()=>{js++};addEventListener('error',onErr);window.QA_RUNNING=true;S=migrate3(seed());D=newDraft();QA.perf={};const res=[];const t0=performance.now();
for(const [g,n,fn] of QA_TESTS){window.confirm=()=>true;window.prompt=()=>'QA';const t=performance.now();try{await fn();res.push({g,n,ok:true,ms:performance.now()-t})}catch(e){if(e&&e.skip)res.push({g,n,ok:null,err:e.skip,ms:performance.now()-t});else res.push({g,n,ok:false,err:String(e&&e.message||e),ms:performance.now()-t})}}
QA.ms=Math.round(performance.now()-t0);removeEventListener('error',onErr);
S=bak.S;D=bak.D;VP=bak.VP;VS.out=bak.VSo;Object.assign(LB,bak.LB);Object.assign(IB,bak.IB);Object.assign(AN,bak.AN);Object.assign(RS,bak.RS);Object.assign(F.posts,bak.F.posts);Object.assign(F.calendar,bak.F.calendar);window.confirm=bak.conf;window.prompt=bak.pr;
await qWait(1000);window.QA_RUNNING=false;QA.js=js;QA.res=res;QA.at=new Date();QA.running=false;go('qa')}

${r?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px">${kp('Đạt',`<span id="qa_pass">${pass}</span>/${r.length}`,'')}${kp('Không đạt',`<span id="qa_fail">${fail}</span>`,'')}${kp('Bỏ qua (môi trường)',`<span id="qa_skip">${skip}</span>`,'')}${kp('Lỗi JS khi chạy',`<span id="qa_js">${QA.js}</span>`,'')}${kp('Thời gian chạy',QA.ms+' ms',`<span class="d muted">${QA.at.toLocaleTimeString('vi-VN')}</span>`)}</div>
<div class="card"><h3>⚡ Số đo hiệu năng</h3><div class="small" id="qa_perf">${Object.entries(QA.perf).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(typeof v==='number'?v+' ms':v)}</span>`).join(' ')}</div></div>

const UX_BUTTON_COPY={'✨ AI tạo nội dung':'Tạo nội dung bằng AI','🪄 Cải thiện bằng AI':'Cải thiện nội dung','🗂️ Chọn từ Kho':'Chọn từ thư viện','📝 Thêm nội dung văn bản':'Thêm văn bản','🔗 Thêm từ URL':'Thêm từ đường dẫn','⬇ Tải xuống':'Tải xuống','✨ Viết caption':'Viết mô tả bằng AI','✨ Viết caption bằng AI':'Viết mô tả bằng AI','▶ Xem trước':'Xem trước video','✏️ Đăng / lên lịch':'Dùng trong bài viết','🗂️ Xem trong Kho':'Mở thư viện','+ Mới':'Tạo thư mục','+ Tạo nhóm':'Tạo nhóm kênh','+ Kịch bản mới':'Soạn kịch bản','+ Tạo bài viết':'Soạn bài mới','Gửi góp ý':'Lưu góp ý','Gửi phản hồi':'Lưu phản hồi'};
let UX_FIELD_SEQUENCE=0;
function associateProductLabels(root){
 root.querySelectorAll('input:not([type=hidden]),select,textarea').forEach(field=>{
  if(field.id==='ct'&&!field.labels?.length){field.setAttribute('aria-label','Nội dung bài viết');return;}
  if(field.getAttribute('aria-label')||field.getAttribute('aria-labelledby')||field.labels?.length)return;
  let label=field.previousElementSibling;
  if(label?.tagName!=='LABEL')label=null;
  if(label){if(!field.id)field.id='ux_'+(root.id||route)+'_field_'+(++UX_FIELD_SEQUENCE);label.htmlFor=field.id;return;}
  const text=field.title||field.placeholder||(field.tagName==='SELECT'?field.options[0]?.text:field.type==='date'?'Ngày đăng':field.type==='time'?'Giờ đăng':field.type==='file'?'Chọn tệp tải lên':null);
  if(text)field.setAttribute('aria-label',text.replace(/^[^\p{L}\p{N}]+/u,'').trim());
 });
}
function decorateProductScreen(){
 if(typeof document==='undefined'||!document?.documentElement||window.QA_RUNNING)return;
 const view=document.getElementById('view');if(!view)return;
 const key=route,meta=SCREEN_META[key];view.dataset.screen=key;
 if(meta&&key!=='accounts'&&!view.querySelector(':scope > .screen-heading')){
  const heading=document.createElement('section');heading.className='screen-heading';
  const title=document.createElement('h2');title.id='screen_heading';title.textContent=meta[0];
  const description=document.createElement('p');description.textContent=meta[1];heading.append(title,description);
  if(meta[2]){const note=document.createElement('span');note.className='screen-scope';note.textContent=meta[2];heading.append(note);}
  view.prepend(heading);
 }
 view.querySelectorAll('button').forEach(button=>{
  const old=button.textContent.trim(),copy=UX_BUTTON_COPY[old];
  if(copy&&button.children.length===0)button.textContent=copy;
  if(!button.hasAttribute('type'))button.type='button';
  if(!button.getAttribute('aria-label')){
   const action=button.getAttribute('onclick')||'';
   const label=button.title||(old==='×'?(action.includes('D.media')?'Xóa tệp đính kèm':'Đóng'):old==='‹'?'Kỳ trước':old==='›'?'Kỳ sau':null);
   if(label)button.setAttribute('aria-label',label);
  }
 });
 associateProductLabels(view);
 view.querySelectorAll('.drop[onclick]').forEach(drop=>{
  if(drop.dataset.uxKeyboard)return;drop.dataset.uxKeyboard='true';drop.tabIndex=0;drop.setAttribute('role','button');
  drop.setAttribute('aria-label','Chọn tệp tải lên hoặc kéo thả tệp vào đây');
  drop.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target===drop){event.preventDefault();drop.click();}});
 });
 view.querySelectorAll('table').forEach(table=>{if(table.parentElement?.classList.contains('ux-table-scroll'))return;const wrap=document.createElement('div');wrap.className='ux-table-scroll';wrap.tabIndex=0;wrap.setAttribute('aria-label','Bảng dữ liệu, có thể cuộn ngang');table.before(wrap);wrap.append(table);});
 const toastBox=document.getElementById('toast');if(toastBox&&!toastBox.hasAttribute('role')){toastBox.setAttribute('role','status');toastBox.setAttribute('aria-live','polite');toastBox.setAttribute('aria-atomic','true');}
}
function startProductDesign(){
 const view=document.getElementById('view');if(!view)return;
 let queued=false;
 const observer=new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;decorateProductScreen();});});
 observer.observe(view,{childList:true,subtree:true});decorateProductScreen();
}

tring():'')+location.hash)}if(q.get('connected')==='zalo')toast('Đã kết nối Zalo OA thành công.');else if(q.get('connect_error')==='zalo'){const messages={session_expired:'Phiên cấp quyền đã hết hạn. Bấm kết nối Zalo OA để thử lại.',account_changed:'Tài khoản Shoppost đã thay đổi. Hãy kết nối lại OA.',oa_unavailable:'Zalo chưa cho phép đọc thông tin OA. Kiểm tra quyền quản trị OA và cấp lại quyền.'};toast(messages[q.get('connect_reason')]||'Chưa kết nối được OA. Kiểm tra tài khoản quản trị và thử lại.');}if(q.has('connected')||q.has('connect_error')){q.delete('connected');q.delete('connect_error');q.delete('connect_reason');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash)}}catch(e){}bootStorage().then(()=>{if(LS._mem&&!IDB.db){const b=document.createElement('div');b.id='storewarn';b.setAttribute('role','alert');b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff7e6;border-top:1px solid #f5c26b;padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between';b.innerHTML='<span>⚠️ Trình duyệt đang <b>chặn lưu trữ</b> trong khung nhúng này: dữ liệu và nháp sẽ <b>mất khi tải lại trang</b>. Để lưu lâu dài, tải file <code>shoppost.html</code> về máy rồi mở bằng Chrome (hoặc đưa lên hosting riêng).</span><button class="btn sm" onclick="this.parentNode.remove()">Đã hiểu</button>';document.body.appendChild(b)}});
