<!DOCTYPE html><html lang="vi"><head><script>document.documentElement.setAttribute('data-theme', 'light');</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopAI × ShopTrack – Đăng bài đa kênh, Chatbot & AI</title>
<style>
:root{--p:#030213;--fg:#0a0a0a;--mut:#ececf0;--mutf:#717182;--in:#f3f3f5;--bd:#0000001a;--sb:#fafafa;--red:#d4183d;--green:#16a34a;--r:10px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:#fff;font-size:14px}
a{color:#2563eb}
.app{display:flex;min-height:100vh}
aside{width:256px;background:var(--sb);border-right:1px solid #e5e5e5;padding:14px;position:fixed;top:0;bottom:0;overflow:auto}
main{margin-left:256px;flex:1;min-width:0}
header{height:56px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:#fff;z-index:5;gap:10px}
.content{padding:24px;max-width:1240px;margin:0 auto}
.logo{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.logo i{background:var(--p);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-style:normal}
.grp{font-size:11px;color:var(--mutf);font-weight:600;margin:16px 8px 6px;letter-spacing:.04em}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#333;text-decoration:none;margin:1px 0}
.nav a:hover{background:#f0f0f0}.nav a.on{background:#ececf0;font-weight:600}
.badge{font-size:10px;background:#f05100;color:#fff;border-radius:99px;padding:1px 6px;margin-left:auto}
.card{border:1px solid var(--bd);border-radius:var(--r);padding:18px;background:#fff;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;display:inline-flex;gap:6px;align-items:center;color:inherit}
.btn:hover{background:#f6f6f7}.btn.pri{background:var(--p);color:#fff;border-color:var(--p)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:4px 10px;font-size:12px}.btn.danger{color:var(--red)}
input,textarea,select{font:inherit;background:var(--in);border:1px solid transparent;border-radius:8px;padding:8px 10px;width:100%;color:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid #60a5fa}
textarea{resize:vertical;min-height:140px}
label{font-size:12px;color:var(--mutf);display:block;margin:8px 0 4px}
.muted{color:var(--mutf)}.small{font-size:12px}
.kpi .v{font-size:24px;font-weight:700;margin:4px 0}.kpi .l{color:var(--mutf);font-size:12px}.kpi .d{font-size:12px}
.up{color:var(--green)}.down{color:var(--red)}
.ch{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.pf{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--mut);margin:2px;text-decoration:none;color:inherit}
.st-published{background:#dcfce7;color:#166534}.st-scheduled{background:#dbeafe;color:#1e40af}.st-doing{background:#eef2ff;color:#4338ca}.st-failed{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:top}th{color:var(--mutf);font-weight:500;cursor:pointer;white-space:nowrap}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}.modal .box{background:#fff;border-radius:12px;max-width:780px;width:94%;max-height:90vh;overflow:auto;padding:20px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--p);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
.seg{display:inline-flex;background:var(--mut);border-radius:8px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit;color:inherit}.seg button.on{background:#fff;box-shadow:0 1px 2px #0002}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .d{min-height:96px;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:12px;min-width:0}.cal .d.today{border-color:var(--p);border-width:2px}
.cal .ev{display:block;font-size:11px;padding:2px 4px;border-radius:4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 160px);min-height:480px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.clist{border-right:1px solid var(--bd);overflow:auto}.citem{padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer}.citem.on{background:#f3f3f5}
.chat{display:flex;flex-direction:column;min-width:0}.msgs{flex:1;overflow:auto;padding:16px;background:#fafafa}
.m{max-width:75%;padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;width:fit-content}.m.customer{background:#fff;border:1px solid var(--bd)}.m.agent{background:var(--p);color:#fff;margin-left:auto}.m.bot{background:#e0f2f1;margin-left:auto}
.m .t{font-size:10px;opacity:.6;margin-top:2px}
.qr{display:inline-block;border:1px solid #009588;color:#009588;background:#fff;border-radius:99px;padding:2px 10px;font-size:12px;margin:4px 4px 0 0}
.preview{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.variant{border:1px dashed #c9cbd6;border-radius:8px;padding:12px;margin:10px 0}
.bar{height:8px;background:var(--mut);border-radius:99px;overflow:hidden;display:flex}.bar>i{display:block;height:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img,.thumbs video{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.drop{border:2px dashed #d4d4d8;border-radius:10px;padding:24px;text-align:center;color:var(--mutf);cursor:pointer}
.switch{position:relative;width:36px;height:20px;display:inline-block;flex:none}.switch input{display:none}.switch span{position:absolute;inset:0;background:#d4d4d8;border-radius:99px;cursor:pointer;transition:.2s}.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+span{background:var(--p)}.switch input:checked+span:before{transform:translateX(16px)}
.mnav{display:none;width:auto}
main,.content,#view{min-width:0}.card{max-width:100%}.grid>*,.two>*{min-width:0}
@media(max-width:900px){aside{display:none}main{margin-left:0}.g2,.g3{grid-template-columns:1fr}.two{grid-template-columns:1fr!important}.inbox{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:0}.clist{max-height:280px;border-right:0;border-bottom:1px solid var(--bd)}.chat{height:70vh;min-height:420px}.mnav{display:block}.content{padding:14px}}
</style></head><body>
<div class="app">
<aside><div class="logo"><i>S</i>ShopAI</div>
<select><option>Dự án: Mặc định</option></select><nav class="nav" id="nav"></nav></aside>
<main><header><div class="row"><select class="mnav" id="mnav" onchange="go(this.value)"></select><b id="title"></b></div><div class="row"><span class="small muted" id="clock"></span><button class="btn sm" id="fbquick" title="Gửi góp ý / báo lỗi cho trang đang xem" aria-label="Góp ý nhanh" onclick="fbQuick()">💬 Góp ý</button><span class="pf" style="background:#030213">U</span></div></header>
<div class="content" id="view"></div></main></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div><div class="toast" id="toast"></div>
<script>
/* ================= CORE ================= */
const PF={facebook:{n:'Facebook',c:'#1877f2',a:'f'},tiktok:{n:'TikTok',c:'#111111',a:'T'},youtube:{n:'YouTube',c:'#ff0000',a:'▶'},instagram:{n:'Instagram',c:'#e1306c',a:'IG'},zalo:{n:'Zalo OA',c:'#0068ff',a:'Z'},telegram:{n:'Telegram',c:'#27a7e7',a:'TG'},x:{n:'X',c:'#000000',a:'X'},linkedin:{n:'LinkedIn',c:'#0a66c2',a:'in'},threads:{n:'Threads',c:'#333333',a:'@'}};
const MENU=[['TẠO MỚI',[['create','✏️','Bài viết'],['video','🎬','Video ngắn'],['ai','✨','AI tạo nội dung']]],['KHO',[['library','🗂️','Kho tài nguyên']]],['BÀI ĐĂNG',[['posts','📄','Danh sách'],['calendar','📅','Lịch đăng'],['analytics','📊','Phân tích']]],['TƯƠNG TÁC',[['inbox','💬','Hộp thư hợp nhất'],['response','⏱️','Chỉ số phản hồi'],['bot','🤖','Chatbot kịch bản']]],['CẤU HÌNH',[['accounts','🔗','Kênh'],['groups','👥','Nhóm kênh'],['hashtags','#️⃣','Hashtag'],['settings','⚙️','Cài đặt']]],['KHÁC',[['feedback','💬','Góp ý']]]];
const KEY='pdk_pro_v2';
const LS=(()=>{try{const s=window.localStorage;s.setItem('__pdk_t','1');s.removeItem('__pdk_t');return s}catch(e){const m={};return {getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]},_mem:true}}})();
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const tok=t=>' '+norm(t).replace(/[^a-z0-9]+/g,' ').trim()+' ';
const hasKw=(T,k)=>{k=norm(k).replace(/[^a-z0-9]+/g,' ').trim();return !!k&&T.includes(' '+k+' ')};
const fmtT=t=>new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
const fmtN=n=>Math.round(n).toLocaleString('vi-VN');
const fmtDur=ms=>{const m=ms/60000;if(!ms)return '–';if(m<1)return Math.round(ms/1000)+' giây';if(m<60)return m.toFixed(1)+' phút';return (m/60).toFixed(1)+' giờ'};
const pct=x=>(x*100).toFixed(1)+'%';
const pfIcon=p=>`<span class="pf" style="background:${PF[p].c}" title="${PF[p].n}">${PF[p].a}</span>`;
const chById=id=>S.channels.find(c=>c.id===id);
const chOfConv=c=>chById(c.ch)||{pf:'facebook',name:'?'};
const cv=id=>S.convos.find(x=>x.id===id);
const scr=id=>S.scripts.find(x=>x.id===id);
const last=c=>c.messages[c.messages.length-1]||{t:0,text:'',from:'customer'};
function pick(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)}
function pickOne(a,s){return a[Math.abs(s)%a.length]}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}
function isEnter(e){return e.key==='Enter'||e.keyCode===13||e.code==='Enter'||e.code==='NumpadEnter'}
document.addEventListener('keydown',e=>{if((e.key==='Escape'||e.keyCode===27)&&$('#modal').classList.contains('on'))closeModal()});
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function ask(msg,yes,o={}){if(window.QA_RUNNING&&!QA.realAsk){if(window.confirm(msg))yes();return}modal(`<h3>${esc(o.title||'Xác nhận')}</h3><p style="white-space:pre-wrap;margin:8px 0">${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="ask_no" onclick="closeModal()">Hủy</button><button class="btn ${o.danger?'danger':'pri'}" id="ask_yes">${esc(o.ok||'Đồng ý')}</button></div>`);$('#ask_yes').onclick=()=>{closeModal();yes()};setTimeout(()=>{const b=$('#ask_yes');if(b)b.focus()},30)}
function askText(title,def,cb){if(window.QA_RUNNING&&!QA.realAsk){const v=window.prompt(title,def);if(v!=null)cb(v);return}modal(`<h3>${esc(title)}</h3><input id="ask_in" value="${esc(def||'')}"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="ask_no" onclick="closeModal()">Hủy</button><button class="btn pri" id="ask_yes">Lưu</button></div>`);const i=$('#ask_in');const ok=()=>{const v=i.value;closeModal();cb(v)};$('#ask_yes').onclick=ok;i.onkeydown=e=>{if(isEnter(e))ok()};setTimeout(()=>i.focus(),30)}

function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function load(){try{const s=JSON.parse(LS.getItem(KEY));if(s&&s.v===3)return fixState(s);if(s&&s.v===2)return migrate3(s)}catch(e){}return migrate3(seed())}
const IDB={db:null,open(){return new Promise(res=>{try{const r=indexedDB.open('pdk_pro',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=()=>{IDB.db=r.result;res(r.result)};r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})},
op(s,mode,fn){return new Promise(res=>{if(!IDB.db)return res(null);try{const tx=IDB.db.transaction(s,mode);const rq=fn(tx.objectStore(s));tx.oncomplete=()=>res(rq?rq.result:null);tx.onerror=()=>res(null);tx.onabort=()=>res(null)}catch(e){res(null)}})},
get(s,k){return IDB.op(s,'readonly',st=>st.get(k))},put(s,k,v){return IDB.op(s,'readwrite',st=>st.put(v,k))},del(s,k){return IDB.op(s,'readwrite',st=>st.delete(k))},clear(s){return IDB.op(s,'readwrite',st=>st.clear())},
all(s){return new Promise(res=>{const out=[];if(!IDB.db)return res(out);try{const rq=IDB.db.transaction(s).objectStore(s).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res(out)}})}};
const STORE={mode:LS._mem?'bộ nhớ tạm – trình duyệt đang chặn lưu trữ (khung nhúng sandbox), dữ liệu sẽ mất khi tải lại trang':'localStorage',lsFull:false};let _svT=null;
function save(){if(window.QA_RUNNING)return;clearTimeout(_svT);_svT=setTimeout(persist,120)}
function persist(){clearTimeout(_svT);_svT=null;if(window.QA_RUNNING)return;S.savedAt=Date.now();const j=JSON.stringify(S);if(IDB.db)IDB.put('kv','state',j);try{LS.setItem(KEY,j);STORE.lsFull=false}catch(e){if(!STORE.lsFull&&!IDB.db)toast('Bộ nhớ trình duyệt đầy – hãy xóa bớt dữ liệu');STORE.lsFull=true}}
addEventListener('beforeunload',()=>{if(_svT)persist()});
function putFile(id,blob){if(blob&&IDB.db)IDB.put('files',id,blob)}
async function loadFiles(){const all=await IDB.all('files');const keep=new Set(D.media.map(m=>m.fid&&'d_'+m.fid).filter(Boolean));all.forEach(([k,b])=>{if(String(k).startsWith('d_')&&!keep.has(k)){IDB.del('files',k);return}if(!BLOBS[k]&&b instanceof Blob)BLOBS[k]=URL.createObjectURL(b)});
D.media.forEach(m=>{if(!m.url){const k=m.assetId&&BLOBS[m.assetId]?m.assetId:(m.fid?'d_'+m.fid:null);if(k&&BLOBS[k])m.url=BLOBS[k]}});return all.length}
async function bootStorage(){if(typeof indexedDB==='undefined')return;await IDB.open();if(!IDB.db)return;STORE.mode='IndexedDB';let changed=false;const j=await IDB.get('kv','state');if(j){try{const s=JSON.parse(j);if(s&&(s.savedAt||0)>(S.savedAt||0)&&[2,3].includes(s.v)){S=s.v===3?fixState(s):migrate3(s);changed=true}}catch(e){}}else persist();
const n=await loadFiles();if((changed||n)&&!window.QA_RUNNING&&['library','create','posts'].includes(route))render()}
function kp(l,v,d,hint){return `<div class="card kpi" style="margin:0" title="${esc(hint||'')}"><div class="l">${l}</div><div class="v">${v}</div>${d||''}</div>`}
function dl(a,b,higherBetter,isRatio){if(!b&&!a)return '';if(!b)return '<span class="d muted">kỳ trước: không có dữ liệu</span>';const diff=a-b;if(Math.abs(diff)<1e-9)return '<span class="d muted">= kỳ trước</span>';const good=higherBetter?diff>0:diff<0;const txt=isRatio?(Math.abs(diff*100).toFixed(1)+' điểm %'):(Math.abs(diff/b*100).toFixed(0)+'%');return `<span class="d ${good?'up':'down'}">${diff>0?'▲':'▼'} ${txt} so với kỳ trước</span>`}
function bars(data,h=170){if(!data.length)return '<p class="muted small">Chưa có dữ liệu</p>';const max=Math.max(1e-9,...data.map(d=>d.v));const W=data.length>12?36:70;return `<svg viewBox="0 0 ${data.length*W} ${h+34}" width="100%" style="max-height:${h+60}px">`+data.map((d,i)=>{const bh=Math.max(1,d.v/max*h);const x=i*W;return `<rect x="${x+W*.18}" y="${h-bh+14}" width="${W*.64}" height="${bh}" rx="3" fill="${d.c||'#030213'}"><title>${esc(d.l)}: ${d.v}</title></rect>${data.length<=12?`<text x="${x+W/2}" y="${h-bh+10}" font-size="11" text-anchor="middle">${d.lab??d.v}</text>`:''}<text x="${x+W/2}" y="${h+30}" font-size="${data.length>12?9:11}" text-anchor="middle" fill="#717182">${esc(d.l)}</text>`}).join('')+'</svg>'}

/* ================= SEED DATA ================= */
const DEFAULT_PROFILE={brand:'ShopTrack',hotline:'[cập nhật hotline]',signup:'[link đăng ký]',
desc:'ShopTrack là phần mềm lên đơn và quản lý đơn hàng, kèm hệ thống đại lý phân phối cước vận chuyển.',
audience:'chủ shop bán hàng online, doanh nghiệp vừa và nhỏ, đại lý vận chuyển',
features:'Lên đơn nhanh trên một hệ thống, Quản lý và theo dõi đơn hàng tập trung, Chính sách cước dành cho đại lý phân phối',
rules:'1. Mọi nội dung (bài đăng, kịch bản chatbot, trả lời khách) phải xoay quanh: lên đơn, quản lý/theo dõi đơn hàng, cước vận chuyển, đối soát và chương trình đại lý phân phối cước.\n2. Không dùng ngữ cảnh shop bán lẻ (size, màu, mẫu mã, còn hàng...).\n3. Không tự đưa ra giá cước, mức chiết khấu đại lý hay cam kết thời gian giao khi chưa có số liệu chính thức – hướng khách để lại thông tin hoặc gặp nhân viên.\n4. Xưng hô lịch sự, chuyên nghiệp; khách hàng là người bán hàng/đối tác kinh doanh.'};

hashtags({text,platform,phrases}){const words=norm(text).replace(/#[a-z0-9_]+/g,' ').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!STOP.has(w));const cnt={},bi={};words.forEach(w=>cnt[w]=(cnt[w]||0)+1);for(let i=0;i<words.length-1;i++){const b=words[i]+words[i+1];bi[b]=(bi[b]||0)+1}

generate(p){const s=p.seed??rnd(0,99);const SP=p.product||S.settings.brand;const CD=p.topic||SP;const DT=p.audience||'các nhà bán hàng';const rep=x=>x.replace(/{SP}/g,SP).replace(/{CD}/g,CD).replace(/{DT}/g,DT);const tone=HOOKS[p.tone]?p.tone:'than_thien';
const feats=String(p.features||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);const dft=String(S.settings.features||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);const fl=feats.length?feats:(dft.length?dft:['Lên đơn nhanh','Quản lý đơn hàng tập trung','Hỗ trợ tận tâm']);const ic=pickOne(['✅','✨','💎','🌟','👉'],s);

function contentScore(t){t=String(t||'');const lines=t.trim().split('\n');const first=lines[0]||'';const tags=(t.match(/#[\p{L}\p{N}_]+/gu)||[]).length;const emo=(t.match(/\p{Extended_Pictographic}/gu)||[]).length;const L=t.trim().length;const letters=(t.match(/\p{L}/gu)||[]).length,upper=(t.match(/\p{Lu}/gu)||[]).length;

$('#score').innerHTML=`<div class="row" style="justify-content:space-between"><b style="font-size:24px;color:${col}">${r.score}/100</b><span class="small muted">${r.score>=80?'Tốt':r.score>=50?'Khá':'Cần cải thiện'}</span></div><div class="bar" style="margin:8px 0"><i style="width:${r.score}%;background:${col}"></i></div>${r.checks.map(([ok,l])=>`<div class="small">${ok?'✅':'⬜'} ${l}</div>`).join('')}`}
function addFiles(fl){[...fl].forEach(f=>{const m={name:f.name,type:f.type||'',size:f.size,url:URL.createObjectURL(f),thumb:null,fid:uid()};Object.defineProperty(m,'file',{value:f,enumerable:false,writable:true});putFile('d_'+m.fid,f);if(m.type.startsWith('image'))compressImage(f).then(d=>{m.thumb=d;saveDraft()});else if(m.type.startsWith('video'))videoPoster(m.url).then(d=>{m.thumb=d;saveDraft()});D.media.push(m)});renderThumbs();upd()}
function renderThumbs(){$('#thumbs').innerHTML=D.media.map((m,i)=>`<div style="position:relative">${m.type.startsWith('video')?`<video src="${m.url||''}"></video>`:`<img src="${m.url||m.thumb}">`}<button class="btn sm" style="position:absolute;top:2px;right:2px;padding:0 6px" onclick="D.media.splice(${i},1);renderThumbs();upd()">×</button></div>`).join('')}
const EMO=Array.from('😀😍🥰😂🤣😎🤩🥳😭🙏👍👏🔥✨💯🎉🎁💖💛💙🌸🌿☕📣📦🛒💬👉✅⭐🚚📍💌');
function openEmoji(){modal(`<h3>Chèn emoji</h3><div style="font-size:26px">${EMO.map((e,i)=>`<span style="cursor:pointer;padding:4px" onclick="insertAt(EMO[${i}])">${e}</span>`).join('')}</div><div style="text-align:right;margin-top:10px"><button class="btn" onclick="closeModal()">Đóng</button></div>`)}
function insertAt(s){const ta=$('#ct');const p=ta.selectionStart??ta.value.length,e=ta.selectionEnd??p;D.content=ta.value.slice(0,p)+s+ta.value.slice(e);ta.value=D.content;ta.selectionStart=ta.selectionEnd=p+s.length;upd()}
function openTags(){modal(`<h3>Thêm hashtag</h3>${S.hashtags.map(h=>`<div style="margin:8px 0"><b class="small">${esc(h.name)}</b><br>${h.tags.map(t=>`<label class="tag" style="cursor:pointer;color:inherit;font-size:12px"><input type="checkbox" class="htc" value="${esc(t)}" style="width:auto"> ${esc(t)}</label>`).join('')}</div>`).join('')||'<p class="muted">Chưa có bộ hashtag – tạo tại mục Hashtag</p>'}
<label>Hashtag tùy chỉnh (cách nhau bởi dấu cách)</label><input id="htcus" placeholder="#mytag #khac"><div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn" onclick="$('#htcus').value=AI.local.hashtags({text:D.content})">✨ AI gợi ý từ nội dung</button><div class="row"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="insTags()">Chèn</button></div></div>`)}
function insTags(){const a=[...document.querySelectorAll('.htc:checked')].map(x=>x.value).concat($('#htcus').value.split(/\s+/).filter(Boolean).map(t=>t.startsWith('#')?t:'#'+t));if(a.length){D.content=(D.content.trimEnd()+'\n\n'+[...new Set(a)].join(' ')).trim();$('#ct').value=D.content;upd()}closeModal()}
async function aiImprove(){const b=$('#impBtn');if(b.disabled)return;b.disabled=true;b.textContent='Đang xử lý...';const draft=D,original=D.content;try{const result=await AI.call('improve',{text:original,tone:S.settings.tone});if(D!==draft||D.content!==original)return toast('Bản nháp đã thay đổi; không ghi đè nội dung mới.');D.content=result.slice(0,5000);const input=$('#ct');if(input)input.value=D.content;upd();toast('Đã cải thiện nội dung')}catch(e){toast('Chưa cải thiện được. Nội dung gốc được giữ nguyên.')}finally{b.disabled=false;b.textContent='🪄 Cải thiện bằng AI'}}
function submitPost(){const chs=D.channels.filter(id=>!validity(chById(id)));if(!chs.length)return toast('Chọn ít nhất 1 kênh hợp lệ');if(!D.content.trim()&&!D.media.length)return toast('Nhập nội dung hoặc thêm media');
let t=Date.now(),status='published';if(D.when==='later'){if(!D.date||!D.time)return toast('Chọn ngày và giờ đăng');t=new Date(D.date+'T'+D.time).getTime();if(!(t>Date.now()))return toast('Thời gian lên lịch phải ở tương lai');status='scheduled'}
const custom={};chs.forEach(id=>{if(D.custom[id])custom[id]={...D.custom[id]}});
const assetIds=syncDraftToKho();const p={id:uid(),type:D.media.some(m=>m.type.startsWith('video'))?'video':'post',content:D.content,media:D.media.map(({name,type,size,thumb,assetId})=>({name,type,size,thumb,assetId})),assets:assetIds,channels:chs,custom,status,time:t,metrics:{},createdBy:'Bạn'};
if(status==='published')publish(p);S.posts.unshift(p);save();toast(status==='published'?'Đã đăng lên '+chs.length+' kênh (mô phỏng)':'Đã lên lịch '+fmtT(t));const more=D.more;D=newDraft();D.more=more;saveDraft();more?V.create():go('posts')}
function publish(p){p.status='published';p.error=null;p.channels.forEach(id=>{if(!p.metrics[id])p.metrics[id]={views:0,likes:0,comments:0,shares:0}})}

/* ================= AI PAGE ================= */
function genForm(p){return `<div class="grid g2"><div><label>Chủ đề / mục tiêu bài viết *</label><input id="${p}_topic" placeholder="VD: Tuyển đại lý phân phối cước"></div><div><label>Sản phẩm / dịch vụ</label><input id="${p}_product" value="${esc(S.settings.brand)}"></div><div><label>Đối tượng khách hàng</label><input id="${p}_aud" value="${esc(S.settings.audience)}"></div><div><label>Giọng văn</label><select id="${p}_tone">${Object.entries(TONES).map(([k,v])=>`<option value="${k}" ${k===S.settings.tone?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Nền tảng chính</label><select id="${p}_pf">${Object.entries(PF).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></div><div><label>Độ dài</label><select id="${p}_len"><option value="short">Ngắn</option><option value="medium" selected>Vừa</option><option value="long">Dài</option></select></div></div>
<label>Điểm nổi bật (cách nhau dấu phẩy)</label><input id="${p}_feat" placeholder="${esc(S.settings.features)}"><div class="grid g2"><div><label>Ưu đãi (nếu có)</label><input id="${p}_offer" placeholder="Chỉ nhập ưu đãi đã được duyệt"></div><div><label>Kêu gọi hành động (để trống = AI tự chọn)</label><input id="${p}_cta"></div></div><label class="row" style="color:inherit;margin-top:8px;font-size:13px"><input type="checkbox" id="${p}_emo" checked style="width:auto"> Dùng emoji</label>`}
async function runGen(p){try{const g=id=>$('#'+p+'_'+id);if(!g('topic').value.trim()&&!g('product').value.trim())return toast('Nhập chủ đề hoặc sản phẩm');const base={topic:g('topic').value.trim(),product:g('product').value.trim(),audience:g('aud').value.trim(),tone:g('tone').value,platform:g('pf').value,length:g('len').value,features:g('feat').value,offer:g('offer').value.trim(),cta:g('cta').value.trim(),emoji:g('emo').checked};
$('#'+p+'_out').innerHTML='<p class="muted">✨ Đang tạo nội dung...</p>';const r=rnd(0,99),outs=[];for(let i=0;i<3;i++)outs.push(await AI.call('generate',{...base,seed:r+i}));window._gen=outs;
$('#'+p+'_out').innerHTML=outs.map((o,i)=>`<div class="variant"><div class="row" style="justify-content:space-between"><b class="small">Phương án ${i+1}</b><span class="tag">Điểm chất lượng ${contentScore(o).score}/100</span></div><div style="white-space:pre-wrap;margin-top:6px">${esc(o)}</div><div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="useGen(${i})">Dùng nội dung này</button><button class="btn sm" onclick="navigator.clipboard.writeText(window._gen[${i}]).then(()=>toast('Đã sao chép'))">Sao chép</button></div></div>`).join('')}catch(e){const out=$('#'+p+'_out');if(out)out.textContent='Chưa tạo được nội dung. Vui lòng thử lại.';toast('Tạo nội dung chưa hoàn tất.')}}
function useGen(i){if(typeof window._gen?.[i]!=='string'||!window._gen[i].trim())return toast('Kết quả không còn khả dụng. Hãy tạo lại nội dung.');const ap=()=>{D.content=window._gen[i];closeModal();go('create');toast('Đã đưa nội dung vào trình soạn')};if(D.content.trim()&&D.content.trim()!==String(window._gen[i]).trim())ask('Thay nội dung đang soạn bằng phương án AI này?',ap,{ok:'Thay nội dung'});else ap()}
function openGen(){modal(`<h3>✨ AI tạo nội dung</h3>${genForm('m')}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="runGen('m')">Tạo 3 phương án</button></div><div id="m_out"></div>`)}
const PILLARS=[['Mẹo vận hành','{n} mẹo giúp {a} lên đơn và xử lý đơn nhanh hơn','Carousel'],['Giới thiệu tính năng','Tính năng của {t} giúp quản lý đơn hàng tập trung','Bài viết + ảnh'],['Hướng dẫn sử dụng','Hướng dẫn tạo đơn và in vận đơn trên {t}','Video ngắn'],['Chương trình đại lý','Trở thành đại lý phân phối cước cùng {t}','Bài viết'],['Kiến thức vận chuyển','Cách tính cước vận chuyển mà {a} cần biết','Carousel'],['Tương tác','Hỏi {a}: khó khăn lớn nhất khi xử lý đơn hàng là gì?','Bài viết'],['Câu chuyện chuyển đổi','Hành trình chuyển từ quản lý đơn thủ công sang {t}','Video ngắn']];
const TIMES=['11:30','20:00','19:30','12:00','20:30','10:00','21:00'];
V.ai=()=>{$('#view').innerHTML=`<div class="grid two g2" style="align-items:start"><div class="card"><h3>✨ Tạo nội dung từ đầu</h3>${genForm('a')}<div style="margin-top:12px;text-align:right"><button class="btn pri" onclick="runGen('a')">Tạo 3 phương án</button></div><div id="a_out"></div></div>
<div><div class="card"><h3>📅 Lập kế hoạch nội dung 7 ngày</h3><div class="grid g2"><div><label>Lĩnh vực / sản phẩm</label><input id="pl_topic" value="${esc(S.settings.brand)}"></div><div><label>Đối tượng</label><input id="pl_aud" placeholder="VD: chủ shop online, đại lý cước"></div></div><div style="margin-top:10px;text-align:right"><button class="btn pri" onclick="runPlan()">Tạo kế hoạch</button></div><div id="pl_out" style="overflow:auto"></div></div>
<div class="card"><h3>🔁 Viết lại / chuyển thể</h3><textarea id="rw_in" placeholder="Dán nội dung cần viết lại..." style="min-height:100px"></textarea><div class="row" style="margin-top:8px"><select id="rw_pf" style="width:auto">${Object.entries(PF).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><button class="btn" onclick="runRw('adapt')">Chuyển thể theo nền tảng</button><button class="btn" onclick="runRw('improve')">Cải thiện</button></div><div id="rw_out"></div></div>
<div class="card small"><b>📌 Quy tắc nội dung đang áp dụng</b> (sửa tại <a href="#settings">Cài đặt</a>)<div class="muted" style="white-space:pre-wrap;margin-top:4px">${esc(S.settings.rules)}</div></div><div class="card small muted">Engine hiện tại: ${effectiveAIEndpoint()?'AI qua Cloudflare Access, cùng origin ('+esc(effectiveAIEndpoint())+'); lỗi kết nối sẽ dừng tác vụ và giữ bản nháp' :'Engine mẫu nội bộ (offline, dựa trên template). Kết nối LLM thật tại <a href="#settings">Cài đặt</a>.'}</div></div></div>`}
function runPlan(){const t=$('#pl_topic').value.trim()||S.settings.brand,a=$('#pl_aud').value.trim()||'nhà bán hàng online';const st=new Date();st.setDate(st.getDate()+1);
window._plan=PILLARS.map((p,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return {ds,d,pillar:p[0],idea:p[1].replace('{n}',rnd(3,7)).replace(/{t}/g,t).replace(/{a}/g,a),format:p[2],time:TIMES[i],pf:p[2]==='Video ngắn'?'tiktok':'facebook',topic:t,aud:a}});
$('#pl_out').innerHTML=`<table style="margin-top:10px"><tr><th>Ngày</th><th>Trụ cột</th><th>Ý tưởng</th><th>Định dạng</th><th>Giờ</th><th></th></tr>${window._plan.map((r,i)=>`<tr><td>${r.d.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})}</td><td>${r.pillar}</td><td>${esc(r.idea)}</td><td>${r.format}</td><td>${r.time}</td><td><button class="btn sm" onclick="planUse(${i})">Soạn</button></td></tr>`).join('')}</table><p class="small muted">Giờ đăng là gợi ý mặc định; xem trang Phân tích để chọn khung giờ hiệu quả nhất với kênh của bạn.</p>`}
async function planUse(i){try{const r=window._plan[i];const c=await AI.call('generate',{topic:r.idea,product:r.topic,audience:r.aud,tone:S.settings.tone,platform:r.pf,length:'medium',seed:i});freshDraft(()=>{D.content=c;D.when='later';D.date=r.ds;D.time=r.time;go('create');toast('Đã soạn bài & đặt lịch '+r.time+' – hãy chọn kênh')})}catch(e){toast('Tác vụ AI chưa hoàn tất. Vui lòng thử lại.')}}
async function runRw(k){try{const t=$('#rw_in').value.trim();if(!t)return toast('Nhập nội dung');const o=await AI.call(k,{text:t,platform:$('#rw_pf').value,tone:S.settings.tone});window._gen=[o];$('#rw_out').innerHTML=`<div class="variant"><div style="white-space:pre-wrap">${esc(o)}</div><div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="useGen(0)">Dùng nội dung này</button></div></div>`}catch(e){toast('Tác vụ AI chưa hoàn tất. Vui lòng thử lại.')}}

/* ================= POSTS & CALENDAR ================= */
const F={posts:{type:'all',status:'all',pf:'all',grp:'all'},calendar:{type:'all',status:'all',pf:'all',grp:'all'}};
const STL={published:'Đã đăng',scheduled:'Đã lên lịch',failed:'Thất bại'};
function filterBar(k){const f=F[k];const pfs=[...new Set(S.channels.filter(c=>c.connected).map(c=>c.pf))];const sel=(n,o)=>`<select style="width:auto" onchange="F.${k}.${n}=this.value;V.${k}()">${o.map(([v,l])=>`<option value="${v}" ${f[n]===v?'selected':''}>${l}</option>`).join('')}</select>`;
return `<div class="row">${sel('type',[['all','Tất cả loại'],['post','Bài viết'],['video','Video ngắn']])}${sel('status',[['all','Tất cả trạng thái'],['published','Đã đăng'],['scheduled','Đã lên lịch'],['failed','Thất bại']])}${sel('pf',[['all','Tất cả nền tảng'],...pfs.map(p=>[p,PF[p].n])])}${S.groups.length?sel('grp',[['all','Tất cả nhóm kênh'],...S.groups.map(g=>[g.id,'👥 '+esc(g.name)])]):''}</div>`}
function fpost(k){const f=F[k];return S.posts.filter(p=>(f.type==='all'||p.type===f.type)&&(f.status==='all'||p.status===f.status)&&(f.pf==='all'||p.channels.some(id=>(chById(id)||{}).pf===f.pf))&&(!f.grp||f.grp==='all'||!grpById(f.grp)||p.channels.some(id=>grpById(f.grp).channels.includes(id))))}
function sumM(p){const s={views:0,likes:0,comments:0,shares:0};Object.values(p.metrics||{}).forEach(m=>{for(const k in s)s[k]+=m[k]||0});return s}
function er(s){return s.views?((s.likes+s.comments+s.shares)/s.views*100).toFixed(2):'0.00'}
V.posts=()=>{const list=fpost('posts').sort((a,b)=>b.time-a.time);$('#view').innerHTML=`<div class="row" style="justify-content:space-between">${filterBar('posts')}<button class="btn pri" onclick="freshDraft(()=>go('create'))">+ Tạo bài viết</button></div><div class="small muted" style="margin:10px 0">${list.length} bài đăng</div>${list.map(postCard).join('')||'<div class="card muted">Không có bài đăng</div>'}`}
function postCard(p){const s=sumM(p);return `<div class="card"><div class="row" style="justify-content:space-between"><div class="row">${p.channels.map(chById).filter(Boolean).map(c=>pfIcon(c.pf)).join('')}<span class="tag st-${p.status}">${STL[p.status]}</span><span class="small muted">${p.type==='video'?'Video ngắn':'Bài viết'} · ${fmtT(p.time)} · Tạo bởi ${esc(p.createdBy||'Bạn')}</span></div><div class="row">${p.status==='scheduled'?`<button class="btn sm" onclick="pubNow('${p.id}')">Đăng ngay</button>`:''}${p.status==='failed'?`<button class="btn sm" onclick="pubNow('${p.id}')">Thử lại</button>`:''}<button class="btn sm" onclick="dupPost('${p.id}')">Nhân bản</button><button class="btn sm danger" onclick="delPost('${p.id}')">Xóa</button></div></div>
<div style="white-space:pre-wrap;margin:10px 0">${esc(p.content.slice(0,280))}${p.content.length>280?'…':''}</div>${p.error?`<div class="small" style="color:var(--red)">⚠ ${esc(p.error)}</div>`:''}
${p.status==='published'?`<div class="row small muted">👁 ${fmtN(s.views)} lượt xem · 👍 ${fmtN(s.likes)} · 💬 ${fmtN(s.comments)} · ↗ ${fmtN(s.shares)} · Tỷ lệ tương tác ${er(s)}%</div><div class="row" style="margin-top:4px">${Object.entries(p.metrics).map(([id,m])=>{const c=chById(id);return c?`<span class="tag">${PF[c.pf].n}: ${fmtN(m.views)} xem</span>`:''}).join('')}</div>`:''}</div>`}
function pubNow(id){const p=S.posts.find(x=>x.id===id);if(p.channels.map(chById).some(c=>!c||!c.connected)){p.status='failed';p.error='Có kênh chưa kết nối';toast('Đăng thất bại: kênh chưa kết nối')}else{p.time=Date.now();publish(p);toast('Đã đăng (mô phỏng)')}save();render()}
function dupPost(id){const p=S.posts.find(x=>x.id===id);freshDraft(()=>{D.content=p.content;D.channels=p.channels.filter(x=>(chById(x)||{}).connected);D.custom=JSON.parse(JSON.stringify(p.custom||{}));D.media=(p.media||[]).filter(m=>m.thumb||(m.assetId&&BLOBS[m.assetId])).map(m=>({...m,url:(m.assetId&&BLOBS[m.assetId])||m.thumb}));go('create')})}
function delPost(id){ask('Xóa bài đăng này?',()=>{S.posts=S.posts.filter(x=>x.id!==id);save();render()},{ok:'Xóa',danger:true})}
const CAL={mode:'month',ref:new Date()};
V.calendar=()=>{const list=fpost('calendar');const r=new Date(CAL.ref);const days=[];if(CAL.mode==='month'){const f=new Date(r.getFullYear(),r.getMonth(),1);const off=(f.getDay()+6)%7;for(let i=0;i<42;i++)days.push(new Date(f.getFullYear(),f.getMonth(),1-off+i))}else{const off=(r.getDay()+6)%7;for(let i=0;i<7;i++)days.push(new Date(r.getFullYear(),r.getMonth(),r.getDate()-off+i))}
const same=(a,b)=>a.toDateString()===b.toDateString();const col={published:'#dcfce7',scheduled:'#dbeafe',failed:'#fee2e2'};const title=CAL.mode==='month'?`Tháng ${r.getMonth()+1}/${r.getFullYear()}`:`${days[0].toLocaleDateString('vi-VN')} – ${days[6].toLocaleDateString('vi-VN')}`;
$('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px">${filterBar('calendar')}<div class="row"><button class="btn sm" onclick="calMove(-1)">‹</button><button class="btn sm" onclick="CAL.ref=new Date();V.calendar()">Hôm nay</button><button class="btn sm" onclick="calMove(1)">›</button><b>${title}</b><div class="seg"><button class="${CAL.mode==='week'?'on':''}" onclick="CAL.mode='week';V.calendar()">Tuần</button><button class="${CAL.mode==='month'?'on':''}" onclick="CAL.mode='month';V.calendar()">Tháng</button></div></div></div>
<div class="cal">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${days.map(d=>{const ev=list.filter(p=>same(new Date(p.time),d)).sort((a,b)=>a.time-b.time);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<div class="d ${same(d,new Date())?'today':''}" style="${CAL.mode==='month'&&d.getMonth()!==r.getMonth()?'opacity:.45;':''}${CAL.mode==='week'?'min-height:320px':''}"><div class="row" style="justify-content:space-between"><b>${d.getDate()}</b><a href="javascript:void(0)" title="Tạo bài cho ngày này" onclick="newAt('${ds}')">+</a></div>${ev.map(p=>`<span class="ev" style="background:${col[p.status]}" title="${esc(p.content)}">${new Date(p.time).toTimeString().slice(0,5)} ${esc(p.content.slice(0,40))}</span>`).join('')}${CAL.mode==='week'&&!ev.length?'<div class="small muted" style="margin-top:6px">Không có bài đăng</div>':''}</div>`}).join('')}</div>
<div class="row small" style="margin-top:10px"><span class="tag st-published">Đã đăng</span><span class="tag st-scheduled">Đã lên lịch</span><span class="tag st-failed">Thất bại</span></div>`}
function calMove(n){const r=new Date(CAL.ref);if(CAL.mode==='month'){r.setDate(1);r.setMonth(r.getMonth()+n)}else r.setDate(r.getDate()+7*n);CAL.ref=r;V.calendar()}
function newAt(ds){freshDraft(()=>{D.when='later';D.date=ds;D.time='20:00';go('create')})}

/* ================= ANALYTICS ================= */
const AN={days:30,ch:'all',sort:'views',dir:'desc'};const LBL={views:'Lượt xem',likes:'Thích',comments:'Bình luận',shares:'Chia sẻ'};
function anRows(a,b){const rows=[];S.posts.filter(p=>p.status==='published'&&p.time>=a&&p.time<b).forEach(p=>Object.entries(p.metrics).forEach(([id,m])=>{if(AN.ch!=='all'&&id!==AN.ch)return;const c=chById(id);if(c)rows.push({p,c,...m})}));return rows}
const tot=rows=>rows.reduce((s,r)=>{for(const k in LBL)s[k]+=r[k];return s},{views:0,likes:0,comments:0,shares:0});
V.analytics=()=>{const now=Date.now(),since=now-AN.days*864e5;const rows=anRows(since,Infinity),prev=anRows(since-AN.days*864e5,since);const T=tot(rows),P=tot(prev);
const byPf={};rows.forEach(r=>{const b=byPf[r.c.pf]||(byPf[r.c.pf]={views:0,likes:0,comments:0,shares:0,posts:new Set(),chs:new Set()});for(const k in LBL)b[k]+=r[k];b.posts.add(r.p.id);b.chs.add(r.c.id)});
const hours=Array(24).fill(0),hc=Array(24).fill(0);rows.forEach(r=>{const h=new Date(r.p.time).getHours();hc[h]++;hours[h]+=r.views?(r.likes+r.comments+r.shares)/r.views*100:0});
rows.sort((a,b)=>(AN.dir==='desc'?-1:1)*(a[AN.sort]-b[AN.sort]));const nPosts=new Set(rows.map(r=>r.p.id)).size,nCh=new Set(rows.map(r=>r.c.id)).size;
$('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row"><select style="width:auto" onchange="AN.ch=this.value;V.analytics()"><option value="all">Tất cả kênh</option>${S.channels.filter(c=>c.connected).map(c=>`<option value="${c.id}" ${AN.ch===c.id?'selected':''}>${PF[c.pf].n} – ${esc(c.name)}</option>`).join('')}</select><div class="seg">${[7,14,30,90].map(d=>`<button class="${AN.days===d?'on':''}" onclick="AN.days=${d};V.analytics()">${d} ngày</button>`).join('')}</div></div><div class="row"><span class="small muted">${S.lastSync?'Đồng bộ lúc '+fmtT(S.lastSync):''}</span><button class="btn sm" onclick="syncMetrics()">🔄 Đồng bộ chỉ số</button></div></div>
<p class="muted">Tổng ${nPosts} bài đăng trên ${nCh} kênh trong ${AN.days} ngày</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px">${Object.keys(LBL).map(k=>kp(LBL[k],fmtN(T[k]),dl(T[k],P[k],true))).join('')}${kp('Tỷ lệ tương tác',er(T)+'%',dl(+er(T)/100,+er(P)/100,true,true),'(Thích + Bình luận + Chia sẻ) / Lượt xem')}</div>
<div class="grid two g2"><div class="card"><h3>Lượt xem theo nền tảng</h3>${bars(Object.entries(byPf).map(([p,b])=>({l:PF[p].n,v:b.views,c:PF[p].c,lab:fmtN(b.views)})))}</div><div class="card"><h3>Tỷ lệ tương tác theo nền tảng (%)</h3>${bars(Object.entries(byPf).map(([p,b])=>({l:PF[p].n,v:+er(b),c:PF[p].c})))}</div></div>
<div class="card"><h3>⏰ Khung giờ đăng hiệu quả (tỷ lệ tương tác TB theo giờ đăng)</h3>${bars(hours.map((v,h)=>({l:h+'h',v:hc[h]?+(v/hc[h]).toFixed(2):0,c:'#009588'})),120)}</div>
<div class="card" style="overflow:auto"><h3>So sánh nền tảng</h3><table><tr><th>Nền tảng</th><th>Kênh</th><th>Bài</th>${Object.values(LBL).map(l=>`<th>${l}</th>`).join('')}<th>Tương tác</th></tr>${Object.entries(byPf).map(([p,b])=>`<tr><td>${pfIcon(p)} ${PF[p].n}</td><td>${b.chs.size}</td><td>${b.posts.size}</td>${Object.keys(LBL).map(k=>`<td>${fmtN(b[k])}</td>`).join('')}<td>${er(b)}%</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Chưa có dữ liệu</td></tr>'}</table></div>
<div class="card" style="overflow:auto"><h3>Hiệu suất bài đăng theo kênh</h3><table><tr><th>Bài đăng</th><th>Kênh</th><th>Thời gian</th>${Object.keys(LBL).map(k=>`<th onclick="anSort('${k}')">${LBL[k]}${AN.sort===k?(AN.dir==='desc'?' ↓':' ↑'):' ⇅'}</th>`).join('')}<th>Tương tác</th></tr>${rows.slice(0,60).map(r=>`<tr><td style="max-width:320px">${esc(r.p.content.slice(0,80))}</td><td>${pfIcon(r.c.pf)} ${esc(r.c.name)}</td><td>${fmtT(r.p.time)}</td>${Object.keys(LBL).map(k=>`<td>${fmtN(r[k])}</td>`).join('')}<td>${er(r)}%</td></tr>`).join('')}</table></div>`}
function anSort(k){if(AN.sort===k)AN.dir=AN.dir==='desc'?'asc':'desc';else{AN.sort=k;AN.dir='desc'}V.analytics()}
function syncMetrics(){S.posts.filter(p=>p.status==='published').forEach(p=>Object.values(p.metrics).forEach(m=>{const a=rnd(5,300);m.views+=a;m.likes+=Math.round(a*rnd(2,10)/100);m.comments+=rnd(0,3);m.shares+=rnd(0,2)}));S.lastSync=Date.now();save();V.analytics();toast('Đã đồng bộ chỉ số (dữ liệu mô phỏng)')}

/* ================= CHATBOT ENGINE ================= */
const TRG={keyword:'Từ khóa',regex:'Biểu thức (regex)',welcome:'Tin nhắn đầu tiên',offhours:'Ngoài giờ làm việc',fallback:'Không khớp (dự phòng)'};
const ACT={none:'Chỉ trả lời',tag:'Gắn nhãn',handoff:'Chuyển nhân viên',close:'Đóng hội thoại'};
function inHours(t){const d=new Date(t),h=d.getHours()+d.getMinutes()/60;return h>=S.settings.open&&h<S.settings.close}
function fillTpl(t,name,kenh){const s=S.settings;return t.replace(/{ten}/g,name).replace(/{shop}/g,s.brand).replace(/{kenh}/g,kenh).replace(/{gio_mo}/g,`${s.open}h–${s.close}h`).replace(/{hotline}/g,s.hotline||'').replace(/{dang_ky}/g,s.signup||'')}
function fillVars(t,c,pf){return fillTpl(t,c.customer,PF[pf].n)}
function botReply(c,text,t=Date.now(),o={}){if(!o.test&&(!S.settings.botOn||c.botPaused))return null;const pf=o.pf||chOfConv(c).pf;const T=tok(text);const first=c.messages.filter(m=>m.from==='customer').length<=1;const off=o.forceOff!==undefined?o.forceOff:!inHours(t);
const act=S.scripts.filter(s=>s.on&&(!s.channels.length||s.channels.includes(pf))).sort((a,b)=>a.priority-b.priority);let hit=null;
for(const s of act){if(s.trigger==='offhours'&&off){hit=s;break}if(s.trigger==='keyword'&&s.keywords.split(',').some(k=>hasKw(T,k))){hit=s;break}if(s.trigger==='regex'&&s.keywords){try{if(new RegExp(s.keywords,'i').test(text)){hit=s;break}}catch(e){}}if(s.trigger==='welcome'&&first){hit=s;break}}
if(!hit)hit=act.find(s=>s.trigger==='fallback');if(!hit)return null;let txt=fillVars(hit.reply,c,pf);if(hit.trigger==='keyword'){const more=act.find(s=>s!==hit&&s.trigger==='keyword'&&s.action!=='handoff'&&s.keywords.split(',').some(k=>hasKw(T,k)));if(more)txt+='\n\n'+fillVars(more.reply,c,pf).replace(/^(Dạ chào|Xin chào|Chào) [^!,.]*[!,.]\s*/,'Ngoài ra, ')}let extra=null;if(hit.trigger==='offhours'){const ho=act.find(s=>s.trigger==='keyword'&&s.action==='handoff'&&s.keywords.split(',').some(k=>hasKw(T,k)));if(ho){extra=ho;txt+='\n\n'+fillVars(ho.reply,c,pf)}}return {script:hit,text:txt,extra}}
function applyBot(c,r){const s=r.script;c.messages.push({id:uid(),from:'bot',text:r.text,t:Date.now(),script:s.name,quick:s.quick?s.quick.split(',').map(x=>x.trim()).filter(Boolean):[]});s.hits=(s.hits||0)+1;c.tags=c.tags.filter(x=>x!=='Chưa xử lý');
if(s.action==='handoff'){if(!c.tags.includes('Cần nhân viên'))c.tags.push('Cần nhân viên');c.botPaused=true;c.unread=true}if(s.action==='tag'&&s.tagName&&!c.tags.includes(s.tagName))c.tags.push(s.tagName);if(s.action==='close')c.status='closed';if(r.extra){r.extra.hits=(r.extra.hits||0)+1;if(!c.tags.includes('Cần nhân viên'))c.tags.push('Cần nhân viên');c.botPaused=true;c.unread=true;c.status='open'}}
function incoming(c,text){c.messages.push({id:uid(),from:'customer',text,t:Date.now()});c.status='open';c.unread=true;const r=botReply(c,text);if(r)setTimeout(()=>{applyBot(c,r);save();if(route==='inbox')V.inbox();navRender()},900);else if(!c.tags.includes('Chưa xử lý'))c.tags.push('Chưa xử lý')}

/* ================= INBOX ================= */
const IB={sel:null,f:'all',role:'agent',q:'',limit:150};
V.inbox=()=>{const list=S.convos.filter(c=>IB.f==='all'||(IB.f==='open'&&c.status==='open')||(IB.f==='human'&&c.tags.includes('Cần nhân viên'))||(IB.f==='unread'&&c.unread)).filter(c=>!IB.q||norm(c.customer+' '+c.messages.map(m=>m.text).join(' ')).includes(norm(IB.q))).sort((a,b)=>last(b).t-last(a).t);
if(!IB.sel||!cv(IB.sel))IB.sel=list[0]?list[0].id:null;const c=IB.sel?cv(IB.sel):null;if(c&&c.unread){c.unread=false;save();navRender()}
$('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="seg">${[['all','Tất cả'],['open','Đang mở'],['unread','Chưa đọc'],['human','Cần nhân viên']].map(([k,l])=>`<button class="${IB.f===k?'on':''}" onclick="IB.f='${k}';V.inbox()">${l}</button>`).join('')}</div><div class="row"><span class="small">Bot tự động</span><label class="switch"><input type="checkbox" ${S.settings.botOn?'checked':''} onchange="S.settings.botOn=this.checked;save()"><span></span></label><button class="btn sm" onclick="simIncoming()">+ Mô phỏng tin nhắn đến</button></div></div>
<div class="inbox"><div class="clist"><div style="padding:8px"><input placeholder="🔍 Tìm khách hoặc nội dung (Enter)..." value="${esc(IB.q)}" onchange="IB.q=this.value;V.inbox()"></div>${list.slice(0,IB.limit).map(x=>{const ch=chOfConv(x),l=last(x);return `<div class="citem ${x.id===IB.sel?'on':''}" onclick="IB.sel='${x.id}';V.inbox()"><div class="row" style="gap:8px;flex-wrap:nowrap">${pfIcon(ch.pf)}<div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="${x.unread?'':'font-weight:500'}">${x.unread?'● ':''}${esc(x.customer)}</b><span class="small muted">${fmtT(l.t)}</span></div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.from==='bot'?'🤖 ':l.from==='agent'?'Bạn: ':''}${esc(l.text)}</div><div>${SENT_ICON[sentimentOf(x)]}${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${x.status==='closed'?'<span class="tag">Đã đóng</span>':''}</div></div></div></div>`}).join('')||'<p class="muted" style="padding:12px">Không có hội thoại</p>'}${list.length>IB.limit?`<div style="padding:10px;text-align:center"><button class="btn sm" id="ibmore" onclick="IB.limit+=150;V.inbox()">Xem thêm (${IB.limit}/${list.length})</button></div>`:''}</div>
<div class="chat">${c?chatPane(c):'<p class="muted" style="padding:20px">Chọn một hội thoại</p>'}</div></div>`;const ms=$('#msgs');if(ms)ms.scrollTop=ms.scrollHeight}
function chatPane(c){const ch=chOfConv(c);return `<div class="row" style="justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd)"><div class="row">${pfIcon(ch.pf)}<div><b>${esc(c.customer)}</b><div class="small muted">${esc(ch.name)} · ${PF[ch.pf].n}</div></div></div><div class="row"><label class="small row" style="margin:0;color:inherit"><input type="checkbox" style="width:auto" ${c.botPaused?'':'checked'} onchange="cv('${c.id}').botPaused=!this.checked;save()"> Bot cho hội thoại này</label><button class="btn sm" onclick="toggleTag('${c.id}','Cần nhân viên')">${c.tags.includes('Cần nhân viên')?'✓ ':''}Cần nhân viên</button><button class="btn sm" onclick="closeConv('${c.id}')">${c.status==='closed'?'Mở lại':'Đóng hội thoại'}</button></div></div>
<div class="msgs" id="msgs">${c.messages.map(m=>`<div class="m ${m.from}">${m.from==='bot'?`<div class="small" style="opacity:.7">🤖 Bot${m.script?' · '+esc(m.script):''}</div>`:''}${esc(m.text)}${m.quick&&m.quick.length?'<div>'+m.quick.map(q=>`<span class="qr">${esc(q)}</span>`).join('')+'</div>':''}<div class="t">${fmtT(m.t)}</div></div>`).join('')}${c.csat?`<div class="small muted" style="text-align:center;margin-top:8px">Khách đánh giá CSAT: ${'⭐'.repeat(c.csat)} (${c.csat}/5)</div>`:''}</div>
<div style="border-top:1px solid var(--bd);padding:10px"><div class="row" style="margin-bottom:6px"><div class="seg"><button class="${IB.role==='agent'?'on':''}" onclick="IB.role='agent';V.inbox()">Trả lời (nhân viên)</button><button class="${IB.role==='customer'?'on':''}" onclick="IB.role='customer';V.inbox()">Giả lập khách gửi</button></div><button class="btn sm" onclick="aiSuggest('${c.id}')">✨ AI gợi ý trả lời</button>${c.status==='closed'&&!c.csat?`<button class="btn sm" onclick="askCsat('${c.id}')">Gửi khảo sát CSAT</button>`:''}</div><div class="row" style="flex-wrap:nowrap"><textarea id="reply" style="min-height:44px;height:48px" placeholder="${IB.role==='agent'?'Nhập câu trả lời... (Enter để gửi)':'Nhập tin nhắn của khách (mô phỏng) để thử bot...'}" onkeydown="if(isEnter(event)&&!event.shiftKey){event.preventDefault();sendMsg('${c.id}')}"></textarea><button class="btn pri" onclick="sendMsg('${c.id}')">Gửi</button></div></div>`}
function sendMsg(id){const c=cv(id);const t=$('#reply').value.trim();if(!t)return;if(IB.role==='agent'){c.messages.push({id:uid(),from:'agent',text:t,t:Date.now()});c.tags=c.tags.filter(x=>x!=='Chưa xử lý')}else incoming(c,t);save();V.inbox()}
async function aiSuggest(id){try{const c=cv(id);const lc=[...c.messages].reverse().find(m=>m.from==='customer');const t=await AI.call('reply',{text:lc?lc.text:'',name:c.customer});if(IB.role!=='agent'){IB.role='agent';V.inbox()}$('#reply').value=t;$('#reply').focus()}catch(e){toast('Tác vụ AI chưa hoàn tất. Vui lòng thử lại.')}}
function toggleTag(id,tg){const c=cv(id);c.tags=c.tags.includes(tg)?c.tags.filter(x=>x!==tg):[...c.tags,tg];save();V.inbox()}
function closeConv(id){const c=cv(id);c.status=c.status==='closed'?'open':'closed';save();V.inbox()}
function askCsat(id){const c=cv(id);const se=sentimentOf(c);c.csat=se==='neg'?rnd(1,3):se==='pos'?rnd(4,5):rnd(3,5);c.messages.push({id:uid(),from:'bot',text:'Bạn đánh giá trải nghiệm hỗ trợ hôm nay thế nào? (1–5 ⭐)',t:Date.now(),script:'Khảo sát CSAT'});save();V.inbox();toast('Khách (mô phỏng) đã chấm '+c.csat+'/5')}
const SIMS=['Cho mình xin bảng giá cước gửi đi Hà Nội','Mình muốn làm đại lý thì chiết khấu thế nào?','Tra giúp mình mã vận đơn này','Tiền COD kỳ này đối soát bị thiếu','Phần mềm có dùng thử không?','Xin chào'];
function simIncoming(){const conn=S.channels.filter(c=>c.connected);if(!conn.length)return toast('Chưa có kênh kết nối');modal(`<h3>Mô phỏng tin nhắn đến</h3><label>Kênh</label><select id="si_ch">${conn.map(c=>`<option value="${c.id}">${PF[c.pf].n} – ${esc(c.name)}</option>`).join('')}</select><label>Tên khách</label><input id="si_n" value="Khách ${rnd(100,999)}"><label>Tin nhắn</label><textarea id="si_t" style="min-height:70px">${SIMS[0]}</textarea><div class="small" style="margin-top:6px">Mẫu: ${SIMS.map((x,i)=>`<a href="javascript:void(0)" class="tag" onclick="$('#si_t').value=SIMS[${i}]">${esc(x)}</a>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="doSim()">Gửi</button></div>`)}
function doSim(){const ch=$('#si_ch').value,n=$('#si_n').value.trim()||'Khách',t=$('#si_t').value.trim();if(!t)return;let c=S.convos.find(x=>x.ch===ch&&x.customer===n);if(!c){c={id:uid(),ch,customer:n,tags:[],status:'open',csat:null,messages:[],unread:true,botPaused:false};S.convos.push(c)}incoming(c,t);IB.sel=c.id;IB.f='all';save();closeModal();go('inbox')}

/* ================= RESPONSE METRICS ================= */
const RS={days:14,ch:'all'};
function metrics(list){const sla=S.settings.slaMin*6e4;let resp=0,slaOk=0,bot=0,hand=0,closed=0,inM=0,outM=0;const frt=[],cs=[],sent={pos:0,neu:0,neg:0},hours=Array(24).fill(0);
list.forEach(c=>{const f=c.messages.find(m=>m.from==='customer');if(!f)return;c.messages.forEach(m=>{if(m.from==='customer'){inM++;hours[new Date(m.t).getHours()]++}else outM++});const r=c.messages.find(m=>m.from!=='customer'&&m.t>=f.t);if(r){resp++;const d=r.t-f.t;frt.push(d);if(d<=sla)slaOk++}
const reps=c.messages.filter(m=>m.from!=='customer');if(reps.length&&reps.every(m=>m.from==='bot')&&!c.tags.includes('Cần nhân viên'))bot++;if(c.tags.includes('Cần nhân viên'))hand++;if(c.csat)cs.push(c.csat);if(c.status==='closed')closed++;sent[sentimentOf(c)]++});
frt.sort((a,b)=>a-b);const n=list.length,q=p=>frt.length?frt[Math.min(frt.length-1,Math.floor(frt.length*p))]:0;
return {n,resp,unanswered:n-resp,rate:n?resp/n:0,avg:frt.length?frt.reduce((a,b)=>a+b,0)/frt.length:0,med:q(.5),p90:q(.9),sla:resp?slaOk/resp:0,bot:n?bot/n:0,hand:n?hand/n:0,closed:n?closed/n:0,csat:cs.length?cs.reduce((a,b)=>a+b,0)/cs.length:0,csatPos:cs.length?cs.filter(x=>x>=4).length/cs.length:0,csN:cs.length,sent,inM,outM,hours}}
function qScore(M){if(!M.n)return 0;return Math.round(100*(.3*M.rate+.25*M.sla+.25*(M.csN?M.csat/5:M.rate)+.2*(1-M.sent.neg/M.n)))}

const eb={};S.posts.filter(p=>p.status==='published'&&p.time>=since).forEach(p=>Object.entries(p.metrics).forEach(([id,m])=>{const c=chById(id);if(!c||(RS.ch!=='all'&&id!==RS.ch))return;const b=eb[c.pf]||(eb[c.pf]={views:0,likes:0,comments:0,shares:0,n:0});for(const k in LBL)b[k]+=m[k];b.n++}));

V.hashtags=()=>{$('#view').innerHTML=`<div class="card"><h3>Tạo bộ hashtag</h3><div class="grid g2"><div><label>Tên bộ</label><input id="hs_n" placeholder="VD: Đại lý cước"></div><div><label>Hashtag (cách nhau bởi dấu cách)</label><input id="hs_t" placeholder="#ootd #fashion"></div></div><div style="margin-top:10px"><button class="btn pri" onclick="addHs()">Thêm bộ hashtag</button></div></div>${S.hashtags.map(h=>`<div class="card row" style="justify-content:space-between"><div><b>${esc(h.name)}</b><div>${h.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><button class="btn sm danger" onclick="S.hashtags=S.hashtags.filter(x=>x.id!=='${h.id}');save();V.hashtags()">Xóa</button></div>`).join('')}`}
function addHs(){const n=$('#hs_n').value.trim(),t=$('#hs_t').value.split(/[\s,]+/).filter(Boolean).map(x=>x.startsWith('#')?x:'#'+x);if(!n||!t.length)return toast('Nhập tên và hashtag');S.hashtags.push({id:uid(),name:n,tags:t});save();V.hashtags()}
V.settings=()=>{const s=S.settings;$('#view').innerHTML=`<div class="card"><h3>🏢 Hồ sơ doanh nghiệp & quy tắc nội dung</h3><p class="small muted">Được lưu thành quy tắc: AI tạo nội dung, chatbot và gợi ý trả lời đều dùng các thông tin này (và gửi kèm tới endpoint AI nếu có).</p>
<div class="grid g3"><div><label>Tên thương hiệu (biến {shop})</label><input id="st_b" value="${esc(s.brand)}"></div><div><label>Hotline (biến {hotline})</label><input id="st_hl" value="${esc(s.hotline)}"></div><div><label>Link đăng ký (biến {dang_ky})</label><input id="st_su" value="${esc(s.signup)}"></div></div>
<label>Mô tả doanh nghiệp / sản phẩm</label><textarea id="st_desc" style="min-height:60px">${esc(s.desc)}</textarea>
<div class="grid g2"><div><label>Khách hàng mục tiêu</label><input id="st_aud" value="${esc(s.audience)}"></div><div><label>Giọng văn mặc định của AI</label><select id="st_t">${Object.entries(TONES).map(([k,v])=>`<option value="${k}" ${k===s.tone?'selected':''}>${v}</option>`).join('')}</select></div></div>
<label>Điểm nổi bật mặc định (cách nhau dấu phẩy)</label><input id="st_ft" value="${esc(s.features)}">
<label>Quy tắc nội dung bắt buộc</label><textarea id="st_rules" style="min-height:130px">${esc(s.rules)}</textarea>
<div class="row" style="margin-top:10px"><button class="btn pri" onclick="saveProfile()">Lưu quy tắc</button><button class="btn" onclick="ask('Khôi phục hồ sơ ShopTrack mặc định?',()=>{Object.assign(S.settings,DEFAULT_PROFILE);save();V.settings();toast('Đã khôi phục')})">Khôi phục mặc định ShopTrack</button><button class="btn" onclick="ask('Thay toàn bộ kịch bản chatbot bằng bộ kịch bản ShopTrack mặc định?',()=>{S.scripts=defaultScripts();save();toast('Đã nạp bộ kịch bản ShopTrack')})">Nạp lại kịch bản chatbot ShopTrack</button></div></div>
<div class="card"><h3>Kết nối AI (LLM)</h3><p class="small muted">Mặc định app dùng engine mẫu nội bộ chạy offline. Để dùng LLM thật (OpenAI, Gemini, Claude…), hãy dựng một endpoint backend của riêng bạn – <b>giữ API key ở server, không đặt key trong trình duyệt</b>. Endpoint nhận <code>POST {"task": "generate|improve|adapt|reply", ...dữ liệu}</code> và trả về <code>{"text": "..."}</code>.</p><label>URL endpoint AI</label><input id="st_ai" value="${esc(effectiveAIEndpoint())}" ${managedAIEndpoint()?'readonly':''} placeholder="/ai (trên hostname được Cloudflare Access bảo vệ)"><div class="row" style="margin-top:10px"><button class="btn pri" onclick="if(managedAIEndpoint()){toast('Endpoint được quản lý cùng origin');return}S.settings.aiEndpoint=$('#st_ai').value.trim();save();toast('Đã lưu endpoint')">Lưu</button><button class="btn" onclick="testAI()">Kiểm tra kết nối</button></div></div>
<div class="card"><h3>Dữ liệu</h3><p class="small muted">Dữ liệu và file gốc được lưu trong trình duyệt này (IndexedDB, dự phòng localStorage) – chưa đồng bộ giữa các thiết bị. Hãy Xuất JSON định kỳ để sao lưu (file gốc không nằm trong JSON).</p><div class="row"><button class="btn" onclick="exportData()">⬇ Xuất JSON</button><button class="btn" onclick="$('#imp').click()">⬆ Nhập JSON</button><input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(this.files[0])"><button class="btn danger" onclick="ask('Xóa toàn bộ và tạo lại dữ liệu demo?',()=>{S=migrate3(seed());Object.keys(BLOBS).forEach(k=>delete BLOBS[k]);IDB.clear('files');save();render();toast('Đã đặt lại dữ liệu demo')})">Đặt lại dữ liệu demo</button></div></div>
<div class="card"><h3>🧪 Kiểm thử tự động</h3><p class="small muted">Bộ kiểm thử tích hợp chạy ngay trong trình duyệt: điều hướng, soạn bài, lên lịch, chatbot, Kho, bảo mật, lưu trữ, hiệu năng. Chạy trên bản sao dữ liệu demo – không ảnh hưởng dữ liệu thật.</p><button class="btn pri" onclick="go('qa')">Mở trang kiểm thử</button></div>`}
async function testAI(){if(window.QA_RUNNING)return toast('Không gọi AI thật khi chạy QA demo');const ep=managedAIEndpoint()||$('#st_ai').value.trim();if(!ep)return toast('Chưa nhập endpoint');try{const target=new URL(ep,location.href);if(target.origin!==location.origin)throw new Error('Hãy mở giao diện tại hostname Cloudflare Access cùng origin');const r=await fetch(target.href,{method:'POST',credentials:'same-origin',redirect:'error',signal:AbortSignal.timeout(45000),headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'reply',text:'Xin chào',name:'Kiểm tra kết nối'})});if(!r.ok)throw new Error('HTTP '+r.status);if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('Phản hồi không phải JSON');const j=await r.json();if(!j||typeof j.text!=='string'||!j.text.trim())throw new Error('Không có nội dung AI');aiConnectionStatus('Kết nối AI đám mây trả về nội dung hợp lệ.');toast('Kết nối AI thành công')}catch(e){aiConnectionStatus('Không kết nối được AI đám mây. Vui lòng đăng nhập lại hoặc thử lại sau.',true);toast('Không kết nối được: '+e.message)}}
function saveProfile(){const s=S.settings;s.brand=$('#st_b').value.trim()||'ShopTrack';s.hotline=$('#st_hl').value.trim();s.signup=$('#st_su').value.trim();s.desc=$('#st_desc').value.trim();s.audience=$('#st_aud').value.trim();s.features=$('#st_ft').value.trim();s.rules=$('#st_rules').value.trim();s.tone=$('#st_t').value;save();toast('Đã lưu quy tắc')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shopai-data.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(![2,3].includes(s.v)||!Array.isArray(s.posts))throw 0;S=s.v===3?fixState(s):migrate3(s);save();render();toast('Đã nhập dữ liệu')}catch(e){toast('File không hợp lệ')}};r.readAsText(f)}


/* ================= KHO TÀI NGUYÊN ================= */
function assetStatusMap(){const m={};S.posts.forEach(p=>(p.assets||[]).forEach(id=>{if(p.status==='published')m[id]='published';else if(p.status==='scheduled'&&m[id]!=='published')m[id]='scheduled'}));return m}
function assetPosts(id){return S.posts.filter(p=>(p.assets||[]).includes(id))}
function fmtSize(b){if(!b)return '–';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB'}
const folderName=id=>(S.folders.find(f=>f.id===id)||{name:'Chưa phân loại'}).name;
const aById=id=>S.assets.find(x=>x.id===id);
const splitTags=v=>String(v||'').split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean);
const LB={folder:'all',q:'',type:'all',status:'all',source:'all',date:'all',from:'',to:'',tag:'all',sort:'new',group:'day',view:'grid',sel:new Set(),limit:120};
function lbFilter(sm){const now=new Date();const sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();let a0=-Infinity,a1=Infinity;
if(LB.date==='today')a0=sod;else if(LB.date==='7')a0=sod-6*DAY;else if(LB.date==='30')a0=sod-29*DAY;else if(LB.date==='month')a0=new Date(now.getFullYear(),now.getMonth(),1).getTime();else if(LB.date==='custom'){if(LB.from)a0=new Date(LB.from+'T00:00').getTime();if(LB.to)a1=new Date(LB.to+'T23:59:59').getTime()}
const q=norm(LB.q);const l=S.assets.filter(a=>(LB.folder==='all'||(LB.folder==='none'?!S.folders.some(f=>f.id===a.folder):a.folder===LB.folder))&&(LB.type==='all'||a.kind===LB.type)&&(LB.status==='all'||(sm[a.id]||'unused')===LB.status)&&(LB.source==='all'||a.source===LB.source)&&(LB.tag==='all'||a.tags.includes(LB.tag))&&a.created>=a0&&a.created<=a1&&(!q||norm(a.name+' '+(a.text||'')+' '+a.tags.join(' ')).includes(q)));
const so={new:(x,y)=>y.created-x.created,old:(x,y)=>x.created-y.created,name:(x,y)=>x.name.localeCompare(y.name,'vi'),size:(x,y)=>(y.size||0)-(x.size||0)}[LB.sort];return l.sort(so)}
function groupKey(a,sm){const d=new Date(a.created);switch(LB.group){case 'day':{const t=new Date();const sod=new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();const ds=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();return [ds,ds===sod?'Hôm nay':ds===sod-DAY?'Hôm qua':d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})]}
case 'month':return [d.getFullYear()*12+d.getMonth(),`Tháng ${d.getMonth()+1}/${d.getFullYear()}`];case 'type':return [a.kind,KICON[a.kind]+' '+KIND[a.kind]];case 'status':{const s=sm[a.id]||'unused';return [s,ASTAT[s]]}case 'folder':return [a.folder||'none','📁 '+folderName(a.folder)];case 'source':return [a.source,SRC[a.source]];default:return ['all','Tất cả']}}
function assetThumb(a,h){const src=a.thumb||(a.kind==='image'&&a.url)||'';if(src)return `<img src="${esc(src)}" style="width:100%;height:${h}px;object-fit:cover;display:block" loading="lazy">`;if(a.kind==='video'&&(BLOBS[a.id]||a.url))return `<video src="${esc(BLOBS[a.id]||a.url)}" style="width:100%;height:${h}px;object-fit:cover;display:block" muted></video>`;if(a.kind==='text')return `<div style="height:${h}px;padding:10px;font-size:12px;overflow:hidden;background:#fafafa;white-space:pre-wrap;color:#333">${esc((a.text||'').slice(0,220))}</div>`;return `<div style="height:${h}px;display:grid;place-items:center;font-size:42px;background:#f3f3f5">${KICON[a.kind]}</div>`}
function assetCard(a,sm){const s=sm[a.id]||'unused';const on=LB.sel.has(a.id);return `<div class="card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')" style="padding:0;margin:0;overflow:hidden;cursor:pointer;${on?'outline:2px solid #4f46e5':''}" onclick="lbOpen('${a.id}')"><div style="position:relative">${assetThumb(a,130)}<input type="checkbox" style="position:absolute;top:8px;left:8px;width:18px;height:18px" ${on?'checked':''} onclick="event.stopPropagation();lbToggle('${a.id}',this.checked)"><span class="tag ${ASTC[s]}" style="position:absolute;top:6px;right:6px">${ASTAT[s]}</span></div><div style="padding:8px 10px"><div class="small" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(a.name)}">${KICON[a.kind]} ${esc(a.name)}</div><div class="small muted">${new Date(a.created).toLocaleDateString('vi-VN')} · ${fmtSize(a.size)} · ${SRC[a.source]}</div></div></div>`}
function assetTable(items,sm){return `<div class="card" style="padding:0;overflow:auto"><table><tr><th></th><th>Tên</th><th>Loại</th><th>Thư mục</th><th>Ngày tạo</th><th>Trạng thái</th><th>Nguồn</th><th>Dung lượng</th></tr>${items.map(a=>{const s=sm[a.id]||'unused';return `<tr draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')"><td><input type="checkbox" style="width:auto" ${LB.sel.has(a.id)?'checked':''} onchange="lbToggle('${a.id}',this.checked)"></td><td><a href="javascript:void(0)" onclick="lbOpen('${a.id}')">${KICON[a.kind]} ${esc(a.name)}</a>${a.tags.length?'<div>'+a.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')+'</div>':''}</td><td>${KIND[a.kind]}</td><td>${esc(folderName(a.folder))}</td><td>${fmtT(a.created)}</td><td><span class="tag ${ASTC[s]}">${ASTAT[s]}</span></td><td>${SRC[a.source]}</td><td>${fmtSize(a.size)}</td></tr>`}).join('')}</table></div>`}
V.library=()=>{const sm=assetStatusMap();const list=lbFilter(sm);const ids=new Set(S.assets.map(a=>a.id));[...LB.sel].forEach(id=>{if(!ids.has(id))LB.sel.delete(id)});
const groups=new Map();const shown=list.slice(0,LB.limit);shown.forEach(a=>{const [k,l]=groupKey(a,sm);if(!groups.has(k))groups.set(k,{l,items:[]});groups.get(k).items.push(a)});
const cnt={all:S.assets.length,none:S.assets.filter(a=>!S.folders.some(f=>f.id===a.folder)).length};S.folders.forEach(f=>cnt[f.id]=S.assets.filter(a=>a.folder===f.id).length);
const st={unused:0,scheduled:0,published:0};S.assets.forEach(a=>st[sm[a.id]||'unused']++);const totalSize=S.assets.reduce((s,a)=>s+(a.size||0),0);const tags=[...new Set(S.assets.flatMap(a=>a.tags))].sort();
const sel=(n,o)=>`<select style="width:auto" onchange="LB.${n}=this.value;V.library()">${o.map(([v,l])=>`<option value="${v}" ${LB[n]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const curF=LB.folder!=='all'&&LB.folder!=='none';
$('#view').innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px">${kp('Tổng tài nguyên',S.assets.length,`<span class="d muted">${fmtSize(totalSize)}</span>`)}${kp('Chưa dùng',st.unused,'')}${kp('Sắp đăng',st.scheduled,'')}${kp('Đã đăng',st.published,'')}</div>
<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Thêm tài nguyên</h3><span class="small muted">Ảnh được nén ≤ 800px để lưu trong trình duyệt</span></div>

<div><div class="grid g2" style="gap:8px">${Object.entries(CONN).map(([k,c])=>{const a=S.connectors[k];return `<div class="ch" style="margin:0;flex-direction:column;align-items:flex-start;gap:4px"><b class="small">${c.ic} ${c.n}</b><span class="small muted" style="word-break:break-all">${a?esc(a):'Chưa kết nối'}</span><div class="row" style="gap:4px">${a?`<button class="btn sm pri" onclick="lbImport('${k}')">Nhập</button><button class="btn sm" onclick="S.connectors.${k}=null;save();V.library()">Ngắt</button>`:`<button class="btn sm" onclick="lbConnect('${k}')">Kết nối</button>`}</div></div>`}).join('')}</div>
<div class="row" style="margin-top:8px"><button class="btn sm" onclick="lbAddText()">📝 Thêm nội dung văn bản</button><button class="btn sm" onclick="lbAddUrl()">🔗 Thêm từ URL</button></div></div></div></div>

${[['all','🗂️ Tất cả'],...S.folders.map(f=>[f.id,'📁 '+f.name]),['none','📂 Chưa phân loại']].map(([id,l])=>`<a href="javascript:void(0)" class="${LB.folder===id?'on':''}" onclick="LB.folder='${id}';V.library()" ondragover="event.preventDefault()" ondrop="lbDrop(event,'${id}')"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</span><span class="small muted">${cnt[id]||0}</span></a>`).join('')}</div>
${curF?`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="lbRenameFolder()">Đổi tên</button><button class="btn sm danger" onclick="lbDelFolder()">Xóa</button></div>`:''}<div class="small muted" style="margin-top:10px;padding:0 4px">Mẹo: kéo thẻ tài nguyên (hoặc cả nhóm đang chọn) thả vào thư mục để di chuyển.</div></div>
<div><div class="card" style="padding:12px"><div class="row"><input placeholder="🔍 Tìm theo tên, nội dung, nhãn..." value="${esc(LB.q)}" onchange="LB.q=this.value;V.library()" style="flex:1;min-width:180px;width:auto">
${sel('type',[['all','Tất cả loại'],...Object.entries(KIND)])}${sel('status',[['all','Mọi trạng thái'],...Object.entries(ASTAT)])}${sel('date',[['all','Mọi ngày tạo'],['today','Hôm nay'],['7','7 ngày qua'],['30','30 ngày qua'],['month','Tháng này'],['custom','Tùy chọn…']])}
${LB.date==='custom'?`<input type="date" style="width:auto" value="${LB.from}" onchange="LB.from=this.value;V.library()"><input type="date" style="width:auto" value="${LB.to}" onchange="LB.to=this.value;V.library()">`:''}${sel('source',[['all','Mọi nguồn'],...Object.entries(SRC)])}${sel('tag',[['all','Mọi nhãn'],...tags.map(t=>[t,'#'+t])])}</div>
